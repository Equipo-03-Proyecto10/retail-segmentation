# Blank issues stay enabled deliberately.
#
# The two forms cover what the course grades: user stories and the defect log.
# They do not cover a spike, a chore, or "the professor said something in class
# that contradicts the backlog" — and forcing those through a user story form
# produces fake stories, which is worse than an unstructured issue.
blank_issues_enabled: true

contact_links:
  - name: Architectural decision
    url: https://github.com/Equipo-03-Proyecto10/retail-segmentation/tree/develop/docs/adr
    about: >-
      A decision other work inherits belongs in an ADR, not an issue. Copy
      template.md, number it, open a pull request. ADRs are immutable once
      Accepted — supersede, never edit.
  - name: Scope question
    url: https://github.com/Equipo-03-Proyecto10/retail-segmentation/blob/develop/docs/scope.md
    about: >-
      Something that may or may not be in the delivery goes in §8 with a working
      assumption. Work does not stop waiting for an answer.
  - name: Deferred to a later delivery
    url: https://github.com/Equipo-03-Proyecto10/retail-segmentation/blob/develop/docs/roadmap.md
    about: >-
      RFM, clustering, segment history and dashboards are already planned. Do
      not open a story to build them now.
