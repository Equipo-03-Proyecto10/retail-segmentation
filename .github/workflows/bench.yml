# The bench-only Rust twin of the products reads (F15-01, ADR-0042). Two things
# run here, and neither is a required check: a benchmark must never block a
# products-service release. Nothing here pushes an image.
#
# 1. `twin`: the twin's Rust gates, conformance and ADR-0042's compliance
#    checks, on every pull request that touches bench/ or the contract the twin
#    follows.
# 2. The full comparison of Flask and the twin (F15-03, #751): `images` builds
#    the three images once, `bench` runs the benchmark on a GitHub-hosted
#    ubuntu-24.04 runner (x86-64, 4 vCPU, cgroup v2 with the memory controller),
#    where ADR-0042's 160 MB limit is enforced and read back for both builds,
#    and `report` gathers the raw results and the tables into one artifact.
#    It takes about 40 minutes of wall clock, so it does not run on every bench
#    pull request. It runs
#    - on `workflow_dispatch` (Actions > Bench > Run workflow, once this file is
#      on the default branch), with the settings below as inputs, and
#    - on a pull request whose head branch name contains `bench-rerun`: the
#      way to run it from a branch before it is merged, since a workflow can
#      only be dispatched from the default branch.
#    One shard per scenario and format, each on its own runner, so five
#    calibration passes and five repetitions fit the time. Both builds always
#    share a shard's runner, in alternating order.
name: Bench

on:
  pull_request:
    paths:
      - bench/**
      # The raw results and the report are committed after a run; they are not
      # a reason to run it again.
      - "!bench/results/**"
      - contracts/products/**
      - .github/workflows/bench.yml
  workflow_dispatch:
    inputs:
      reps:
        description: Measured repetitions per build, format and scenario
        default: "5"
      warmup_seconds:
        description: Warm-up before each measured run
        default: "15"
      measure_seconds:
        description: Measured phase of each run
        default: "60"
      cal_passes:
        description: Times the saturation calibration is repeated
        default: "5"
      cal_step_seconds:
        description: Seconds per calibration step
        default: "5"

permissions:
  contents: read

# A newer push to the same branch replaces a run in flight.
concurrency:
  group: bench-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  twin:
    name: Products twin — Rust gates, conformance and ADR-0042 checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      DIR: bench/products-service-rs
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the contract tools and the suite's requirements
        run: |
          pip install -r web/requirements-dev.txt -r contracts/requirements.txt
          bash contracts/install-tools.sh

      - name: Never registered, routed, deployed or pushed; reads only
        env:
          # In a variable, so the check below does not find its own text.
          TWIN: products-service-rs
        run: |
          set -euo pipefail
          out=$(
            grep -rnE "5103|$TWIN" contracts/registry.yaml services/*/nginx/ deploy/ .github/workflows/deploy-service.yml 2>/dev/null || true
            grep -rnE "$TWIN" .github/workflows/ | grep -iE 'ghcr|push' || true
            yq -r '.services | to_entries[] | select((.value.profiles // []) | index("bench") | not) | .key' bench/compose.yaml
            yq -r --arg twin "$TWIN" '.services[$twin].ports[]' bench/compose.yaml | grep -vx '127.0.0.1:5103:5103' || true
            grep -rnE '\.(post|put|patch|delete)\(' bench/products-service-rs/src/ || true
          )
          # ADR-0042's "exactly the six" applies as a subset until all six exist.
          for crate in services/*/Cargo.toml; do
            name=$(basename "$(dirname "$crate")")
            case " audit-trail check-ins customer-preferences segments stock stores " in
              *" $name "*) ;;
              *) out+=$'\n'"FAIL: $name is a Rust production service outside ADR-0034's six" ;;
            esac
          done
          if [ -n "$(printf '%s' "$out" | tr -d '[:space:]')" ]; then printf '%s\n' "$out"; exit 1; fi

      - name: Load PostgreSQL scripts
        run: |
          psql -v ON_ERROR_STOP=1 -f sql/00_create_database.sql
          psql -v ON_ERROR_STOP=1 -d retail -f sql/01_schema.sql
          psql -v ON_ERROR_STOP=1 -d retail -f sql/02_seed_30_per_table.sql

      - name: Rust gates — fmt, clippy, test
        working-directory: ${{ env.DIR }}
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/retail
          MOSAIQ_REQUIRE_POSTGRES: "1"
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libclang-dev libxml2-dev pkg-config
          channel=$(sed -n 's/^FROM rust:\([0-9.]*\)-.*/\1/p' Dockerfile | head -1)
          rustup toolchain install "$channel" --profile minimal --component clippy,rustfmt
          export RUSTUP_TOOLCHAIN=$channel
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

      - name: Build the twin's image from its own directory (not pushed)
        run: |
          set -euo pipefail
          rm -rf "$DIR/contracts" && mkdir -p "$DIR/contracts/common"
          cp -R contracts/products "$DIR/contracts/products"
          cp -R contracts/common/v1 "$DIR/contracts/common/v1"
          docker build -t products-service-rs:ci "$DIR"

      # tests/conformance/stack.sh keys on <dir>/redis/<name>.acl, so the twin
      # runs from a staged directory holding bench/redis/products-bench.acl.
      - name: Shared conformance suite against the twin
        env:
          CONFORMANCE_CONTRACT_DIR: contracts/products
        run: |
          set -euo pipefail
          staged="$RUNNER_TEMP/products-bench"
          mkdir -p "$staged/redis"
          cp bench/redis/products-bench.acl "$staged/redis/products-bench.acl"
          bash tests/conformance/run.sh products-service-rs:ci "$staged" 5103

  # The full comparison (see the head of this file for when it runs). The three
  # images are built once from the commit under test and handed to every shard,
  # so both builds are the same bytes everywhere. Their names come from
  # bench/compose.yaml; the twin's image is never pushed.
  images:
    name: Full comparison — build the three images
    if: github.event_name == 'workflow_dispatch' || contains(github.head_ref, 'bench-rerun')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TWIN: products-service-rs
    steps:
      - uses: actions/checkout@v5

      - name: Build the images in parallel and save them
        run: |
          set -euo pipefail
          export AUTH_TAG=$(cat services/auth/VERSION) PRODUCTS_TAG=$(cat services/products/VERSION)
          config=$(docker compose -f bench/compose.yaml --profile bench config --format json)
          pids=()
          images=()
          for svc in auth products; do
            bash .github/scripts/stage-contracts.sh "$svc"
            image=$(jq -r --arg s "$svc" '.services[$s].image' <<<"$config")
            docker build --quiet -t "$image" "services/$svc" &
            pids+=($!)
            images+=("$image")
          done
          # The twin's build context carries its contract (ADR-0045), as bench/conformance.sh stages it.
          rm -rf "bench/$TWIN/contracts"
          mkdir -p "bench/$TWIN/contracts/common"
          cp -R contracts/products "bench/$TWIN/contracts/products"
          cp -R contracts/common/v1 "bench/$TWIN/contracts/common/v1"
          docker compose -f bench/compose.yaml --profile bench build --quiet "$TWIN" &
          pids+=($!)
          images+=("$(jq -r --arg s "$TWIN" '.services[$s].image' <<<"$config")")
          for pid in "${pids[@]}"; do wait "$pid"; done
          docker image ls
          docker save "${images[@]}" | gzip -1 >images.tar.gz
          ls -lh images.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: bench-images
          path: images.tar.gz
          compression-level: 0
          retention-days: 1

  bench:
    name: Full comparison — ${{ matrix.scenario }} ${{ matrix.format }}
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        scenario: [list, search, filter, detail]
        format: [json, xml]
    env:
      # ADR-0042 asks for 30 s of warm-up, 2 minutes measured and a calibration
      # step of 10 s; five calibration passes and five repetitions of those
      # would take hours on one runner, so a shard runs 15 s and 60 s, and
      # steps of 5 s (docs/evidence/products-reads-flask-vs-rust-x86.md).
      BENCH_REPS: ${{ inputs.reps || '1' }}
      BENCH_WARMUP_SECONDS: ${{ inputs.warmup_seconds || '5' }}
      BENCH_MEASURE_SECONDS: ${{ inputs.measure_seconds || '20' }}
      BENCH_CAL_PASSES: ${{ inputs.cal_passes || '1' }}
      BENCH_CAL_STEP_SECONDS: ${{ inputs.cal_step_seconds || '5' }}
      BENCH_COLDSTART_RUNS: "1"
      BENCH_SETTLE_SECONDS: "3"
      BENCH_SCENARIOS: ${{ matrix.scenario }}
      BENCH_FORMATS: ${{ matrix.format }}
      BENCH_OUT: bench/results/${{ matrix.scenario }}-${{ matrix.format }}
      # The images were built and loaded; nothing is rebuilt here.
      BENCH_NO_BUILD: "1"
      # The default full ramp, to see where each build saturates on this runner.
      BENCH_CAL_RATES: "10,20,40,60,80,120,160,240,320,480,640,960,1280,1920"
      # Never BENCH_ALLOW_NO_MEMLIMIT: this job fails if the limit is not enforced.
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the suite's requirements and tools
        run: |
          pip install -r web/requirements-dev.txt -r contracts/requirements.txt
          bash contracts/install-tools.sh

      - uses: actions/download-artifact@v4
        with:
          name: bench-images

      - name: Load the images
        run: |
          set -euo pipefail
          gunzip -c images.tar.gz | docker load
          rm images.tar.gz

      - name: The machine the numbers come from
        run: |
          set -euo pipefail
          uname -a
          lscpu
          lscpu -e
          echo "cgroup controllers: $(cat /sys/fs/cgroup/cgroup.controllers)"
          docker info --format 'driver {{.CgroupDriver}}, cgroup v{{.CgroupVersion}}, {{.NCPU}} CPUs, {{.MemTotal}} bytes'
          free -m
          swapon --show || true

      - name: Conformance, fairness settings, calibration and measured runs
        run: bash bench/run.sh

      - name: What the containers logged
        if: failure()
        run: |
          docker compose -f bench/compose.yaml -f bench/compose.pinned.yaml --profile bench logs --no-color --tail 100 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shard-${{ matrix.scenario }}-${{ matrix.format }}
          path: bench/results/${{ matrix.scenario }}-${{ matrix.format }}
          retention-days: 30

  report:
    name: Full comparison — the tables
    needs: [images, bench]
    if: ${{ !cancelled() && needs.images.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: shards

      - name: Tables, from the raw results of every shard
        run: |
          set -euo pipefail
          mkdir results
          for dir in shards/shard-*; do mv "$dir" "results/${dir#shards/shard-}"; done
          python3 bench/aggregate.py report results | tee results/report.md >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: results
          retention-days: 30
