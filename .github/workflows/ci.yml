name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  compose:
    name: Compose application and proxy smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Boot from documented safe defaults
        run: |
          cp .env.example .env
          docker compose -f compose.yaml -f compose.proxy.yaml up --build --wait --wait-timeout 180
      - name: Application serves HTML directly and through NGINX
        run: |
          curl --fail --retry 12 --retry-connrefused --retry-delay 2 http://127.0.0.1:8000/login -o /tmp/direct.html
          curl --fail --retry 12 --retry-connrefused --retry-delay 2 http://127.0.0.1:8080/login -o /tmp/proxy.html
          grep -q MOSAIQ /tmp/direct.html
          grep -q MOSAIQ /tmp/proxy.html
          docker compose exec -T web flask --app web.app account-report
      - name: Capture execution evidence
        if: always()
        run: docker compose -f compose.yaml -f compose.proxy.yaml logs --no-color
      - name: Stop the isolated stack
        if: always()
        run: docker compose -f compose.yaml -f compose.proxy.yaml down --volumes

  quality:
    name: Format, lint and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            web/requirements-dev.txt
            contracts/requirements.txt
      - run: pip install -r web/requirements-dev.txt -r contracts/requirements.txt
      - run: bash contracts/install-tools.sh
      - name: Report contract tool versions
        run: |
          jq --version
          yq --version
          oasdiff --version
          openapi-spec-validator --version
          xmllint --version
      - run: black --check .
      - run: ruff check .

      # pytest exits 5 when it collects nothing, which is the correct state
      # until the first test lands. Skipped explicitly rather than by swallowing
      # the exit code, so a real collection error still fails the build.
      - name: Tests
        run: |
          if [ -n "$(find . -name 'test_*.py' -not -path './.venv/*' -print -quit)" ]; then
            pytest --junitxml=test-results/pytest.xml
          else
            echo "No tests yet — nothing to run."
          fi

      - name: Capture per-case test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: test-results/pytest.xml
          if-no-files-found: ignore

  contracts:
    name: Contract conventions and stream registry
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: contracts/requirements.txt
      - run: pip install -r contracts/requirements.txt
      - run: bash contracts/install-tools.sh
      - name: Report pinned tool versions
        run: |
          jq --version
          yq --version
          oasdiff --version
          openapi-spec-validator --version
          xmllint --version
      - name: Contract checks stay silent
        run: |
          run_quiet() {
            set +e
            output="$("$@" 2>&1)"
            status=$?
            set -e
            if [ "$status" -ne 0 ] || [ -n "$output" ]; then
              printf '%s\n' "$output"
              return 1
            fi
          }
          run_quiet bash contracts/check.sh
          run_quiet bash contracts/streams/check_streams.sh

  # The repository rules of the distributed stage, as greps over tracked
  # files, and ADR-0040's memory gate (F13-09). guards.sh prints nothing when
  # every rule holds; the gate prints the mem_limit total.
  guards:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: contracts/requirements.txt
      - run: pip install -r contracts/requirements.txt
      - name: Repository guards stay silent
        run: bash .github/scripts/guards.sh
      - name: Every mem_limit sums to at most 3,000 MB
        run: python3 .github/scripts/memory_gate.py

  database:
    name: SQL scripts run clean from empty
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v5

      # Definition of Done item 3: the three scripts run clean, in order,
      # against an empty database. This is what stops a schema edit from being
      # merged in a state that only works on the author's machine.
      - name: Run the scripts in order
        run: |
          if [ ! -f sql/01_schema.sql ]; then
            echo "sql/ does not exist yet — Phase 2 has not landed."
            exit 0
          fi
          psql -v ON_ERROR_STOP=1 -f sql/00_create_database.sql
          psql -v ON_ERROR_STOP=1 -d retail -f sql/01_schema.sql
          psql -v ON_ERROR_STOP=1 -d retail -f sql/02_seed_30_per_table.sql

      # Fail when the seed or a schema change leaves assignment history at odds
      # with its runs or ADR-0018's label contract, printing the offending rows.
      - name: Seed satisfies the ADR compliance queries
        run: |
          violations="$(
            psql -v ON_ERROR_STOP=1 -d retail -At -F ' | ' <<'SQL'
          SELECT 'ADR-0017 multiple open rows', customer_id, count(*)
          FROM customer_segment_history
          WHERE valid_to IS NULL
          GROUP BY customer_id
          HAVING count(*) > 1;

          SELECT 'ADR-0017 run count mismatch', r.run_id,
                 r.customer_count, count(h.run_id)
          FROM segmentation_run AS r
          LEFT JOIN customer_segment_history AS h ON h.run_id = r.run_id
          GROUP BY r.run_id, r.customer_count
          HAVING count(h.run_id) <> r.customer_count;

          SELECT 'ADR-0018 unknown label', h.customer_id, h.run_id, h.label_code
          FROM customer_segment_history AS h
          WHERE h.label_code IS NOT NULL
            AND h.label_code NOT IN (SELECT label_code FROM segment_label);

          SELECT 'ADR-0018 unassigned row has score', h.customer_id, h.run_id
          FROM customer_segment_history AS h
          WHERE h.label_code IS NULL
            AND h.r_score IS NOT NULL;

          SELECT 'ADR-0020 total disagrees with lines', t.transaction_id,
                 t.total, COALESCE(SUM(l.quantity * l.unit_price), 0)
          FROM transaction AS t
          LEFT JOIN transaction_line AS l ON l.transaction_id = t.transaction_id
          GROUP BY t.transaction_id, t.total
          HAVING t.total <> COALESCE(SUM(l.quantity * l.unit_price), 0);

          WITH expected AS (
            SELECT h.history_id,
                   max(t.occurred_at) AS last_purchase,
                   NULLIF(count(t.transaction_id), 0)::int AS frequency,
                   sum(t.total) AS monetary
            FROM customer_segment_history AS h
            JOIN segmentation_run AS r ON r.run_id = h.run_id
            LEFT JOIN transaction AS t
              ON t.customer_id = h.customer_id
             AND t.occurred_at >= r.run_at - make_interval(days => r.window_days)
             AND t.occurred_at <= r.run_at
            GROUP BY h.history_id
          )
          SELECT 'F7-02 history disagrees with sales', h.history_id,
                 h.frequency_count, e.frequency, h.monetary_total, e.monetary
          FROM customer_segment_history AS h
          JOIN expected AS e ON e.history_id = h.history_id
          WHERE h.recency_last_purchase_at IS DISTINCT FROM e.last_purchase
             OR h.frequency_count IS DISTINCT FROM e.frequency
             OR h.monetary_total IS DISTINCT FROM e.monetary;

          SELECT 'customer registered after a sale', c.customer_id,
                 c.registered_on, min(t.occurred_at::date)
          FROM customer AS c
          JOIN transaction AS t ON t.customer_id = c.customer_id
          GROUP BY c.customer_id, c.registered_on
          HAVING min(t.occurred_at::date) < c.registered_on;

          SELECT 'ADR-0019 seeded experiment marked OBSERVED', e.experiment_id
          FROM experiment AS e
          WHERE e.data_origin = 'OBSERVED';

          SELECT 'ADR-0053 experiment measured on a metric other than CONVERSION', e.experiment_id
          FROM experiment AS e
          WHERE e.target_metric <> 'CONVERSION';

          SELECT 'ADR-0052 seeded sale not marked SEEDED', t.transaction_id, t.data_origin
          FROM transaction AS t
          WHERE t.data_origin <> 'SEEDED';

          SELECT 'ADR-0052 seeded run not marked SEEDED', r.run_id, r.data_origin
          FROM segmentation_run AS r
          WHERE r.data_origin <> 'SEEDED';
          SQL
          )"
          if [ -n "$violations" ]; then
            printf '%s\n' "$violations"
            exit 1
          fi
          echo "Seed satisfies ADR-0017, ADR-0018, ADR-0019, ADR-0020, ADR-0052 and ADR-0053."

      - name: Application role can write data but cannot drop a table
        env:
          PGUSER: retail_app
          PGPASSWORD: retail_app
        run: |
          sed -n '/^-- BEGIN APPLICATION ROLE VERIFICATION/,$p' sql/01_schema.sql |
            psql -X -v ON_ERROR_STOP=1 -v verify_app_role=1 -d retail

      # Every table carries at least 30 seed rows, counted exactly — the
      # estimate in pg_stat_user_tables is still zero straight after a load.
      #
      # A table that cannot sensibly hold 30 rows goes in sql/seed-exempt.txt,
      # one name per line, with a comment saying why. The exemption is then
      # visible in review rather than hidden by a weakened check. Service-schema
      # tables are counted too and named schema-qualified (ADR-0046).
      - name: Every table has at least 30 rows
        run: |
          q() { psql -v ON_ERROR_STOP=1 -d retail -tAc "$1"; }
          failed=0
          while IFS='|' read -r label rel; do
            [ -z "$label" ] && continue
            if grep -qxF "$label" sql/seed-exempt.txt; then echo "$label: exempt"; continue; fi
            n=$(q "SELECT count(*) FROM $rel;")
            if [ "$n" -lt 30 ]; then echo "$label has $n rows, below the 30-row minimum"; failed=1; fi
          done < <(q "SELECT CASE WHEN schemaname = 'public' THEN tablename
                                  ELSE schemaname || '.' || tablename END,
                             format('%I.%I', schemaname, tablename)
                        FROM pg_tables
                       WHERE schemaname NOT IN ('pg_catalog', 'information_schema')
                       ORDER BY 1;")
          [ "$failed" -eq 0 ]
          if grep -vE '^\s*(#|$)' sql/seed-exempt.txt | grep -F . \
               | grep -vxE 'sales\.sale_capture|[a-z]+_events\.outbox'; then
            echo "seed-exempt.txt names a schema-qualified table it may not exempt"
            exit 1
          fi

      # The boundary-section framework (F13-07, ADR-0040): markers name a
      # registered service, pair up and stay above the verification block,
      # and every section re-applies cleanly to the loaded database, the way
      # an operator applies it to the live one before a service deploys.
      - name: Boundary sections are well formed and re-runnable
        run: |
          names=$(sed -n 's/^  - name: //p' contracts/registry.yaml)
          verify=$(grep -n '^-- BEGIN APPLICATION ROLE VERIFICATION' sql/01_schema.sql | cut -d: -f1)
          problems=$(
            awk -v names="$names" -v verify="$verify" '
              BEGIN { n = split(names, a, "\n"); for (i = 1; i <= n; i++) known[a[i]] = 1 }
              /^-- BEGIN BOUNDARY / {
                if (!($4 in known)) print "FAIL: boundary " $4 " is not in contracts/registry.yaml"
                if (open != "") print "FAIL: boundary " open " has no END before " $4
                if (NR > verify) print "FAIL: boundary " $4 " is after the verification block"
                open = $4
              }
              /^-- END BOUNDARY / {
                if ($4 != open) print "FAIL: END BOUNDARY " $4 " without its BEGIN"
                open = ""
              }
              END { if (open != "") print "FAIL: boundary " open " has no END" }
            ' sql/01_schema.sql
            for b in $(sed -n 's/^-- BEGIN BOUNDARY \(.*\)$/\1/p' sql/01_schema.sql); do
              sed -n "/^-- BEGIN BOUNDARY $b\$/,/^-- END BOUNDARY $b\$/p" sql/01_schema.sql \
                | psql -X -q -v ON_ERROR_STOP=1 -d retail >/dev/null || echo "FAIL: boundary section $b is not re-runnable"
            done
          )
          if [ -n "$problems" ]; then printf '%s\n' "$problems"; exit 1; fi

      # One service writer per table, enforced by the database (ADR-0034,
      # ADR-0044, ADR-0046). Each check prints nothing when the grants match
      # contracts/db/grants.csv and every boundary holds.
      - name: Grants and boundaries match their contracts
        run: |
          problems=$(
            contracts/db/check_grants.sh 2>&1
            psql -X -v ON_ERROR_STOP=1 -d retail -f contracts/db/check_boundaries.sql 2>&1
            psql -X -v ON_ERROR_STOP=1 -d retail -At 2>&1 <<'SQL'
          -- ADR-0046 1. No svc_* role holds a privilege on a public table outside the 27 legacy tables.
          SELECT 'ADR-0046: ' || r.rolname || ' reaches public.' || c.relname
          FROM pg_class c
          JOIN pg_namespace n ON n.oid = c.relnamespace
          CROSS JOIN pg_roles r
          WHERE n.nspname = 'public'
            AND c.relkind IN ('r', 'p')
            AND r.rolname LIKE 'svc\_%'
            AND c.relname NOT IN ('role', 'channel', 'category', 'store', 'segment_rule', 'segment_label',
                  'segment', 'app_user', 'app_session', 'customer', 'customer_preferred_channel',
                  'customer_interest_category', 'segmentation_run', 'customer_segment_history', 'product',
                  'transaction', 'transaction_line', 'sales_load', 'sales_load_rejection', 'campaign',
                  'experiment', 'experiment_group', 'experiment_assignment', 'experiment_exposure',
                  'experiment_conversion', 'inventory', 'audit_log')
            AND (has_table_privilege(r.oid, c.oid, 'SELECT, INSERT, UPDATE, DELETE, TRUNCATE, REFERENCES, TRIGGER')
                 OR has_any_column_privilege(r.oid, c.oid, 'SELECT, INSERT, UPDATE, REFERENCES'));
          -- ADR-0046 2. api_* schemas hold no tables.
          SELECT 'ADR-0046: table ' || schemaname || '.' || tablename || ' in an api schema'
          FROM pg_tables WHERE schemaname LIKE 'api\_%';
          -- ADR-0046 3. An audited table's name is unique across schemas, so audit_log.entity stays unambiguous.
          SELECT 'ADR-0046: audited name ' || c.relname || ' repeats across schemas' FROM pg_class c
           WHERE c.relkind IN ('r', 'p')
             AND c.relname IN (SELECT tc.relname FROM pg_trigger t JOIN pg_class tc ON tc.oid = t.tgrelid
                                 JOIN pg_proc p ON p.oid = t.tgfoid WHERE p.proname = 'fn_audit')
           GROUP BY c.relname HAVING count(*) > 1;
          SQL
          )
          if [ -n "$problems" ]; then printf '%s\n' "$problems"; exit 1; fi

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: web/requirements-dev.txt
      - run: pip install -r web/requirements-dev.txt

      # verify_integrity.sql deliberately keeps ON_ERROR_STOP off because its
      # negative probes must error. This test matches each probe to its declared
      # SQLSTATE, so a positive error, a negative success or a wrong refusal
      # still fails the job while the SQL remains directly runnable with psql.
      - name: Integrity script has every declared outcome
        env:
          MOSAIQ_TEST_OWNER_URL: postgresql://postgres:postgres@localhost:5432/retail
          MOSAIQ_REQUIRE_POSTGRES: "1"
        run: |
          export PATH="$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1):$PATH"
          pytest tests/test_verify_integrity_script.py -m postgres -rs \
            --junitxml=test-results/pytest-integrity.xml

      # The tests that need a real PostgreSQL: they skip anywhere the database
      # is absent, and MOSAIQ_REQUIRE_POSTGRES turns that skip into a failure
      # here, so this job can never pass them silently. initdb comes from the
      # runner's own PostgreSQL for the scratch cluster of the 00 test.
      - name: Database-backed tests
        env:
          MOSAIQ_TEST_OWNER_URL: postgresql://postgres:postgres@localhost:5432/retail
          MOSAIQ_TEST_APP_URL: postgresql://retail_app:retail_app@localhost:5432/retail
          MOSAIQ_REQUIRE_POSTGRES: "1"
        run: |
          export PATH="$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1):$PATH"
          initdb --version
          pytest -m postgres -rs --ignore=tests/test_verify_integrity_script.py \
            --junitxml=test-results/pytest-postgres.xml

      - name: Capture database test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-postgres-results
          path: test-results/pytest-*.xml
          if-no-files-found: ignore

  kit-py:
    name: Python kit
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Decide whether the kit changed
        id: changes
        shell: bash
        run: |
          changed=false
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          elif [[ "${{ github.event.before }}" =~ ^0+$ ]]; then
            changed=true
            files=""
          else
            files=$(git diff --name-only "${{ github.event.before }}..${{ github.sha }}")
          fi
          if grep -qE '^(packages/kit-py/|packages/kit-vectors/|tests/kit_vectors/|\.github/workflows/ci\.yml$)' <<<"$files"; then
            changed=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v6
        if: steps.changes.outputs.changed == 'true'
        with:
          python-version: "3.12"

      - name: Install uv
        if: steps.changes.outputs.changed == 'true'
        run: pip install uv==0.12.3

      - name: Load PostgreSQL scripts
        if: steps.changes.outputs.changed == 'true'
        run: |
          psql -v ON_ERROR_STOP=1 -f sql/00_create_database.sql
          psql -v ON_ERROR_STOP=1 -d retail -f sql/01_schema.sql
          psql -v ON_ERROR_STOP=1 -d retail -f sql/02_seed_30_per_table.sql

      - name: Start digest-pinned Redis with AOF
        if: steps.changes.outputs.changed == 'true'
        run: |
          image=$(sed -n 's/^[[:space:]]*image: \(redis:[^[:space:]]*@sha256:[[:xdigit:]]*\)$/\1/p' deploy/infra/compose.yaml | head -1)
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          redis_config="$RUNNER_TEMP/kit-redis.conf"
          printf 'appendonly yes\nrequirepass %s\n' "$password" > "$redis_config"
          chmod 0444 "$redis_config"
          docker run -d --name kit-redis --publish 127.0.0.1:6379:6379 \
            --mount "type=bind,src=$redis_config,dst=/usr/local/etc/redis/redis.conf,readonly" \
            "$image" redis-server /usr/local/etc/redis/redis.conf
          echo "KIT_TEST_REDIS_URL=redis://:$password@127.0.0.1:6379/0" >> "$GITHUB_ENV"
          for attempt in $(seq 1 30); do
            if docker exec -e REDISCLI_AUTH="$password" kit-redis redis-cli ping | grep -q PONG; then
              exit 0
            fi
            sleep 1
          done
          docker logs kit-redis
          exit 1

      - name: Sync the locked environment
        if: steps.changes.outputs.changed == 'true'
        working-directory: packages/kit-py
        run: uv sync --frozen

      - name: Black
        if: steps.changes.outputs.changed == 'true'
        working-directory: packages/kit-py
        run: uv run black --check .

      - name: Ruff
        if: steps.changes.outputs.changed == 'true'
        working-directory: packages/kit-py
        run: uv run ruff check .

      - name: Pytest
        if: steps.changes.outputs.changed == 'true'
        working-directory: packages/kit-py
        env:
          KIT_REQUIRE_SERVICES: "1"
          KIT_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/retail
        run: uv run pytest

      - name: Build the isolated example as UID 10001
        if: steps.changes.outputs.changed == 'true'
        working-directory: packages/kit-py
        run: |
          uv build --wheel
          mkdir -p example/wheels example/contracts/common
          cp dist/*.whl example/wheels/
          cp -R ../../contracts/common/v1 example/contracts/common/
          docker build -t mosaiq-kit-example example
          test "$(docker run --rm --entrypoint id mosaiq-kit-example -u)" = "10001"

  kit-rs:
    name: Rust kit
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Decide whether the kit changed
        id: changes
        shell: bash
        run: |
          changed=false
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          elif [[ "${{ github.event.before }}" =~ ^0+$ ]]; then
            changed=true
            files=""
          else
            files=$(git diff --name-only "${{ github.event.before }}..${{ github.sha }}")
          fi
          if grep -qE '^(packages/kit-rs/|packages/kit-vectors/|tests/kit_vectors/|\.github/workflows/ci\.yml$)' <<<"$files"; then
            changed=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Install libxml2 and libclang
        if: steps.changes.outputs.changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libclang-dev libxml2-dev pkg-config

      - name: Install the pinned toolchain
        if: steps.changes.outputs.changed == 'true'
        working-directory: packages/kit-rs
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --component clippy,rustfmt
          cargo --version

      - name: Load PostgreSQL scripts
        if: steps.changes.outputs.changed == 'true'
        run: |
          psql -v ON_ERROR_STOP=1 -f sql/00_create_database.sql
          psql -v ON_ERROR_STOP=1 -d retail -f sql/01_schema.sql
          psql -v ON_ERROR_STOP=1 -d retail -f sql/02_seed_30_per_table.sql

      - name: Start digest-pinned Redis with AOF
        if: steps.changes.outputs.changed == 'true'
        run: |
          image=$(sed -n 's/^[[:space:]]*image: \(redis:[^[:space:]]*@sha256:[[:xdigit:]]*\)$/\1/p' deploy/infra/compose.yaml | head -1)
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          redis_config="$RUNNER_TEMP/kit-rs-redis.conf"
          printf 'appendonly yes\nrequirepass %s\n' "$password" > "$redis_config"
          chmod 0444 "$redis_config"
          docker run -d --name kit-rs-redis --publish 127.0.0.1:6379:6379 \
            --mount "type=bind,src=$redis_config,dst=/usr/local/etc/redis/redis.conf,readonly" \
            "$image" redis-server /usr/local/etc/redis/redis.conf
          echo "KIT_TEST_REDIS_URL=redis://:$password@127.0.0.1:6379/0" >> "$GITHUB_ENV"
          for attempt in $(seq 1 30); do
            if docker exec -e REDISCLI_AUTH="$password" kit-rs-redis redis-cli ping | grep -q PONG; then
              exit 0
            fi
            sleep 1
          done
          docker logs kit-rs-redis
          exit 1

      - name: cargo fmt
        if: steps.changes.outputs.changed == 'true'
        working-directory: packages/kit-rs
        run: cargo fmt --check

      - name: cargo clippy
        if: steps.changes.outputs.changed == 'true'
        working-directory: packages/kit-rs
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo test
        if: steps.changes.outputs.changed == 'true'
        working-directory: packages/kit-rs
        env:
          KIT_REQUIRE_SERVICES: "1"
          KIT_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/retail
        run: cargo test --locked

      - name: Build the example as UID 10001
        if: steps.changes.outputs.changed == 'true'
        working-directory: packages/kit-rs
        run: |
          mkdir -p examples/contracts/common
          cp -R ../../contracts/common/v1 examples/contracts/common/
          docker build -f examples/Dockerfile -t mosaiq-kit-rs-example .
          test "$(docker run --rm --entrypoint id mosaiq-kit-rs-example -u)" = "10001"
