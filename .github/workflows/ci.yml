name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  compose:
    name: Compose application and proxy smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Boot from documented safe defaults
        run: |
          cp .env.example .env
          docker compose -f compose.yaml -f compose.proxy.yaml up --build --wait --wait-timeout 180
      - name: Application serves HTML directly and through NGINX
        run: |
          curl --fail --retry 12 --retry-connrefused --retry-delay 2 http://127.0.0.1:8000/login -o /tmp/direct.html
          curl --fail --retry 12 --retry-connrefused --retry-delay 2 http://127.0.0.1:8080/login -o /tmp/proxy.html
          grep -q MOSAIQ /tmp/direct.html
          grep -q MOSAIQ /tmp/proxy.html
          docker compose exec -T web flask --app web.app account-report
      - name: Capture execution evidence
        if: always()
        run: docker compose -f compose.yaml -f compose.proxy.yaml logs --no-color
      - name: Stop the isolated stack
        if: always()
        run: docker compose -f compose.yaml -f compose.proxy.yaml down --volumes

  quality:
    name: Format, lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: web/requirements-dev.txt
      - run: pip install -r web/requirements-dev.txt
      - run: black --check .
      - run: ruff check .

      # pytest exits 5 when it collects nothing, which is the correct state
      # until the first test lands. Skipped explicitly rather than by swallowing
      # the exit code, so a real collection error still fails the build.
      - name: Tests
        run: |
          if [ -n "$(find . -name 'test_*.py' -not -path './.venv/*' -print -quit)" ]; then
            pytest --junitxml=test-results/pytest.xml
          else
            echo "No tests yet — nothing to run."
          fi

      - name: Capture per-case test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: test-results/pytest.xml
          if-no-files-found: ignore

  database:
    name: SQL scripts run clean from empty
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v5

      # Definition of Done item 3: the three scripts run clean, in order,
      # against an empty database. This is what stops a schema edit from being
      # merged in a state that only works on the author's machine.
      - name: Run the scripts in order
        run: |
          if [ ! -f sql/01_schema.sql ]; then
            echo "sql/ does not exist yet — Phase 2 has not landed."
            exit 0
          fi
          psql -v ON_ERROR_STOP=1 -f sql/00_create_database.sql
          psql -v ON_ERROR_STOP=1 -d retail -f sql/01_schema.sql
          psql -v ON_ERROR_STOP=1 -d retail -f sql/02_seed_30_per_table.sql

      # Fail when the seed or a schema change leaves assignment history at odds
      # with its runs or ADR-0018's label contract, printing the offending rows.
      - name: Seed satisfies the ADR compliance queries
        run: |
          violations="$(
            psql -v ON_ERROR_STOP=1 -d retail -At -F ' | ' <<'SQL'
          SELECT 'ADR-0017 multiple open rows', customer_id, count(*)
          FROM customer_segment_history
          WHERE valid_to IS NULL
          GROUP BY customer_id
          HAVING count(*) > 1;

          SELECT 'ADR-0017 run count mismatch', r.run_id,
                 r.customer_count, count(h.run_id)
          FROM segmentation_run AS r
          LEFT JOIN customer_segment_history AS h ON h.run_id = r.run_id
          GROUP BY r.run_id, r.customer_count
          HAVING count(h.run_id) <> r.customer_count;

          SELECT 'ADR-0018 unknown label', h.customer_id, h.run_id, h.label_code
          FROM customer_segment_history AS h
          WHERE h.label_code IS NOT NULL
            AND h.label_code NOT IN (SELECT label_code FROM segment_label);

          SELECT 'ADR-0018 unassigned row has score', h.customer_id, h.run_id
          FROM customer_segment_history AS h
          WHERE h.label_code IS NULL
            AND h.r_score IS NOT NULL;

          SELECT 'ADR-0020 total disagrees with lines', t.transaction_id,
                 t.total, COALESCE(SUM(l.quantity * l.unit_price), 0)
          FROM transaction AS t
          LEFT JOIN transaction_line AS l ON l.transaction_id = t.transaction_id
          GROUP BY t.transaction_id, t.total
          HAVING t.total <> COALESCE(SUM(l.quantity * l.unit_price), 0);

          WITH expected AS (
            SELECT h.history_id,
                   max(t.occurred_at) AS last_purchase,
                   NULLIF(count(t.transaction_id), 0)::int AS frequency,
                   sum(t.total) AS monetary
            FROM customer_segment_history AS h
            JOIN segmentation_run AS r ON r.run_id = h.run_id
            LEFT JOIN transaction AS t
              ON t.customer_id = h.customer_id
             AND t.occurred_at >= r.run_at - make_interval(days => r.window_days)
             AND t.occurred_at <= r.run_at
            GROUP BY h.history_id
          )
          SELECT 'F7-02 history disagrees with sales', h.history_id,
                 h.frequency_count, e.frequency, h.monetary_total, e.monetary
          FROM customer_segment_history AS h
          JOIN expected AS e ON e.history_id = h.history_id
          WHERE h.recency_last_purchase_at IS DISTINCT FROM e.last_purchase
             OR h.frequency_count IS DISTINCT FROM e.frequency
             OR h.monetary_total IS DISTINCT FROM e.monetary;

          SELECT 'customer registered after a sale', c.customer_id,
                 c.registered_on, min(t.occurred_at::date)
          FROM customer AS c
          JOIN transaction AS t ON t.customer_id = c.customer_id
          GROUP BY c.customer_id, c.registered_on
          HAVING min(t.occurred_at::date) < c.registered_on;
          SQL
          )"
          if [ -n "$violations" ]; then
            printf '%s\n' "$violations"
            exit 1
          fi
          echo "Seed satisfies ADR-0017, ADR-0018 and ADR-0020."

      - name: Application role can write data but cannot drop a table
        env:
          PGUSER: retail_app
          PGPASSWORD: retail_app
        run: |
          sed -n '/^-- BEGIN APPLICATION ROLE VERIFICATION/,$p' sql/01_schema.sql |
            psql -X -v ON_ERROR_STOP=1 -v verify_app_role=1 -d retail

      # Every table carries at least 30 seed rows, counted exactly — the
      # estimate in pg_stat_user_tables is still zero straight after a load.
      #
      # A table that cannot sensibly hold 30 rows — `role` holds exactly two —
      # goes in sql/seed-exempt.txt, one name per line, with a comment saying
      # why. The exemption is then visible in review rather than hidden by a
      # weakened check.
      - name: Every table has at least 30 rows
        run: |
          if [ ! -f sql/02_seed_30_per_table.sql ]; then exit 0; fi
          q() { psql -v ON_ERROR_STOP=1 -d retail -tAc "$1"; }
          failed=0
          while read -r tbl; do
            [ -z "$tbl" ] && continue
            if [ -f sql/seed-exempt.txt ] && grep -qxF "$tbl" sql/seed-exempt.txt; then
              echo "$tbl: exempt"
              continue
            fi
            n=$(q "SELECT count(*) FROM public.\"$tbl\";")
            if [ "$n" -lt 30 ]; then
              echo "$tbl has $n rows, below the 30-row minimum"
              failed=1
            fi
          done < <(q "SELECT tablename FROM pg_tables WHERE schemaname = 'public' ORDER BY 1;")
          if [ "$failed" -ne 0 ]; then exit 1; fi
          echo "All tables carry at least 30 rows."
