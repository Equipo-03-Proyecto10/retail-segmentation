name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  quality:
    name: Format, lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: web/requirements-dev.txt
      - run: pip install -r web/requirements-dev.txt
      - run: black --check .
      - run: ruff check .

      # pytest exits 5 when it collects nothing, which is the correct state
      # until the first test lands. Skipped explicitly rather than by swallowing
      # the exit code, so a real collection error still fails the build.
      - name: Tests
        run: |
          if [ -n "$(find . -name 'test_*.py' -not -path './.venv/*' -print -quit)" ]; then
            pytest
          else
            echo "No tests yet — nothing to run."
          fi

  database:
    name: SQL scripts run clean from empty
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v5

      # Definition of Done item 3: the three scripts run clean, in order,
      # against an empty database. This is what stops a schema edit from being
      # merged in a state that only works on the author's machine.
      - name: Run the scripts in order
        run: |
          if [ ! -f sql/01_schema.sql ]; then
            echo "sql/ does not exist yet — Phase 2 has not landed."
            exit 0
          fi
          psql -v ON_ERROR_STOP=1 -f sql/00_create_database.sql
          psql -v ON_ERROR_STOP=1 -d retail -f sql/01_schema.sql
          psql -v ON_ERROR_STOP=1 -d retail -f sql/02_seed_30_per_table.sql

      # Every table carries at least 30 seed rows, counted exactly — the
      # estimate in pg_stat_user_tables is still zero straight after a load.
      #
      # A table that cannot sensibly hold 30 rows — `role` holds exactly two —
      # goes in sql/seed-exempt.txt, one name per line, with a comment saying
      # why. The exemption is then visible in review rather than hidden by a
      # weakened check.
      - name: Every table has at least 30 rows
        run: |
          if [ ! -f sql/02_seed_30_per_table.sql ]; then exit 0; fi
          q() { psql -v ON_ERROR_STOP=1 -d retail -tAc "$1"; }
          failed=0
          while read -r tbl; do
            [ -z "$tbl" ] && continue
            if [ -f sql/seed-exempt.txt ] && grep -qxF "$tbl" sql/seed-exempt.txt; then
              echo "$tbl: exempt"
              continue
            fi
            n=$(q "SELECT count(*) FROM public.\"$tbl\";")
            if [ "$n" -lt 30 ]; then
              echo "$tbl has $n rows, below the 30-row minimum"
              failed=1
            fi
          done < <(q "SELECT tablename FROM pg_tables WHERE schemaname = 'public' ORDER BY 1;")
          if [ "$failed" -ne 0 ]; then exit 1; fi
          echo "All tables carry at least 30 rows."
