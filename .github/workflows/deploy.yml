# Continuous deployment to the assigned host. F6-06 (#90), ADR-0011.
#
# One environment: this workflow is the only thing that deploys, main is the
# only branch it deploys from, and develop never deploys. Authentication is
# Workload Identity Federation — GitHub mints a short-lived OIDC token per run
# and GCP exchanges it for temporary credentials, so no long-lived key is
# stored anywhere in this repository or its settings.
name: Deploy

on:
  push:
    branches: [main]
  # Lets a person re-run a deploy, or check the chain without changing what is
  # serving. Impersonation is restricted to refs/heads/main in GCP, so a
  # dispatch from another branch fails at the authentication step by design.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report what would change without touching the instance"
        type: boolean
        default: true

# id-token is what lets the runner request the OIDC token; contents stays read.
permissions:
  contents: read
  id-token: write

# One deploy at a time. Queued rather than cancelled: cancelling mid-deploy is
# how a half-applied checkout gets left on the instance.
concurrency:
  group: deploy-instance
  cancel-in-progress: false

env:
  GCP_PROJECT: iac-dev-01
  GCP_ZONE: northamerica-south1-a
  INSTANCE: mosaiq-deployment-vm
  DEPLOY_SCRIPT: /tmp/mosaiq-deploy-${{ github.run_id }}-${{ github.run_attempt }}.sh

jobs:
  deploy:
    name: Deploy to the instance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/23051370455/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: mosaiq-deploy@iac-dev-01.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      # gcloud generates a key and imports it into the OS Login profile on its
      # own, but silently: when the import does not take, the run fails two
      # steps later with an unexplained "Permission denied (publickey)" and
      # nothing says why. Doing it here makes a missing permission fail with a
      # name, on the step that caused it.
      - name: Register an SSH key with OS Login
        run: |
          ssh-keygen -t ed25519 -f ~/.ssh/google_compute_engine -N '' -q
          gcloud compute os-login ssh-keys add \
            --key-file ~/.ssh/google_compute_engine.pub --ttl 30m
          echo "--- login profile this run will use ---"
          gcloud compute os-login describe-profile \
            --format='value(posixAccounts[].username)'
          gcloud compute os-login ssh-keys list --format='value(key.expirationTimeUsec)' \
            | wc -l | xargs echo "registered keys:"

      # The script is copied out of this checkout and run from /tmp rather than
      # from /opt/mosaiq/current: it rewrites that checkout, and bash reads a
      # script incrementally.
      # A fixed name in /tmp cannot be overwritten by a different user: /tmp is
      # sticky, so a leftover file owned by whoever last ran the script by hand
      # makes the upload fail with a bare "Permission denied". One path per run
      # attempt, removed afterwards.
      - name: Copy the deploy script to the instance
        run: |
          gcloud compute scp deploy/deploy.sh \
            "$INSTANCE:$DEPLOY_SCRIPT" \
            --project="$GCP_PROJECT" --zone="$GCP_ZONE" --quiet

      - name: Deploy
        env:
          # Through the environment, not string-interpolated into the command.
          TARGET_SHA: ${{ github.sha }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          gcloud compute ssh "$INSTANCE" \
            --project="$GCP_PROJECT" --zone="$GCP_ZONE" --quiet \
            --command="sudo bash '$DEPLOY_SCRIPT' '$TARGET_SHA' $DRY_RUN"

      - name: Report what is now serving
        if: always()
        # This step observes, it does not decide. `deploy.sh` already health-checks
        # and rolls back, so the Deploy step above is what says whether the deploy
        # worked. Letting this one fail the job means a transient hiccup between the
        # runner and Google marks a good deploy red — which happened on
        # 2026-09-08 with "problem refreshing your current auth tokens:
        # Connection reset by peer", after Deploy had already succeeded. A red
        # deploy nobody can trust is worse than no report.
        continue-on-error: true
        run: |
          for attempt in 1 2 3; do
            gcloud compute ssh "$INSTANCE" \
              --project="$GCP_PROJECT" --zone="$GCP_ZONE" --quiet \
              --command="sudo -u mosaiq git -C /opt/mosaiq/current rev-parse HEAD; \
                         systemctl is-active mosaiq; \
                         curl -sk -o /dev/null -w 'https %{http_code}\n' https://127.0.0.1/" \
              && exit 0
            echo "attempt $attempt could not reach the instance; retrying in 10s"
            sleep 10
          done
          echo "::warning::Could not read the instance state after three attempts."
          echo "Deploy's own verdict stands. Check by hand with:"
          echo "  gcloud compute ssh $INSTANCE --zone=$GCP_ZONE \\"
          echo "    --command='sudo -u mosaiq git -C /opt/mosaiq/current rev-parse HEAD'"

      - name: Remove the uploaded script
        if: always()
        run: |
          gcloud compute ssh "$INSTANCE" \
            --project="$GCP_PROJECT" --zone="$GCP_ZONE" --quiet \
            --command="rm -f '$DEPLOY_SCRIPT'" || true
