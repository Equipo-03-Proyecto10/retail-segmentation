name: Golden fixture drift

# Captures the web's outcomes for the four ported rules on a fresh database and
# compares them with each service's committed fixtures (ADR-0045, F13-11).
# A port whose services/<name>/tests/golden/ does not exist yet is skipped as
# "not yet captured". tests/golden/README.md has the workflow around it.
on:
  schedule:
    - cron: "37 6 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - web/services/ingestion.py
      - web/services/recommendations.py
      - web/services/consumption_profile.py
      - web/services/users.py
      - web/services/campaigns.py
      - web/db/**
      - sql/**
      - tests/golden/**
      - .github/workflows/golden-drift.yml

permissions:
  contents: read

jobs:
  drift:
    name: Web outcomes still match the committed fixtures
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      DATABASE_URL: postgresql://retail_app:retail_app@localhost:5432/retail
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: web/requirements-dev.txt
      - run: pip install -r web/requirements-dev.txt

      - name: Build a fresh database from the three scripts
        run: |
          psql -v ON_ERROR_STOP=1 -f sql/00_create_database.sql
          psql -v ON_ERROR_STOP=1 -d retail -f sql/01_schema.sql
          psql -v ON_ERROR_STOP=1 -d retail -f sql/02_seed_30_per_table.sql

      - name: Capture every port
        run: |
          for service in sales recommendations users campaigns; do
            python -m tests.golden.capture --service "$service" --out "$RUNNER_TEMP/golden"
          done

      - name: Compare with the committed fixtures
        run: python -m tests.golden.compare "$RUNNER_TEMP/golden"

      # The fresh capture, so a regeneration can start from what the job saw.
      - name: Keep the capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-capture
          path: ${{ runner.temp }}/golden
          if-no-files-found: ignore
