name: Infrastructure

# The Redis instances of ADR-0037 and their per-service ACLs (F13-05), and the
# MongoDB server of ADR-0038 (F13-06). Runs on any change under deploy/infra/
# or to a committed ACL line: it starts the project from the real compose file,
# loads the fixture lines, and checks them the way deploy/infra/check-redis.sh
# checks the instance. Then it does the same with every line that services/ and
# ops/ commit, so a service's own ACL is held to ADR-0037 before it ships (#693).
on:
  pull_request:
    paths:
      - deploy/infra/**
      - services/*/redis/**
      - ops/*/redis/**
      - contracts/streams/**
      - .github/workflows/infra.yml
  push:
    branches: [develop, main]
    paths:
      - deploy/infra/**
      - services/*/redis/**
      - ops/*/redis/**
      - contracts/streams/**
      - .github/workflows/infra.yml

permissions:
  contents: read

# Steps run under `bash -e`. check-redis.sh exits 1 when it finds a problem,
# so each call is `|| true` and the step judges its printed FAIL lines.

jobs:
  redis:
    name: Redis instances, per-service ACLs and MongoDB
    runs-on: ubuntu-24.04
    env:
      COMPOSE: docker compose -p mosaiq-infra -f deploy/infra/compose.yaml
      STREAMS_DIR: deploy/infra/tests/acl/streams
      ACL_SOURCES: deploy/infra/tests/acl/*.acl
    steps:
      - uses: actions/checkout@v5

      # Every password is generated here and masked. None is committed, and
      # none reaches an argv: the scripts pass them in REDISCLI_AUTH.
      - name: Generate the passwords and the per-service env files
        run: |
          set -euo pipefail
          rand() { head -c 24 /dev/urandom | base64 | tr -d '/+='; }
          base="$RUNNER_TEMP/redis"
          mkdir -p "$base/svc" "$base/acl"
          ops=$(rand)
          echo "::add-mask::$ops"
          {
            echo "REDIS_OPS_PASSWORD=$ops"
            echo "SVC_ENV_DIR=$base/svc"
            echo "ACL_FILE=$base/acl/users.acl"
            echo "MOSAIQ_REDIS_ACL_DIR=$base/acl"
          } >> "$GITHUB_ENV"
          for pair in auth:AUTH fixture_a:FIXTURE_A fixture_b:FIXTURE_B fixture_c:FIXTURE_C fixture_bad:FIXTURE_BAD; do
            pw=$(rand)
            echo "::add-mask::$pw"
            printf 'REDIS_%s_PASSWORD=%s\n' "${pair#*:}" "$pw" > "$base/svc/${pair%%:*}.env"
          done
          # MongoDB's root account, read by compose from outside the checkout.
          mkdir -p "$base/mongodb"
          root=$(rand)
          echo "::add-mask::$root"
          printf 'MONGO_INITDB_ROOT_USERNAME=root\nMONGO_INITDB_ROOT_PASSWORD=%s\n' "$root" > "$base/mongodb/root.env"
          echo "MOSAIQ_MONGO_ROOT_ENV=$base/mongodb/root.env" >> "$GITHUB_ENV"

      - name: Static checks
        run: |
          problems=$(
            n=$(grep -cE 'image: redis:7\.4\.[0-9]+(-[a-z]+)?@sha256:[0-9a-f]{64}' deploy/infra/compose.yaml)
            [ "$n" = 2 ] || echo "FAIL: $n redis images pinned to an exact 7.4 patch and digest, expected 2"
            n=$(grep -cE 'image: mongo:7\.0\.[0-9]+@sha256:[0-9a-f]{64}' deploy/infra/compose.yaml)
            [ "$n" = 1 ] || echo "FAIL: $n mongo images pinned to an exact 7.0 patch and digest, expected 1"
            grep -rniE '\bredis\b' web/ && echo "FAIL: the web system references Redis (Q-12)"
            grep -lE 'image: *redis' services/*/compose.yaml 2>/dev/null && echo "FAIL: a service runs its own Redis"
            grep -lE 'image: *mongo' services/*/compose.yaml 2>/dev/null && echo "FAIL: a service runs its own MongoDB"
            bash -n deploy/infra/redis/assemble-acl.sh deploy/infra/check-redis.sh 2>&1
          )
          if [ -n "$problems" ]; then printf '%s\n' "$problems"; exit 1; fi

      - name: Start the project on the external network
        run: |
          set -euo pipefail
          docker network create mosaiq
          # The aclfile must exist before either instance boots.
          bash deploy/infra/redis/assemble-acl.sh --write-only
          $COMPOSE up -d
          export REDISCLI_AUTH=$REDIS_OPS_PASSWORD
          for i in redis-state redis-cache; do
            for _ in $(seq 1 30); do
              reply=$($COMPOSE exec -T -e REDISCLI_AUTH "$i" redis-cli --no-auth-warning --user ops PING 2>/dev/null || true)
              [ "$reply" = PONG ] && break
              sleep 1
            done
            [ "$reply" = PONG ] || { echo "FAIL: $i did not answer"; exit 1; }
          done
          # The first start creates the root user on a server without --auth
          # that listens only inside the container, and the real server
          # follows. Ready means root signs in and authorization is on. The
          # password stays in the container's environment, never in an argv.
          for _ in $(seq 1 60); do
            auth=$($COMPOSE exec -T -e HOME=/tmp mongodb mongosh --quiet --norc --eval '
              db.getSiblingDB("admin").auth(process.env.MONGO_INITDB_ROOT_USERNAME, process.env.MONGO_INITDB_ROOT_PASSWORD);
              print(db.adminCommand({getCmdLineOpts: 1}).parsed.security?.authorization)' 2>/dev/null || true)
            [ "$auth" = enabled ] && break
            sleep 2
          done
          [ "$auth" = enabled ] || { echo "FAIL: mongodb did not come up with authorization on"; exit 1; }

      # Compose v2 prints ":0" for a port that is not published, so that and
      # nothing both count as unpublished. The container's own port bindings
      # are the second witness.
      - name: No instance publishes a port
        run: |
          for pair in redis-state:6379 redis-cache:6379 mongodb:27017; do
            i=${pair%%:*}
            published=$($COMPOSE port "$i" "${pair#*:}" 2>/dev/null || true)
            if [ -n "$published" ] && [ "$published" != ":0" ]; then
              echo "FAIL: $i publishes $published"; exit 1
            fi
            bindings=$(docker inspect -f '{{json .HostConfig.PortBindings}}' "$($COMPOSE ps -q "$i")")
            case $bindings in
              '{}' | null) ;;
              *) echo "FAIL: $i has port bindings $bindings"; exit 1 ;;
            esac
          done

      # Reached the way a service reaches it, by name on the mosaiq network:
      # with no credentials, listDatabases is refused. As root it answers, so
      # the refusal is not a dead server, and the running server holds no
      # database beyond MongoDB's own (engagement's comes with F14-24).
      - name: MongoDB refuses an unauthenticated client
        run: |
          set -uo pipefail
          image=$(sed -nE 's/^ *image: (mongo:[^ ]+)$/\1/p' deploy/infra/compose.yaml)
          # mongosh exits non-zero on the refusal, which bash -e would end the step on.
          status=0
          out=$(docker run --rm --network mosaiq --user 999:999 --read-only --tmpfs /tmp -e HOME=/tmp \
                  "$image" mongosh --quiet --norc mongodb://mongodb:27017/admin \
                  --eval 'printjson(db.adminCommand({listDatabases: 1}))' 2>&1) || status=$?
          printf '%s\n' "$out"
          if [ "$status" -eq 0 ] || ! grep -q 'requires authentication' <<<"$out"; then
            echo "FAIL: an unauthenticated listDatabases was not refused"; exit 1
          fi
          state=$($COMPOSE exec -T -e HOME=/tmp mongodb mongosh --quiet --norc --eval '
            db.getSiblingDB("admin").auth(process.env.MONGO_INITDB_ROOT_USERNAME, process.env.MONGO_INITDB_ROOT_PASSWORD);
            const opts = db.adminCommand({getCmdLineOpts: 1}).parsed;
            const others = db.adminCommand({listDatabases: 1, nameOnly: true}).databases
              .map(d => d.name).filter(n => !["admin", "config", "local"].includes(n));
            print([opts.security.authorization, opts.storage.wiredTiger.engineConfig.cacheSizeGB, others.length].join(" "))') || true
          [ "$state" = "enabled 0.25 0" ] \
            || { echo "FAIL: expected 'enabled 0.25 0' (authorization, cache GB, other databases), got '$state'"; exit 1; }

      - name: ACL LOAD with no restart, then the per-user checks
        run: |
          set -uo pipefail
          started=$(docker inspect -f '{{.State.StartedAt}}' "$($COMPOSE ps -q redis-state)")
          bash deploy/infra/redis/assemble-acl.sh || exit 1
          [ "$(docker inspect -f '{{.State.StartedAt}}' "$($COMPOSE ps -q redis-state)")" = "$started" ] \
            || { echo "FAIL: loading the ACLs restarted redis-state"; exit 1; }
          out=$(bash deploy/infra/check-redis.sh) || true
          if [ -n "$out" ]; then printf '%s\n' "$out"; exit 1; fi

      # The check is not vacuous: a line with ~* must fail it.
      - name: An over-broad line fails the checks
        run: |
          set -uo pipefail
          ACL_SOURCES="$ACL_SOURCES deploy/infra/tests/acl/over-broad/*.acl" \
            bash deploy/infra/redis/assemble-acl.sh || exit 1
          out=$(bash deploy/infra/check-redis.sh) || true
          printf '%s\n' "$out"
          grep -q '^FAIL: svc_fixture_c' <<<"$out" \
            || { echo "FAIL: check-redis.sh passed an over-broad ACL line"; exit 1; }
          bash deploy/infra/redis/assemble-acl.sh

      - name: An invalid line changes nothing
        run: |
          set -uo pipefail
          export REDISCLI_AUTH=$REDIS_OPS_PASSWORD
          users() { $COMPOSE exec -T -e REDISCLI_AUTH "$1" redis-cli --no-auth-warning --user ops ACL LIST | sha256sum; }
          state_before=$(users redis-state)
          cache_before=$(users redis-cache)
          file_before=$(sha256sum < "$ACL_FILE")
          if ACL_SOURCES="$ACL_SOURCES deploy/infra/tests/acl/invalid/*.acl" \
               bash deploy/infra/redis/assemble-acl.sh; then
            echo "FAIL: assemble-acl.sh accepted an invalid line"; exit 1
          fi
          [ "$(users redis-state)" = "$state_before" ] || { echo "FAIL: redis-state lost its users"; exit 1; }
          [ "$(users redis-cache)" = "$cache_before" ] || { echo "FAIL: redis-cache lost its users"; exit 1; }
          [ "$(sha256sum < "$ACL_FILE")" = "$file_before" ] || { echo "FAIL: the aclfile was not restored"; exit 1; }

      - name: A key confirmed with WAITAOF survives a restart
        run: |
          set -euo pipefail
          REDISCLI_AUTH=$(sed -n 's/^REDIS_FIXTURE_A_PASSWORD=//p' "$SVC_ENV_DIR/fixture_a.env")
          export REDISCLI_AUTH
          a() { $COMPOSE exec -T -e REDISCLI_AUTH redis-state redis-cli --no-auth-warning --user svc_fixture_a "$@"; }
          a SET fixture_a:rl:probe 1 EX 3600
          [ "$(a WAITAOF 1 0 1000 | head -1)" = 1 ] || { echo "FAIL: WAITAOF did not confirm the local fsync"; exit 1; }
          $COMPOSE restart redis-state
          # PONG only once the AOF is loaded; until then replies are LOADING.
          for _ in $(seq 1 30); do
            reply=$(REDISCLI_AUTH=$REDIS_OPS_PASSWORD $COMPOSE exec -T -e REDISCLI_AUTH redis-state \
              redis-cli --no-auth-warning --user ops PING 2>/dev/null || true)
            [ "$reply" = PONG ] && break
            sleep 1
          done
          value=$(a GET fixture_a:rl:probe)
          [ "$value" = 1 ] || { echo "FAIL: the key did not survive the restart (got '$value')"; exit 1; }
          a DEL fixture_a:rl:probe
          out=$(bash deploy/infra/check-redis.sh) || true
          if [ -n "$out" ]; then printf '%s\n' "$out"; exit 1; fi

      # The lines the instance loads, with the real stream contracts: each
      # gets a fresh masked password, and the loaded set must pass every
      # per-user check, MULTI for svc_auth alone included.
      - name: The committed service and ops ACLs hold ADR-0037
        env:
          ACL_SOURCES: services/*/redis/*.acl ops/*/redis/*.acl
          STREAMS_DIR: contracts/streams
        run: |
          set -euo pipefail
          for source in $ACL_SOURCES; do
            user=$(sed -nE 's/^user ((svc|ops)_[a-z0-9_]+) .*/\1/p' "$source" | head -1)
            [ -n "$user" ] || { echo "FAIL: $source has no user line"; exit 1; }
            suffix=${user#svc_}
            pw=$(head -c 24 /dev/urandom | base64 | tr -d '/+=')
            echo "::add-mask::$pw"
            printf 'REDIS_%s_PASSWORD=%s\n' "${suffix^^}" "$pw" > "$SVC_ENV_DIR/$(basename "$source" .acl).env"
          done
          bash deploy/infra/redis/assemble-acl.sh
          out=$(bash deploy/infra/check-redis.sh) || true
          if [ -n "$out" ]; then printf '%s\n' "$out"; exit 1; fi

      - name: Container logs
        if: always()
        run: $COMPOSE logs --no-color

      - name: Stop the project
        if: always()
        run: $COMPOSE down --volumes
