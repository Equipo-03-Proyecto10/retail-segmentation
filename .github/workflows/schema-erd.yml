name: Schema ERD

on:
  pull_request:
    paths:
      - ".github/workflows/schema-erd.yml"
      - "docs/architecture/postgresql-physical-model.md"
      - "infra/sql/schema/**"
      - "web/migrations/**"
      - "web/scripts/generate_postgresql_erd.py"
      - "web/tests/test_generate_postgresql_erd.py"
  push:
    branches: [develop, main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: retail
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d retail"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_MIGRATION_URL: postgresql+psycopg://postgres:postgres@localhost:5432/retail
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: web/requirements-dev.txt
      - run: pip install -r web/requirements-dev.txt
      - run: alembic upgrade head
        working-directory: web
      - run: python web/scripts/generate_postgresql_erd.py --check
      - run: pytest
      - run: black --check .
      - run: ruff check .
