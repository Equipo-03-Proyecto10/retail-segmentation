[package]
name = "products-service-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

# A benchmark artifact (ADR-0042, E-22): the read operations of
# contracts/products, compared with products-service. Never registered, routed,
# deployed or counted, and its image is never pushed.

[dependencies]
axum = "0.8.4"
form_urlencoded = "1.2.1"
indexmap = "2.10.0"
mosaiq-kit = { git = "https://github.com/Equipo-03-Proyecto10/retail-segmentation", tag = "kit-rs/v0.1.0" }
rust_decimal = { version = "1.37.2", features = ["db-tokio-postgres"] }
serde_json = "1.0.140"
tokio = { version = "1.47.1", features = ["macros", "net", "rt-multi-thread"] }
tokio-postgres = "0.7.13"
tracing = "0.1.41"
