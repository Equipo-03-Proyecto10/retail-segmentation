# MOSAIQ — optional NGINX reverse proxy for local verification of F6-01 (#77).
#
#   docker compose -f compose.yaml -f compose.proxy.yaml up
#
# Default `docker compose up` is unchanged (F3-09): the app is still on
# http://localhost:8000. This overlay adds NGINX on http://localhost:8080 in
# front of it, exactly as it sits on the instance, and tells the app to trust
# the one proxy hop. It is NOT the deployment — the instance runs NGINX and
# gunicorn under systemd (ADR-0006), applied per deploy/README.md.

services:
  web:
    environment:
      # One proxy in front now, so X-Forwarded-* may be believed.
      TRUSTED_PROXY_HOPS: "1"

  proxy:
    image: nginx:1.27-alpine
    depends_on:
      - web
    volumes:
      - ./deploy/nginx/mosaiq.compose.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      # Loopback only, and 8080 (override MOSAIQ_PROXY_PORT if that clashes)
      # rather than 80 so it needs no privilege.
      - "127.0.0.1:${MOSAIQ_PROXY_PORT:-8080}:80"
    restart: unless-stopped
