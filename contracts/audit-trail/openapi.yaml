      additionalProperties: false
      description: >-
        A read of one customer's consent log, segment history or sales list, recorded by customer-preferences, segments or sales, whether the read was done or refused (ADR-0066). In XML the element is `DomainEvent` with `xsi:type` `HistoryReadEvent`.
      required:
        - event_id
        - kind
        - outcome
        - occurred_at
        - recorded_at
        - actor_type
        - actor_user_id
        - actor_role
        - source
        - store_id
        - subject_type
        - subject_id
        - model_version_id
        - rule_set_version
        - correlation_id
        - details
        - prev_hash
        - entry_hash
      properties:
        event_id:
          type: string
          format: uuid
          description: >-
            The producer's idempotency key: a repeat returns the stored event,
            so a retry cannot double-count.
        kind:
          type: string
          const: HISTORY_READ
          description: The kind, `HISTORY_READ`.
        outcome:
          $ref: '#/components/schemas/DomainEventOutcome'
        occurred_at:
          type: string
          format: date-time
          description: The moment of the act, as the producer reported it.
        recorded_at:
          type: string
          format: date-time
          description: The moment the database recorded the event, never supplied by a producer.
        actor_type:
          $ref: '#/components/schemas/DomainEventActorType'
        actor_user_id:
          type:
            - string
            - 'null'
          format: uuid
          description: >-
            The user the producer states acted, from the verified token; null for
            a `SYSTEM` actor. Omitted in XML when null. A producer is trusted
            for the actor it passes, bounded by `source`.
        actor_role:
          oneOf:
            - $ref: '#/components/schemas/RoleCode'
            - type: 'null'
          description: The actor's role code; null for a `SYSTEM` actor. Omitted in XML when null.
        source:
          $ref: '#/components/schemas/SourceName'
        store_id:
          oneOf:
            - $ref: '#/components/schemas/StoreId'
            - type: 'null'
          description: The store where the act happened, or null. Omitted in XML when null.
        subject_type:
          type: string
          const: CUSTOMER
          description: >-
            `CUSTOMER`; `subject_id` is the customer id, equal to `details.customer_id`.
        subject_id:
          $ref: '#/components/schemas/SubjectId'
          description: What the event is about, as text; see `subject_type`.
        model_version_id:
          oneOf:
            - $ref: '#/components/schemas/ModelVersionId'
            - type: 'null'
          description: >-
            The model version the event was computed or scored under, or null.
            Omitted in XML when null.
        rule_set_version:
          oneOf:
            - $ref: '#/components/schemas/RuleSetVersion'
            - type: 'null'
          description: >-
            The rule set the event was computed under, or null. Omitted in XML
            when null.
        correlation_id:
          $ref: '#/components/schemas/CorrelationIdValue'
        details:
          $ref: '#/components/schemas/HistoryReadDetails'
        prev_hash:
          allOf:
            - $ref: '#/components/schemas/Sha256Hex'
          description: >-
            The `entry_hash` of the event recorded before this one; for the
            first event, the fixed genesis value.
        entry_hash:
          allOf:
            - $ref: '#/components/schemas/Sha256Hex'
          description: >-
            SHA-256 of the canonical JSON of every other column plus
            `prev_hash`, computed by the recording function under a lock that
            gives the chain one head.
      xml:
        name: DomainEvent
        namespace: https://mosaiq.maxthecoder.online/xml/audit-trail/v1
    AuditReadEvent:
      type: object
      additionalProperties: false
      description: >-
        A read of `domain-events` or `audit-entries` by `ADMIN` or `AUDITOR`, recorded by audit-trail: one event per request, including a request that lists `AUDIT_READ` events. In XML the element is `DomainEvent` with `xsi:type` `AuditReadEvent`.
      required:
        - event_id
        - kind
        - outcome
        - occurred_at
        - recorded_at
        - actor_type
        - actor_user_id
        - actor_role
        - source
        - store_id
        - subject_type
        - subject_id
        - model_version_id
        - rule_set_version
        - correlation_id
        - details
        - prev_hash
        - entry_hash
      properties:
        event_id:
          type: string
          format: uuid
          description: >-
            The producer's idempotency key: a repeat returns the stored event,
            so a retry cannot double-count.
        kind:
          type: string
          const: AUDIT_READ
          description: The kind, `AUDIT_READ`.
        outcome:
          $ref: '#/components/schemas/DomainEventOutcome'
        occurred_at:
          type: string
          format: date-time
          description: The moment of the act, as the producer reported it.
        recorded_at:
          type: string
          format: date-time
          description: The moment the database recorded the event, never supplied by a producer.
        actor_type:
          $ref: '#/components/schemas/DomainEventActorType'
        actor_user_id:
          type:
            - string
            - 'null'
          format: uuid
          description: >-
            The user the producer states acted, from the verified token; null for
            a `SYSTEM` actor. Omitted in XML when null. A producer is trusted
            for the actor it passes, bounded by `source`.
        actor_role:
          oneOf:
            - $ref: '#/components/schemas/RoleCode'
            - type: 'null'
          description: The actor's role code; null for a `SYSTEM` actor. Omitted in XML when null.
        source:
          $ref: '#/components/schemas/SourceName'
        store_id:
          oneOf:
            - $ref: '#/components/schemas/StoreId'
            - type: 'null'
          description: The store where the act happened, or null. Omitted in XML when null.
        subject_type:
          type: string
          enum:
            - DOMAIN_EVENT
            - AUDIT_ENTRY
          description: >-
            The resource read: `DOMAIN_EVENT` or `AUDIT_ENTRY`. `subject_id` is the `event_id` or `audit_id` of a read of one item, and null for a list or a verification (omitted in XML).
        subject_id:
          oneOf:
            - $ref: '#/components/schemas/SubjectId'
            - type: 'null'
        model_version_id:
          oneOf:
            - $ref: '#/components/schemas/ModelVersionId'
            - type: 'null'
          description: >-
            The model version the event was computed or scored under, or null.
            Omitted in XML when null.
        rule_set_version:
          oneOf:
            - $ref: '#/components/schemas/RuleSetVersion'
            - type: 'null'
          description: >-
            The rule set the event was computed under, or null. Omitted in XML
            when null.
        correlation_id:
          $ref: '#/components/schemas/CorrelationIdValue'
        details:
          $ref: '#/components/schemas/AuditReadDetails'
        prev_hash:
          allOf:
            - $ref: '#/components/schemas/Sha256Hex'
          description: >-
            The `entry_hash` of the event recorded before this one; for the
            first event, the fixed genesis value.
        entry_hash:
          allOf:
            - $ref: '#/components/schemas/Sha256Hex'
          description: >-
            SHA-256 of the canonical JSON of every other column plus
            `prev_hash`, computed by the recording function under a lock that
            gives the chain one head.
      xml:
        name: DomainEvent
        namespace: https://mosaiq.maxthecoder.online/xml/audit-trail/v1
    DomainEvent:
      description: >-
        One domain event, in one of six shapes discriminated by `kind`
        (ADR-0072). Each shape fixes its kind, its subject types and the keys of
        its `details`, so a key that the kind does not list is not valid. No
        key of `details` contains `password`, `hash`, `secret`, `token`, `key`
        or `credential`, and no value is shaped like a token or a password hash
        (RN-29). In XML the element is `DomainEvent` carrying `xsi:type` set to
        the shape's name (`CalculationRunEvent`, `ModelStateEvent`,
        `PermissionChangedEvent`, `CriticalActionEvent`, `HistoryReadEvent` or
        `AuditReadEvent`); a member that is null in JSON is omitted.
      oneOf:
        - $ref: '#/components/schemas/CalculationRunEvent'
        - $ref: '#/components/schemas/ModelStateEvent'
        - $ref: '#/components/schemas/PermissionChangedEvent'
        - $ref: '#/components/schemas/CriticalActionEvent'
        - $ref: '#/components/schemas/HistoryReadEvent'
        - $ref: '#/components/schemas/AuditReadEvent'
      discriminator:
        propertyName: kind
        mapping:
          CALCULATION_RUN: '#/components/schemas/CalculationRunEvent'
          MODEL_PUBLISHED: '#/components/schemas/ModelStateEvent'
          MODEL_ROLLED_BACK: '#/components/schemas/ModelStateEvent'
          PERMISSION_CHANGED: '#/components/schemas/PermissionChangedEvent'
          CRITICAL_ACTION: '#/components/schemas/CriticalActionEvent'
          HISTORY_READ: '#/components/schemas/HistoryReadEvent'
          AUDIT_READ: '#/components/schemas/AuditReadEvent'
    DomainEvents:
      type: object
      additionalProperties: false
      required:
        - domain_events
        - page_info
      properties:
        domain_events:
          type: array
          description: >-
            Events ordered by `recorded_at` descending, then `event_id`
            descending.
          items:
            $ref: '#/components/schemas/DomainEvent'
        page_info:
          $ref: '#/components/schemas/PageInfo'
      xml:
        name: DomainEvents
        namespace: https://mosaiq.maxthecoder.online/xml/audit-trail/v1
    VerificationResult:
      type: string
      enum:
        - OK
        - BROKEN
    VerificationFault:
      type: string
      description: >-
        `HASH_MISMATCH` when the event's recomputed hash is not its
        `entry_hash`; `LINK_MISMATCH` when its `prev_hash` is not the
        `entry_hash` of the event before it.
      enum:
        - HASH_MISMATCH
        - LINK_MISMATCH
    FirstInvalidEvent:
      type: object
      additionalProperties: false
      required:
        - event_id
        - fault
      properties:
        event_id:
          type: string
          format: uuid
        fault:
          $ref: '#/components/schemas/VerificationFault'
    DomainEventVerification:
      type: object
      additionalProperties: false
      description: >-
        The result of recomputing the chain over a range. The audit module
        shows `head_hash` so an auditor can record it outside the database.
      required:
        - result
        - row_count
        - head_hash
        - first_invalid
      properties:
        result:
          $ref: '#/components/schemas/VerificationResult'
        row_count:
          allOf:
            - $ref: '#/components/schemas/Count'
          description: The number of events in the range.
        head_hash:
          description: >-
            The stored `entry_hash` of the newest event in the range; null, and
            omitted in XML, for a range with no event.
          oneOf:
            - $ref: '#/components/schemas/Sha256Hex'
            - type: 'null'
        first_invalid:
          description: >-
            The first event, oldest first, whose hash or link does not match;
            null, and omitted in XML, when `result` is `OK`.
          oneOf:
            - $ref: '#/components/schemas/FirstInvalidEvent'
            - type: 'null'
      xml:
        name: DomainEventVerification
        namespace: https://mosaiq.maxthecoder.online/xml/audit-trail/v1
    ErrorDetail:
      type: object
      additionalProperties: false
      required:
        - field
        - code
      properties:
        field:
          type: string
        code:
          type: string
    Error:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - correlation_id
        - details
      properties:
        code:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
        message:
          type: string
        correlation_id:
          type: string
          pattern: '^[0-9A-Za-z-]{1,64}$'
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
      xml:
        name: Error
        namespace: https://mosaiq.maxthecoder.online/xml/common/v1
  responses:
    AuthenticationError:
      description: '`invalid_token` or `session_revoked`.'
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalid_token:
              value:
                code: invalid_token
                message: The bearer token is invalid.
                correlation_id: corr-auth-001
                details: []
            session_revoked:
              value:
                code: session_revoked
                message: The token session is no longer live.
                correlation_id: corr-auth-002
                details: []
        application/xml:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalid_token:
              value: |-
                <Error xmlns="https://mosaiq.maxthecoder.online/xml/common/v1"><code>invalid_token</code><message>The bearer token is invalid.</message><correlation_id>corr-auth-001</correlation_id></Error>
            session_revoked:
              value: |-
                <Error xmlns="https://mosaiq.maxthecoder.online/xml/common/v1"><code>session_revoked</code><message>The token session is no longer live.</message><correlation_id>corr-auth-002</correlation_id></Error>
    ForbiddenRole:
      description: '`forbidden_role`.'
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            forbidden_role:
              value:
                code: forbidden_role
                message: The authenticated role cannot perform this operation.
                correlation_id: corr-role-001
                details: []
        application/xml:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            forbidden_role:
              value: |-
                <Error xmlns="https://mosaiq.maxthecoder.online/xml/common/v1"><code>forbidden_role</code><message>The authenticated role cannot perform this operation.</message><correlation_id>corr-role-001</correlation_id></Error>
    NotAcceptable:
      description: '`not_acceptable`.'
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
