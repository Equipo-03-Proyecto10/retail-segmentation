openapi: 3.1.0
info:
  title: audit-trail-service
  version: 1.2.0
  description: >-
    Reads the audit trail in two resources, both append-only, attributed and
    free of credentials (RN-28, RN-29, RN-30). `audit-entries` are the entries
    `fn_audit` writes for every insert, update and delete on an audited table.
    An entry is attributed to the actor the writer's connection identified in
    `mosaiq.user_id`; `user_id` is null when none was known, as for the seed or
    a maintenance script. An entry never carries a credential: `password_hash`
    is stripped from both payloads before the entry is written, and the service
    strips it again (RN-29). `domain-events` (ADR-0072) are the decisions a row
    change cannot say: a calculation that ran, a model version published or
    rolled back, a permission changed, a critical act, a read of one customer's
    history and a read of this trail. Each is one of a closed list of kinds and
    carries ids, codes, versions and counts only, in a hash chain that
    `/v1/domain-events/verification` recomputes. The service has no write
    operation, because `fn_audit` is the only writer of an entry and
    `api_audit.record_event_v1` the only writer of an event (ADR-0035,
    ADR-0072); what it records itself, through that function, is an
    `AUDIT_READ` event for each request that reads either resource. Only ADMIN
    and AUDITOR read the trail, and a floor role is never given it.
security:
  - bearer: []
paths:
  /v1/audit-entries:
    get:
      summary: List audit entries
      description: >-
        Returns the entries that match every filter given, ordered by
        `executed_at` and then `audit_id`, both descending, so the newest entry
        is first and entries written in one transaction (which share an
        `executed_at`) keep a stable order. Pagination applies after
        filtering. `entity` is one of the audited table names and `action` one
        of INSERT, UPDATE and DELETE; an unknown value of either, or a `to`
        before `from`, is 422 `invalid_query` and `details` names the rejected
        parameter (`entity`, `action` or `to`). A `user_id` that is not a UUID,
        or a `from` or `to` that is not an RFC 3339 timestamp with an offset,
        is also 422 `invalid_query`, with `details` code `invalid_format`; an
        `entity_pk` without `entity` is 422 `invalid_query` with `details` code
        `requires_entity`, because one key value can name rows of several
        tables (#533).
      operationId: listAuditEntries
      x-mosaiq-roles:
        - ADMIN
        - AUDITOR
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Entity'
        - $ref: '#/components/parameters/EntityPk'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/Action'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: A page of audit entries, newest first.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEntries'
              examples:
                page:
                  externalValue: ./examples/audit-entries.json
            application/xml:
              schema:
                $ref: '#/components/schemas/AuditEntries'
              examples:
                page:
                  externalValue: ./examples/audit-entries.xml
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/ForbiddenRole'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '422':
          $ref: '#/components/responses/AuditQueryValidation'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ProtectedDatabaseUnavailable'
  /v1/audit-entries/{audit_id}:
    get:
      summary: Get one audit entry
      description: >-
        Returns the entry identified by `audit_id`, with its payloads. An entry
        is never changed once written, so the representation of an existing
        `audit_id` is stable. An unknown `audit_id` is 404
        `audit_entry_not_found`. A path segment that is not a positive integer
        matches no route and is the kit's 404 `not_found` (#533).
      operationId: getAuditEntry
      x-mosaiq-roles:
        - ADMIN
        - AUDITOR
      parameters:
        - $ref: '#/components/parameters/AuditId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: The requested audit entry.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEntry'
              examples:
                insert:
                  externalValue: ./examples/audit-entry-insert.json
                update:
                  externalValue: ./examples/audit-entry-update.json
                delete:
                  externalValue: ./examples/audit-entry-delete.json
                app_user_update:
                  externalValue: ./examples/audit-entry-app-user-update.json
            application/xml:
              schema:
                $ref: '#/components/schemas/AuditEntry'
              examples:
                insert:
                  externalValue: ./examples/audit-entry-insert.xml
                update:
                  externalValue: ./examples/audit-entry-update.xml
                delete:
                  externalValue: ./examples/audit-entry-delete.xml
                app_user_update:
                  externalValue: ./examples/audit-entry-app-user-update.xml
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/ForbiddenRole'
        '404':
          $ref: '#/components/responses/AuditEntryNotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ProtectedDatabaseUnavailable'
  /v1/domain-events:
    get:
      summary: List domain events
      description: >-
        Returns the domain events that match every filter given (ADR-0072): the
        decisions the audit trail records besides row changes, which
        `/v1/audit-entries` cannot say. Ordered by `recorded_at` and then
        `event_id`, both descending, so the newest event is first. Pagination
        applies after filtering. `from` and `to` bound `recorded_at`, the
        server's clock, which no producer sets. A `kind`, `outcome` or
        `subject_type` that is not one of its listed values is 422
        `invalid_query` and `details` names the rejected parameter; so is a
        `to` before `from` (`before_from`) and a value that is not of the
        parameter's format (`invalid_format`). A well-formed `actor_role`,
        `source`, `subject_id`, `model_version_id` or `store_id` that matches
        no event returns an empty page.


        Reading is recorded as an `AUDIT_READ` event that names the filters
        used and never their values or the rows returned. If that event cannot
        be recorded the answer is 503 `database_unavailable` and no event is
        returned, because a log that holds only the reads that happened to be
        recorded is not evidence (ADR-0072).
      operationId: listDomainEvents
      x-mosaiq-status: planned
      x-mosaiq-roles:
        - ADMIN
        - AUDITOR
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Kind'
        - $ref: '#/components/parameters/ActorUserId'
        - $ref: '#/components/parameters/ActorRole'
        - $ref: '#/components/parameters/ModelVersionId'
        - $ref: '#/components/parameters/SubjectType'
        - $ref: '#/components/parameters/SubjectId'
        - $ref: '#/components/parameters/StoreId'
        - $ref: '#/components/parameters/Outcome'
        - $ref: '#/components/parameters/Source'
        - $ref: '#/components/parameters/EventFrom'
        - $ref: '#/components/parameters/EventTo'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: A page of domain events, newest first.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainEvents'
              examples:
                page:
                  externalValue: ./examples/domain-events-page.json
            application/xml:
              schema:
                $ref: '#/components/schemas/DomainEvents'
              examples:
                page:
                  externalValue: ./examples/domain-events-page.xml
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/ForbiddenRole'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '422':
          $ref: '#/components/responses/DomainEventQueryValidation'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ProtectedDatabaseUnavailable'
  /v1/domain-events/verification:
    get:
      summary: Verify the hash chain of the domain events
      description: >-
        Recomputes the hash chain over the events whose `recorded_at` falls in
        the range (`from` and `to`, both optional, so no range verifies the
        whole table) and answers `OK`, or `BROKEN` with the first event whose
        `entry_hash` or link to the previous event does not match. The first
        event of the range is linked to the event recorded just before it. The
        answer carries the number of events checked and `head_hash`, the stored
        `entry_hash` of the newest event in the range, which an auditor records
        outside the database: without that copy, whoever can rewrite every
        later row can rewrite the chain, so the chain detects an edit and does
        not prevent one (ADR-0072). `head_hash` is absent for a range with no
        event. A `to` before `from` is 422 `invalid_query` (`before_from`), and
        a `from` or `to` that is not an RFC 3339 timestamp with an offset is
        422 `invalid_query` (`invalid_format`).


        The read is recorded as an `AUDIT_READ` event, and fails as the list
        does when it cannot be recorded. The path segment `verification` is
        never an event id: an `event_id` is a UUID.
      operationId: verifyDomainEvents
      x-mosaiq-status: planned
      x-mosaiq-roles:
        - ADMIN
        - AUDITOR
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/EventFrom'
        - $ref: '#/components/parameters/EventTo'
      responses:
        '200':
          description: The result of the verification.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainEventVerification'
              examples:
                ok:
                  externalValue: ./examples/domain-event-verification-ok.json
                broken:
                  externalValue: ./examples/domain-event-verification-broken.json
            application/xml:
              schema:
                $ref: '#/components/schemas/DomainEventVerification'
              examples:
                ok:
                  externalValue: ./examples/domain-event-verification-ok.xml
                broken:
                  externalValue: ./examples/domain-event-verification-broken.xml
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/ForbiddenRole'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '422':
          $ref: '#/components/responses/DomainEventVerificationValidation'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ProtectedDatabaseUnavailable'
  /v1/domain-events/{event_id}:
    get:
      summary: Get one domain event
      description: >-
        Returns the event identified by `event_id`. An event is never changed
        once recorded, so the representation of an existing `event_id` is
        stable. An unknown `event_id` is 404 `domain_event_not_found`. A path
        segment that is not a UUID matches no route and is the kit's 404
        `not_found`.


        Reading is recorded as an `AUDIT_READ` event that names the event read
        and no filter, and fails as the list does when it cannot be recorded.
      operationId: getDomainEvent
      x-mosaiq-status: planned
      x-mosaiq-roles:
        - ADMIN
        - AUDITOR
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: The requested domain event.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainEvent'
              examples:
                calculation_run:
                  externalValue: ./examples/domain-event-calculation-run.json
                calculation_run_failed:
                  externalValue: ./examples/domain-event-calculation-run-failed.json
                model_published:
                  externalValue: ./examples/domain-event-model-published.json
                model_rolled_back:
                  externalValue: ./examples/domain-event-model-rolled-back.json
                permission_role:
                  externalValue: ./examples/domain-event-permission-role.json
                permission_stores:
                  externalValue: ./examples/domain-event-permission-stores.json
                critical_action:
                  externalValue: ./examples/domain-event-critical-action.json
                history_read:
                  externalValue: ./examples/domain-event-history-read.json
                history_read_refused:
                  externalValue: ./examples/domain-event-history-read-refused.json
                audit_read:
                  externalValue: ./examples/domain-event-audit-read.json
            application/xml:
              schema:
                $ref: '#/components/schemas/DomainEvent'
              examples:
                calculation_run:
                  externalValue: ./examples/domain-event-calculation-run.xml
                calculation_run_failed:
                  externalValue: ./examples/domain-event-calculation-run-failed.xml
                model_published:
                  externalValue: ./examples/domain-event-model-published.xml
                model_rolled_back:
                  externalValue: ./examples/domain-event-model-rolled-back.xml
                permission_role:
                  externalValue: ./examples/domain-event-permission-role.xml
                permission_stores:
                  externalValue: ./examples/domain-event-permission-stores.xml
                critical_action:
                  externalValue: ./examples/domain-event-critical-action.xml
                history_read:
                  externalValue: ./examples/domain-event-history-read.xml
                history_read_refused:
                  externalValue: ./examples/domain-event-history-read-refused.xml
                audit_read:
                  externalValue: ./examples/domain-event-audit-read.xml
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/ForbiddenRole'
        '404':
          $ref: '#/components/responses/DomainEventNotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ProtectedDatabaseUnavailable'
  /health/live:
    get:
      summary: Report process liveness
      operationId: getLiveness
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '204':
          description: The process is live.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
  /health/ready:
    get:
      summary: Report schema readiness
      operationId: getReadiness
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '204':
          description: The required schema is applied.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
        '503':
          $ref: '#/components/responses/SchemaNotReady'
  /openapi.yaml:
    get:
      summary: Download this OpenAPI document
      operationId: getOpenApiDocument
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: The OpenAPI document, served byte for byte.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/yaml:
              schema:
                type: string
        '406':
          $ref: '#/components/responses/NotAcceptable'
  /schema.xsd:
    get:
      summary: Download the audit-trail XML Schema
      operationId: getXmlSchema
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: The audit-trail XSD, served byte for byte.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/xml:
              schema:
                type: string
        '406':
          $ref: '#/components/responses/NotAcceptable'
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      description: >-
        Caller-supplied correlation id. A value that does not match the pattern
        is ignored and replaced by a generated id.
      schema:
        type: string
        pattern: '^[0-9A-Za-z-]{1,64}$'
    AuditId:
      name: audit_id
      in: path
      required: true
      description: Positive integer audit entry identifier.
      schema:
        $ref: '#/components/schemas/AuditId'
    Entity:
      name: entity
      in: query
      required: false
      description: >-
        Exact name of an audited table. An unknown name is 422
        `invalid_query`.
      schema:
        $ref: '#/components/schemas/AuditedEntity'
    EntityPk:
      name: entity_pk
      in: query
      required: false
      description: >-
        Exact primary key of the audited row, as text: the value `fn_audit`
        recorded in `entity_pk`. Only valid together with `entity`; alone it
        is 422 `invalid_query` (`requires_entity`).
      schema:
        type: string
        minLength: 1
        maxLength: 80
    UserId:
      name: user_id
      in: query
      required: false
      description: >-
        Exact identifier of the actor the entry is attributed to. A value that
        is not a UUID is 422 `invalid_query` (`invalid_format`).
      schema:
        type: string
        format: uuid
    Action:
      name: action
      in: query
      required: false
      description: >-
        The action that produced the entry. An unknown value is 422
        `invalid_query`.
      schema:
        $ref: '#/components/schemas/AuditAction'
    From:
      name: from
      in: query
      required: false
      description: >-
        Inclusive lower bound on `executed_at`, an RFC 3339 timestamp with an
        offset. Write the offset as `Z`, or percent-encode a `+`. Any other
        value is 422 `invalid_query` (`invalid_format`).
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      required: false
      description: >-
        Inclusive upper bound on `executed_at`, an RFC 3339 timestamp with an
        offset, so `to` equal to `from` returns the entries of that instant. A
        `to` before `from` is 422 `invalid_query`; a value that is not such a
        timestamp is 422 `invalid_query` (`invalid_format`).
      schema:
        type: string
        format: date-time
    Page:
      name: page
      in: query
      required: false
      description: One-based page number.
      schema:
        type: integer
        minimum: 1
        default: 1
    Size:
      name: size
      in: query
      required: false
      description: Number of audit entries per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    EventId:
      name: event_id
      in: path
      required: true
      description: Identifier of the domain event, the idempotency key its producer sent.
      schema:
        type: string
        format: uuid
    Kind:
      name: kind
      in: query
      required: false
      description: >-
        The kind of event. A value outside the closed list is 422
        `invalid_query`, and `details` names `kind`.
      schema:
        $ref: '#/components/schemas/DomainEventKind'
    ActorUserId:
      name: actor_user_id
      in: query
      required: false
      description: >-
        Exact identifier of the user the event is attributed to. A value that
        is not a UUID is 422 `invalid_query` (`invalid_format`).
      schema:
        type: string
        format: uuid
    ActorRole:
      name: actor_role
      in: query
      required: false
      description: >-
        The role code the actor held. A value that is not an upper-case code of
        at most 40 characters is 422 `invalid_query` (`invalid_format`).
      schema:
        $ref: '#/components/schemas/RoleCode'
    ModelVersionId:
      name: model_version_id
      in: query
      required: false
      description: >-
        The model version the event is about or was computed under, the
        `version_id` of a model-registry version. A value that is not a
        positive integer is 422 `invalid_query` (`invalid_format`).
      schema:
        $ref: '#/components/schemas/ModelVersionId'
    SubjectType:
      name: subject_type
      in: query
      required: false
      description: >-
        What the event is about. A value outside the closed list is 422
        `invalid_query`.
      schema:
        $ref: '#/components/schemas/DomainEventSubjectType'
    SubjectId:
      name: subject_id
      in: query
      required: false
      description: Exact identifier of the subject, as text.
      schema:
        $ref: '#/components/schemas/SubjectId'
    StoreId:
      name: store_id
      in: query
      required: false
      description: >-
        The store where the act happened. A value that is not an integer from 1
        through 32767 is 422 `invalid_query` (`invalid_format`).
      schema:
        $ref: '#/components/schemas/StoreId'
    Outcome:
      name: outcome
      in: query
      required: false
      description: >-
        Whether the act was done or refused. A value outside the list is 422
        `invalid_query`.
      schema:
        $ref: '#/components/schemas/DomainEventOutcome'
    Source:
      name: source
      in: query
      required: false
      description: >-
        The database role of the producer, as the recording function took it
        from `session_user` (`svc_models`, `svc_rfm`, ...). A value that is not
        a lower-case identifier is 422 `invalid_query` (`invalid_format`).
      schema:
        $ref: '#/components/schemas/SourceName'
    EventFrom:
      name: from
      in: query
      required: false
      description: >-
        Inclusive lower bound on `recorded_at`, an RFC 3339 timestamp with an
        offset. Write the offset as `Z`, or percent-encode a `+`. Any other
        value is 422 `invalid_query` (`invalid_format`).
      schema:
        type: string
        format: date-time
    EventTo:
      name: to
      in: query
      required: false
      description: >-
        Inclusive upper bound on `recorded_at`, an RFC 3339 timestamp with an
        offset. A `to` before `from` is 422 `invalid_query` (`before_from`); a
        value that is not such a timestamp is 422 `invalid_query`
        (`invalid_format`).
      schema:
        type: string
        format: date-time
  headers:
    CorrelationId:
      description: Correlation id used for this response.
      required: true
      schema:
        type: string
        pattern: '^[0-9A-Za-z-]{1,64}$'
    RetryAfter:
      description: Whole seconds until a retry is allowed.
      required: true
      schema:
        type: integer
        minimum: 1
  schemas:
    AuditId:
      type: integer
      format: int64
      minimum: 1
      maximum: 9223372036854775807
    AuditedEntity:
      type: string
      description: >-
        The name of an audited table, as `fn_audit` records it in `entity`. A
        table's name is unique across schemas (ADR-0046), so it identifies the
        table without a schema. `store_location` is the stores service's table
        (`stores.store_location`).
      enum:
        - category
        - product
        - store
        - customer
        - app_user
        - segment
        - segment_rule
        - campaign
        - experiment
        - channel
        - role
        - customer_segment_history
        - store_location
    AuditAction:
      type: string
      enum:
        - INSERT
        - UPDATE
        - DELETE
    AuditPayload:
      type:
        - object
        - 'null'
      description: >-
        The audited row as `fn_audit` captured it, one member per column of the
        audited table, so its members depend on `entity`. It never carries
        `password_hash`. In JSON it is an object, or null where the action has
        no such row. In XML it is a string element holding the object's JSON
        text, and the element is omitted where the JSON member is null.
      additionalProperties: true
      propertyNames:
        not:
          const: password_hash
    AuditEntry:
      type: object
      additionalProperties: false
      required:
        - audit_id
        - user_id
        - entity
        - entity_pk
        - action
        - data_before
        - data_after
        - executed_at
      properties:
        audit_id:
          $ref: '#/components/schemas/AuditId'
        user_id:
          type:
            - string
            - 'null'
          format: uuid
          description: >-
            The actor the writer's connection identified, or null when none was
            known (the seed, a maintenance script). Omitted in XML when null.
        entity:
          $ref: '#/components/schemas/AuditedEntity'
        entity_pk:
          type: string
          minLength: 1
          maxLength: 80
          description: >-
            The audited row's primary key as text: `25` for a product or
            category, a UUID for a customer or an app_user.
        action:
          $ref: '#/components/schemas/AuditAction'
        data_before:
          description: >-
            The row before the change. An object for UPDATE and DELETE, null
            for INSERT. Never carries `password_hash`.
          allOf:
            - $ref: '#/components/schemas/AuditPayload'
        data_after:
          description: >-
            The row after the change. An object for INSERT and UPDATE, null for
            DELETE. Never carries `password_hash`.
          allOf:
            - $ref: '#/components/schemas/AuditPayload'
        executed_at:
          type: string
          format: date-time
      xml:
        name: AuditEntry
        namespace: https://mosaiq.maxthecoder.online/xml/audit-trail/v1
    AuditEntries:
      type: object
      additionalProperties: false
      required:
        - audit_entries
        - page_info
      properties:
        audit_entries:
          type: array
          description: >-
            Entries ordered by `executed_at` descending, then `audit_id`
            descending.
          items:
            $ref: '#/components/schemas/AuditEntry'
        page_info:
          $ref: '#/components/schemas/PageInfo'
      xml:
        name: AuditEntries
        namespace: https://mosaiq.maxthecoder.online/xml/audit-trail/v1
    PageInfo:
      type: object
      additionalProperties: false
      required:
        - page
        - size
        - total
      properties:
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
      xml:
        name: PageInfo
        namespace: https://mosaiq.maxthecoder.online/xml/common/v1
    DomainEventKind:
      type: string
      description: >-
        The closed list of event kinds (ADR-0072). Adding one is a contract
        change, never a free string.
      enum:
        - CALCULATION_RUN
        - MODEL_PUBLISHED
        - MODEL_ROLLED_BACK
        - PERMISSION_CHANGED
        - CRITICAL_ACTION
        - HISTORY_READ
        - AUDIT_READ
    DomainEventOutcome:
      type: string
      description: >-
        `SUCCESS` when the act was done, `REFUSED` when it was refused. Only a
        read of one customer's history is recorded as refused (ADR-0066): a
        permission change, a critical action or a model publication that was
        refused did not happen, so it is not an event. A calculation that ran
        and failed is `SUCCESS` with `details.status` `FAILED`.
      enum:
        - SUCCESS
        - REFUSED
    DomainEventActorType:
      type: string
      description: >-
        `USER` with the id and role from the verified token, or `SYSTEM` for a
        schedule or a stream consumer, which has no id and no role.
      enum:
        - USER
        - SYSTEM
    DomainEventSubjectType:
      type: string
      description: >-
        What the event is about. The values a kind may carry are listed under
        `subject_type` of each shape.
      enum:
        - RFM_RECALCULATION
        - SEGMENT_RUN
        - KPI_REPORT
        - MODEL_VERSION
        - USER
        - SALE
        - STOCK_LEVEL
        - CUSTOMER
        - AUDIT_ENTRY
        - EXPERIMENT
        - CAMPAIGN
        - DOMAIN_EVENT
    RoleCode:
      type: string
      description: >-
        A role code as the token carries it. The list of roles is users'
        (ADR-0060), so it is not repeated here.
      pattern: '^[A-Z][A-Z0-9_]{0,39}$'
    SourceName:
      type: string
      pattern: '^[a-z][a-z0-9_]{0,39}$'
    StoreId:
      type: integer
      format: int32
      minimum: 1
      maximum: 32767
    SubjectId:
      type: string
      minLength: 1
      maxLength: 80
    ModelVersionId:
      type: integer
      format: int64
      minimum: 1
      maximum: 9223372036854775807
    RuleSetVersion:
      type: integer
      format: int64
      minimum: 1
      maximum: 9223372036854775807
      description: >-
        The `rule_set_id` of the rfm-engine rule set the figure was computed
        under. A rule set is immutable, so its id is its version.
    CorrelationIdValue:
      type: string
      pattern: '^[0-9A-Za-z-]{1,64}$'
    Sha256Hex:
      type: string
      pattern: '^[0-9a-f]{64}$'
    ReasonCode:
      type: string
      description: A code, never free text.
      pattern: '^[A-Z][A-Z0-9_]{0,39}$'
    Count:
      type: integer
      format: int64
      minimum: 0
    CalculationDetails:
      type: object
      additionalProperties: false
      description: >-
        What a finished calculation recorded. The ids of the figures it produced
        are not here: a count is.
      required:
        - calculation
        - parameters_digest
        - window_from
        - window_to
        - data_origin
        - input_count
        - output_count
        - status
      properties:
        calculation:
          type: string
          enum:
            - RFM
            - SEGMENTATION
            - KPI
        parameters_digest:
          description: >-
            SHA-256 of the canonical parameters of a run that has no rule set
            (a K-means segmentation); null for a run under a rule set, whose
            version is `rule_set_version`. Named a digest because the recording
            function refuses any key that contains `hash`.
          oneOf:
            - $ref: '#/components/schemas/Sha256Hex'
            - type: 'null'
        window_from:
          type:
            - string
            - 'null'
          format: date
          description: First day of the window the run read, or null when it read no window.
        window_to:
          type:
            - string
            - 'null'
          format: date
          description: Last day of the window the run read, or null when it read no window.
        data_origin:
          type: string
          description: >-
            `SEEDED` when any input was seeded, `OBSERVED` otherwise (ADR-0052).
          enum:
            - OBSERVED
            - SEEDED
        input_count:
          $ref: '#/components/schemas/Count'
        output_count:
          $ref: '#/components/schemas/Count'
        status:
          type: string
          enum:
            - COMPLETED
            - FAILED
    ModelStateDetails:
      type: object
      additionalProperties: false
      description: >-
        The change of state of a model version (ADR-0064). The version is the
        event's `model_version_id`.
      required:
        - previous_version_id
        - reason_code
      properties:
        previous_version_id:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 1
          description: >-
            The version that was published before this change and is retired by
            it: the one replaced by a publication, or the one rolled back from;
            null for the first publication.
        reason_code:
          $ref: '#/components/schemas/ReasonCode'
    PermissionDetails:
      type: object
      additionalProperties: false
      description: >-
        A change of what a user may do. It names the user and the change, and
        never a password or a token. A transfer of the administrator is two
        events, one for each user whose role changed, recorded together.
      required:
        - change
        - subject_user_id
        - from_role
        - to_role
        - store_ids
      properties:
        change:
          type: string
          description: >-
            `ROLE_ASSIGNED` and `ADMINISTRATOR_TRANSFERRED` carry `from_role`
            and `to_role`; `STORE_ASSIGNED` and `STORE_UNASSIGNED` carry the
            `store_ids` added or removed; `USER_DEACTIVATED` and
            `USER_REACTIVATED` carry none of them.
          enum:
            - ROLE_ASSIGNED
            - ADMINISTRATOR_TRANSFERRED
            - USER_DEACTIVATED
            - USER_REACTIVATED
            - STORE_ASSIGNED
            - STORE_UNASSIGNED
        subject_user_id:
          type: string
          format: uuid
          description: The user whose permissions changed, equal to `subject_id`.
        from_role:
          oneOf:
            - $ref: '#/components/schemas/RoleCode'
            - type: 'null'
        to_role:
          oneOf:
            - $ref: '#/components/schemas/RoleCode'
            - type: 'null'
        store_ids:
          type: array
          description: >-
            Empty unless `change` is `STORE_ASSIGNED` or `STORE_UNASSIGNED`. In
            XML, the element repeated; absent when empty.
          uniqueItems: true
          items:
            $ref: '#/components/schemas/StoreId'
    CriticalActionDetails:
      type: object
      additionalProperties: false
      description: >-
        A critical act on one subject. The subject is the event's
        `subject_type` and `subject_id`.
      required:
        - action
        - reason_code
      properties:
        action:
          type: string
          description: >-
            Each action fixes the subject type: `SALE_REVERSED` is a `SALE`,
            `STOCK_ADJUSTED` a `STOCK_LEVEL`, `CUSTOMER_ANONYMIZED` a
            `CUSTOMER`, `AUDIT_PAYLOAD_REDACTED` an `AUDIT_ENTRY`,
            `EXPERIMENT_FROZEN` an `EXPERIMENT` and `CAMPAIGN_ACTIVATED` a
            `CAMPAIGN`.
          enum:
            - SALE_REVERSED
            - STOCK_ADJUSTED
            - CUSTOMER_ANONYMIZED
            - AUDIT_PAYLOAD_REDACTED
            - EXPERIMENT_FROZEN
            - CAMPAIGN_ACTIVATED
        reason_code:
          $ref: '#/components/schemas/ReasonCode'
    HistoryReadDetails:
      type: object
      additionalProperties: false
      description: >-
        A read of one named customer's history: who read it is the actor, what
        was read is never here (ADR-0066).
      required:
        - history
        - customer_id
      properties:
        history:
          type: string
          enum:
            - CONSENT
            - SEGMENT
            - SALES
        customer_id:
          type: string
          format: uuid
          description: The customer whose history was read, equal to `subject_id`.
    AuditReadDetails:
      type: object
      additionalProperties: false
      description: >-
        A read of the audit trail by `ADMIN` or `AUDITOR`. It names the query
        parameters used and never their values or the rows returned.
      required:
        - filters
      properties:
        filters:
          type: array
          description: >-
            The names of the query parameters the request carried, without
            `page` and `size`, each once, in ascending order. In XML, the
            element repeated; absent when the request had none.
          uniqueItems: true
          maxItems: 20
          items:
            type: string
            pattern: '^[a-z][a-z_]{0,39}$'
    CalculationRunEvent:
      type: object
      additionalProperties: false
      description: >-
        An RFM recalculation, a segmentation run (RFM rules or K-means) or a published KPI recomputation that finished or failed, recorded by rfm-engine, segments or analytics-kpis. In XML the element is `DomainEvent` with `xsi:type` `CalculationRunEvent`. `model_version_id` or `rule_set_version` is set when the run was scored under one.
      required:
        - event_id
        - kind
        - outcome
        - occurred_at
        - recorded_at
        - actor_type
        - actor_user_id
        - actor_role
        - source
        - store_id
        - subject_type
        - subject_id
        - model_version_id
        - rule_set_version
        - correlation_id
        - details
        - prev_hash
        - entry_hash
      properties:
        event_id:
          type: string
          format: uuid
          description: >-
            The producer's idempotency key: a repeat returns the stored event,
            so a retry cannot double-count.
        kind:
          type: string
          const: CALCULATION_RUN
          description: The kind, `CALCULATION_RUN`.
        outcome:
          $ref: '#/components/schemas/DomainEventOutcome'
        occurred_at:
          type: string
          format: date-time
          description: The moment of the act, as the producer reported it.
        recorded_at:
          type: string
          format: date-time
          description: The moment the database recorded the event, never supplied by a producer.
        actor_type:
          $ref: '#/components/schemas/DomainEventActorType'
        actor_user_id:
          type:
            - string
            - 'null'
          format: uuid
          description: >-
            The user the producer states acted, from the verified token; null for
            a `SYSTEM` actor. Omitted in XML when null. A producer is trusted
            for the actor it passes, bounded by `source`.
        actor_role:
          oneOf:
            - $ref: '#/components/schemas/RoleCode'
            - type: 'null'
          description: The actor's role code; null for a `SYSTEM` actor. Omitted in XML when null.
        source:
          $ref: '#/components/schemas/SourceName'
        store_id:
          oneOf:
            - $ref: '#/components/schemas/StoreId'
            - type: 'null'
          description: The store where the act happened, or null. Omitted in XML when null.
        subject_type:
          type: string
          enum:
            - RFM_RECALCULATION
            - SEGMENT_RUN
            - KPI_REPORT
          description: >-
            `RFM_RECALCULATION`, `SEGMENT_RUN` or `KPI_REPORT`, matching `details.calculation` `RFM`, `SEGMENTATION` or `KPI`. `subject_id` is the id of the run or report as its owner names it.
        subject_id:
          $ref: '#/components/schemas/SubjectId'
          description: What the event is about, as text; see `subject_type`.
        model_version_id:
          oneOf:
            - $ref: '#/components/schemas/ModelVersionId'
            - type: 'null'
          description: >-
            The model version the event was computed or scored under, or null.
            Omitted in XML when null.
        rule_set_version:
          oneOf:
            - $ref: '#/components/schemas/RuleSetVersion'
            - type: 'null'
          description: >-
            The rule set the event was computed under, or null. Omitted in XML
            when null.
        correlation_id:
          $ref: '#/components/schemas/CorrelationIdValue'
        details:
          $ref: '#/components/schemas/CalculationDetails'
        prev_hash:
          allOf:
            - $ref: '#/components/schemas/Sha256Hex'
          description: >-
            The `entry_hash` of the event recorded before this one; for the
            first event, the fixed genesis value.
        entry_hash:
          allOf:
            - $ref: '#/components/schemas/Sha256Hex'
          description: >-
            SHA-256 of the canonical JSON of every other column plus
            `prev_hash`, computed by the recording function under a lock that
            gives the chain one head.
      xml:
        name: DomainEvent
        namespace: https://mosaiq.maxthecoder.online/xml/audit-trail/v1
    ModelStateEvent:
