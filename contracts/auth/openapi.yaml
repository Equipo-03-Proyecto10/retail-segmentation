openapi: 3.1.0
info:
  title: auth-service
  version: 1.0.0
  description: >-
    Authenticates active accounts, issues RS256 access tokens, rotates refresh
    tokens, and owns session liveness under RN-52. Sign-in and refresh read the
    users service's published credential view; current-session reads, sign-out,
    and JWKS publication do not read PostgreSQL.
servers:
  - url: /api/auth
security:
  - bearer: []
paths:
  /v1/sessions:
    post:
      operationId: createSession
      summary: Sign in and create a session
      security: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInRequest"
            examples:
              sign_in:
                externalValue: examples/sign-in.request.json
          application/xml:
            schema:
              $ref: "#/components/schemas/SignInRequest"
            examples:
              sign_in:
                externalValue: examples/sign-in.request.xml
      responses:
        "201":
          description: Session created.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResult"
              examples:
                sign_in:
                  externalValue: examples/sign-in.json
            application/xml:
              schema:
                $ref: "#/components/schemas/TokenResult"
              examples:
                sign_in:
                  externalValue: examples/sign-in.xml
        "400":
          $ref: "#/components/responses/MalformedBody"
        "401":
          description: >-
            Invalid credentials: invalid_credentials. A wrong password, an
            unknown email, and an inactive account deliberately return this
            same body so account state is not disclosed.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invalid_credentials:
                  externalValue: examples/invalid-credentials.json
            application/xml:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invalid_credentials:
                  externalValue: examples/invalid-credentials.xml
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/InvalidBody"
        "429":
          description: "The sign-in request limit was exceeded: rate_limited."
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                rate_limited:
                  externalValue: examples/rate-limited.json
            application/xml:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                rate_limited:
                  externalValue: examples/rate-limited.xml
        "503":
          description: >-
            Session state cannot be reached (auth_unavailable), or PostgreSQL
            cannot provide the published credential view
            (database_unavailable).
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                auth_unavailable:
                  externalValue: examples/auth-unavailable.json
                database_unavailable:
                  externalValue: examples/database-unavailable.json
            application/xml:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                auth_unavailable:
                  externalValue: examples/auth-unavailable.xml
                database_unavailable:
                  externalValue: examples/database-unavailable.xml
  /v1/sessions/refresh:
    post:
      operationId: refreshSession
      summary: Rotate a refresh token
      description: >-
        Returns new access and refresh tokens without extending the session's
        absolute end.
      security: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
            examples:
              refresh:
                externalValue: examples/refresh.request.json
          application/xml:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
            examples:
              refresh:
                externalValue: examples/refresh.request.xml
      responses:
        "200":
          description: Refresh token rotated.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResult"
              examples:
                refresh:
                  externalValue: examples/refresh.json
            application/xml:
              schema:
                $ref: "#/components/schemas/TokenResult"
              examples:
                refresh:
                  externalValue: examples/refresh.xml
        "400":
          $ref: "#/components/responses/MalformedBody"
        "401":
          description: >-
            The refresh token is unknown (invalid_refresh), was already used
            (refresh_reused), belongs to an expired session (session_expired),
            or belongs to a session invalidated by an account access change
            (session_revoked).
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invalid_refresh:
                  externalValue: examples/invalid-refresh.json
                refresh_reused:
                  externalValue: examples/refresh-reused.json
                session_expired:
                  externalValue: examples/session-expired.json
                session_revoked:
                  externalValue: examples/session-revoked.json
            application/xml:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invalid_refresh:
                  externalValue: examples/invalid-refresh.xml
                refresh_reused:
                  externalValue: examples/refresh-reused.xml
                session_expired:
                  externalValue: examples/session-expired.xml
                session_revoked:
                  externalValue: examples/session-revoked.xml
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/InvalidBody"
        "503":
          description: >-
            Session state cannot be reached (auth_unavailable), or PostgreSQL
            cannot provide the published credential view
            (database_unavailable).
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                auth_unavailable:
                  externalValue: examples/auth-unavailable.json
                database_unavailable:
                  externalValue: examples/database-unavailable.json
            application/xml:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                auth_unavailable:
                  externalValue: examples/auth-unavailable.xml
                database_unavailable:
                  externalValue: examples/database-unavailable.xml
  /v1/sessions/current:
    get:
      operationId: getCurrentSession
      summary: Read the current session claims
      x-mosaiq-roles:
        - ADMIN
        - ANALYST
        - STORE_MANAGER
        - MARKETING
        - INVENTORY_PLANNER
        - AUDITOR
        - CUSTOMER
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Current session claims.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionClaims"
              examples:
                current_session:
                  externalValue: examples/current-session.json
            application/xml:
              schema:
                $ref: "#/components/schemas/SessionClaims"
              examples:
                current_session:
                  externalValue: examples/current-session.xml
        "401":
          $ref: "#/components/responses/AccessTokenUnauthorized"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "503":
          $ref: "#/components/responses/AuthUnavailable"
    delete:
      operationId: deleteCurrentSession
      summary: Sign out the current session
      description: >-
        Deletes the session and makes its revocation durable before returning
        a bodyless response.
      x-mosaiq-roles:
        - ADMIN
        - ANALYST
        - STORE_MANAGER
        - MARKETING
        - INVENTORY_PLANNER
        - AUDITOR
        - CUSTOMER
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "204":
          description: Session revoked; no response body is returned.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
        "401":
          $ref: "#/components/responses/AccessTokenUnauthorized"
        "503":
          $ref: "#/components/responses/AuthUnavailable"
  /v1/jwks.json:
    get:
      operationId: getJwks
      summary: Read the public JSON Web Key Set
      description: >-
        This E-04 endpoint is JSON-only. An Accept header that excludes JSON
        receives not_acceptable.
      security: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Public signing keys.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/jwk-set+json:
              schema:
                $ref: "#/components/schemas/JwkSet"
              examples:
                jwks:
                  externalValue: examples/jwks.json
        "406":
          $ref: "#/components/responses/NotAcceptable"
  /health/live:
    get:
      operationId: getLiveness
      summary: Report process liveness
      security: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "204":
          description: The process is live; no response body is returned.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
  /health/ready:
    get:
      operationId: getReadiness
      summary: Report schema readiness
      security: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "204":
          description: The required schema is ready; no response body is returned.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
        "503":
          description: "The required schema has not been applied: schema_not_ready."
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                schema_not_ready:
                  externalValue: examples/schema-not-ready.json
            application/xml:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                schema_not_ready:
                  externalValue: examples/schema-not-ready.xml
  /openapi.yaml:
    get:
      operationId: getOpenApi
      summary: Read this OpenAPI document
      security: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: The service OpenAPI document.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/yaml:
              schema:
                type: string
  /schema.xsd:
    get:
      operationId: getSchema
      summary: Read the auth XML Schema
      security: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: The auth v1 XML Schema.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/xml:
              schema:
                type: string
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      description: >-
        A caller-supplied correlation id. Invalid or absent values are replaced
        by the service.
      schema:
        type: string
        pattern: "^[0-9A-Za-z-]{1,64}$"
  headers:
    CorrelationId:
      required: true
      description: The accepted or generated request correlation id.
      schema:
        type: string
        pattern: "^[0-9A-Za-z-]{1,64}$"
    RetryAfter:
      required: true
      description: Seconds until another sign-in attempt may be made.
      schema:
        type: integer
        minimum: 1
  schemas:
    RoleCode:
      type: string
      enum:
        - ADMIN
        - ANALYST
        - STORE_MANAGER
        - MARKETING
        - INVENTORY_PLANNER
        - AUDITOR
        - CUSTOMER
    SignInRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
        - device_label
      properties:
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 1024
        device_label:
          type: string
          minLength: 1
          maxLength: 100
    RefreshRequest:
      type: object
      additionalProperties: false
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          minLength: 1
          maxLength: 2048
    TokenResult:
      type: object
      additionalProperties: false
      required:
        - access_token
        - refresh_token
        - token_type
        - expires_in
        - expires_at
      properties:
        access_token:
          type: string
          minLength: 1
        refresh_token:
          type: string
          minLength: 1
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          const: 600
        expires_at:
          type: string
          format: date-time
    SessionClaims:
      type: object
      additionalProperties: false
      required:
        - sub
        - sid
        - role
        - issued_at
        - expires_at
      properties:
        sub:
          type: string
          pattern: "^[1-9][0-9]*$"
          description: The decimal app_user.user_id encoded by the JWT sub claim.
        sid:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/RoleCode"
        issued_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
    JwkSet:
      type: object
      additionalProperties: false
      required:
        - keys
      properties:
        keys:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/RsaJwk"
    RsaJwk:
      type: object
      additionalProperties: false
      required:
        - kty
        - kid
        - alg
        - use
        - n
        - e
      properties:
        kty:
          type: string
          const: RSA
        kid:
          type: string
          minLength: 1
        alg:
          type: string
          const: RS256
        use:
          type: string
          const: sig
        n:
          type: string
          minLength: 1
        e:
          type: string
          minLength: 1
    ErrorDetail:
      type: object
      additionalProperties: false
      required:
        - field
        - code
      properties:
        field:
          type: string
        code:
          type: string
          pattern: "^[a-z][a-z0-9_]*$"
    Error:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - correlation_id
        - details
      properties:
        code:
          type: string
          pattern: "^[a-z][a-z0-9_]*$"
        message:
          type: string
        correlation_id:
          type: string
          pattern: "^[0-9A-Za-z-]{1,64}$"
        details:
          type: array
          items:
            $ref: "#/components/schemas/ErrorDetail"
  responses:
    MalformedBody:
      description: "The body cannot be parsed safely: malformed_body."
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            malformed_body:
              externalValue: examples/malformed-body.json
        application/xml:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            malformed_body:
              externalValue: examples/malformed-body.xml
    NotAcceptable:
      description: "The requested response format is unsupported: not_acceptable."
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            not_acceptable:
              externalValue: examples/not-acceptable.json
        application/xml:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            not_acceptable:
              externalValue: examples/not-acceptable.xml
    PayloadTooLarge:
      description: "The body exceeds 64 KiB: payload_too_large."
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            payload_too_large:
              externalValue: examples/payload-too-large.json
        application/xml:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            payload_too_large:
              externalValue: examples/payload-too-large.xml
    UnsupportedMediaType:
      description: "The request format is unsupported: unsupported_media_type."
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            unsupported_media_type:
              externalValue: examples/unsupported-media-type.json
        application/xml:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            unsupported_media_type:
              externalValue: examples/unsupported-media-type.xml
    InvalidBody:
      description: "A parsed body violates its schema: invalid_body."
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            invalid_body:
              externalValue: examples/invalid-body.json
        application/xml:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            invalid_body:
              externalValue: examples/invalid-body.xml
    AccessTokenUnauthorized:
      description: >-
        The bearer token is invalid (invalid_token), or its session is no
        longer live (session_revoked).
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            invalid_token:
              externalValue: examples/invalid-token.json
            session_revoked:
              externalValue: examples/session-revoked.json
        application/xml:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            invalid_token:
              externalValue: examples/invalid-token.xml
            session_revoked:
              externalValue: examples/session-revoked.xml
    AuthUnavailable:
      description: "Session state cannot be checked or durably changed: auth_unavailable."
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            auth_unavailable:
              externalValue: examples/auth-unavailable.json
        application/xml:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            auth_unavailable:
              externalValue: examples/auth-unavailable.xml
