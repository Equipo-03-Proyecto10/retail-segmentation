        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ProtectedDatabaseUnavailable'
    put:
      operationId: replacePromotion
      x-mosaiq-status: planned
      summary: Replace a promotion of a draft campaign
      description: >-
        Replaces `name`, `discount_percent`, `starts_on`, `ends_on`, `store_ids`
        and `channel_ids` while the promotion's campaign is DRAFT. `campaign_id`,
        `promotion_id` and `is_active` are forbidden in the body and return 422
        `invalid_body`: a promotion never moves to another campaign. Every other
