components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      description: >-
        Caller-supplied correlation id. A value that does not match the pattern
        is ignored and replaced by a generated id.
      schema:
        type: string
        pattern: '^[0-9A-Za-z-]{1,64}$'
    CampaignId:
      name: campaign_id
      in: path
      required: true
      description: Positive integer campaign identifier allocated by the server.
      schema:
        $ref: '#/components/schemas/CampaignId'
    PromotionId:
      name: promotion_id
      in: path
      required: true
      description: Positive integer promotion identifier allocated by the server.
      schema:
        $ref: '#/components/schemas/PromotionId'
    CampaignIdQuery:
      name: campaign_id
      in: query
      required: false
      description: Exact campaign whose promotions to return.
      schema:
        $ref: '#/components/schemas/CampaignId'
    StoreIdQuery:
      name: store_id
      in: query
      required: false
      description: Only promotions that apply to this store.
      schema:
        $ref: '#/components/schemas/StoreId'
    ChannelIdQuery:
      name: channel_id
      in: query
      required: false
      description: Only promotions that apply to this channel.
      schema:
        $ref: '#/components/schemas/ChannelId'
    ActiveQuery:
      name: active
      in: query
      required: false
      description: >-
        true returns active promotions, false the others. The four floor roles
        may send only true.
      schema:
        type: boolean
    Page:
      name: page
      in: query
      required: false
      description: One-based page number.
      schema:
        type: integer
        minimum: 1
        default: 1
    Size:
      name: size
      in: query
      required: false
      description: Number of items per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  headers:
    CorrelationId:
      description: Correlation id used for this response.
      required: true
      schema:
        type: string
        pattern: '^[0-9A-Za-z-]{1,64}$'
    RetryAfter:
      description: Whole seconds until a retry is allowed.
      required: true
      schema:
        type: integer
        minimum: 1
  schemas:
    CampaignId:
      type: integer
      minimum: 1
      maximum: 2147483647
      readOnly: true
    CampaignName:
      type: string
      minLength: 1
      maxLength: 120
    LabelCode:
      type: string
      description: Stable segment label code; never a segment id.
      minLength: 1
      maxLength: 40
    CampaignStatus:
      type: string
      enum:
        - DRAFT
        - ACTIVE
        - FINISHED
        - CANCELLED
    Campaign:
      type: object
      additionalProperties: false
      required:
        - campaign_id
        - name
        - label_code
        - starts_on
        - ends_on
        - status
        - allowed_transitions
      properties:
        campaign_id:
          $ref: '#/components/schemas/CampaignId'
        name:
          $ref: '#/components/schemas/CampaignName'
        label_code:
          $ref: '#/components/schemas/LabelCode'
        starts_on:
          type: string
          format: date
        ends_on:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/CampaignStatus'
        allowed_transitions:
          type: array
          description: >-
            Statuses reachable from the current status: ACTIVE and CANCELLED
            from DRAFT; FINISHED and CANCELLED from ACTIVE; empty from either
            terminal status.
          uniqueItems: true
          items:
            $ref: '#/components/schemas/CampaignStatus'
      xml:
        name: Campaign
        namespace: https://mosaiq.maxthecoder.online/xml/campaigns/v1
    Campaigns:
      type: object
      additionalProperties: false
      required:
        - campaigns
        - page_info
      properties:
        campaigns:
          type: array
          items:
            $ref: '#/components/schemas/Campaign'
        page_info:
          $ref: '#/components/schemas/PageInfo'
      xml:
        name: Campaigns
        namespace: https://mosaiq.maxthecoder.online/xml/campaigns/v1
    CreateCampaignRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - label_code
        - starts_on
        - ends_on
      properties:
        name:
          $ref: '#/components/schemas/CampaignName'
        label_code:
          $ref: '#/components/schemas/LabelCode'
        starts_on:
          type: string
          format: date
        ends_on:
          type: string
          format: date
      xml:
        name: CreateCampaignRequest
        namespace: https://mosaiq.maxthecoder.online/xml/campaigns/v1
    UpdateCampaignRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          $ref: '#/components/schemas/CampaignName'
        label_code:
          $ref: '#/components/schemas/LabelCode'
        starts_on:
          type: string
          format: date
        ends_on:
          type: string
          format: date
      xml:
        name: UpdateCampaignRequest
        namespace: https://mosaiq.maxthecoder.online/xml/campaigns/v1
    TransitionCampaignRequest:
      type: object
      additionalProperties: false
      required:
        - to
        - expected_status
      properties:
        to:
          $ref: '#/components/schemas/CampaignStatus'
        expected_status:
          $ref: '#/components/schemas/CampaignStatus'
      xml:
        name: TransitionCampaignRequest
        namespace: https://mosaiq.maxthecoder.online/xml/campaigns/v1
    Uuid:
      type: string
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    Money:
      type: string
      description: A non-negative amount with exactly two decimals; no currency.
      pattern: '^[0-9]+\.[0-9]{2}$'
    DiscountPercent:
      type: string
      description: >-
        Percentage with exactly two decimals, above 0.00 and at most 100.00.
        The zero case is refused by the service as 422 `invalid_body`.
      pattern: '^(100\.00|[0-9]{1,2}\.[0-9]{2})$'
    PromotionId:
      type: integer
      minimum: 1
      maximum: 2147483647
      readOnly: true
    PromotionName:
      type: string
      minLength: 1
      maxLength: 120
    StoreId:
      type: integer
      minimum: 1
      maximum: 32767
    ChannelId:
      type: integer
      minimum: 1
      maximum: 32767
    MaxCustomers:
      type: integer
      minimum: 1
      maximum: 10000000
    CampaignAudience:
      type: object
      additionalProperties: false
      required:
        - campaign_id
        - label_code
        - audience_size
        - as_of
      properties:
        campaign_id:
          $ref: '#/components/schemas/CampaignId'
        label_code:
          $ref: '#/components/schemas/LabelCode'
        max_customers:
          $ref: '#/components/schemas/MaxCustomers'
        audience_size:
          type: integer
          minimum: 0
          readOnly: true
        as_of:
          type: string
          format: date-time
          readOnly: true
      xml:
        name: CampaignAudience
        namespace: https://mosaiq.maxthecoder.online/xml/campaigns/v1
    PutCampaignAudienceRequest:
      type: object
      additionalProperties: false
      properties:
        max_customers:
          $ref: '#/components/schemas/MaxCustomers'
      xml:
        name: PutCampaignAudienceRequest
        namespace: https://mosaiq.maxthecoder.online/xml/campaigns/v1
    AudienceExclusionReason:
      type: string
      description: >-
        Why a customer who holds the campaign's label is not in its audience. The
        order of the enumeration is the order of precedence.
      enum:
        - not_in_customer_reference
        - personalization_withdrawn
        - marketing_contact_withdrawn
        - excluded_customer
        - excluded_label
        - registered_after_cutoff
        - too_few_purchases
        - over_max_customers
    AudienceReason:
      type: object
      additionalProperties: false
      required:
        - code
        - excluded
      properties:
        code:
          $ref: '#/components/schemas/AudienceExclusionReason'
        excluded:
          type: integer
          description: Customers left out for this reason and no earlier one.
          minimum: 0
    CampaignAudienceBreakdown:
      type: object
      additionalProperties: false
      required:
        - campaign_id
        - label_code
        - label_holders
        - reasons
        - audience_size
        - as_of
      properties:
        campaign_id:
          $ref: '#/components/schemas/CampaignId'
        label_code:
          $ref: '#/components/schemas/LabelCode'
        label_holders:
          type: integer
          description: >-
            Customers whose current segment label is `label_code`, before any
            reason is applied.
          minimum: 0
        reasons:
          type: array
          description: >-
            One entry per reason, always eight, in the order of
            `AudienceExclusionReason`.
          minItems: 8
          maxItems: 8
          items:
            $ref: '#/components/schemas/AudienceReason'
        audience_size:
          type: integer
          description: >-
            `label_holders` minus the sum of `excluded` over `reasons`; equal to
            `getCampaignAudience`'s at the same `as_of`.
          minimum: 0
        as_of:
          type: string
          format: date-time
      xml:
        name: CampaignAudienceBreakdown
        namespace: https://mosaiq.maxthecoder.online/xml/campaigns/v1
