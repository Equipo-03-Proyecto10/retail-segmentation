  /v1/promotions:
    get:
      operationId: listPromotions
      x-mosaiq-status: planned
      summary: List promotions
      description: >-
        Returns promotions ordered by `promotion_id`. `campaign_id`, `store_id`,
        `channel_id` and `active` filter, and pagination applies after filtering.
        A promotion is active when its campaign is ACTIVE and today, in the
        database's date, lies within its validity. The four floor roles
        (`STORE_MANAGER`, `SALES_ASSOCIATE`, `LOYALTY_OFFICER`,
        `COMMERCIAL_SUPERVISOR`, ADR-0060) read active promotions only, and only
        for their assigned stores (`api_users.store_assignment_v1`, read per
        request): `active` defaults to true for them and `active=false` returns
        403 `forbidden_role`; a `store_id` that is not assigned returns 403
        `forbidden_store`; without `store_id` the list is limited to the assigned
        stores. The other four roles read every promotion, and `active` is
        unset by default for them.
      x-mosaiq-roles:
        - ADMIN
        - ANALYST
        - MARKETING
        - AUDITOR
        - STORE_MANAGER
        - SALES_ASSOCIATE
        - LOYALTY_OFFICER
        - COMMERCIAL_SUPERVISOR
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/CampaignIdQuery'
        - $ref: '#/components/parameters/StoreIdQuery'
        - $ref: '#/components/parameters/ChannelIdQuery'
        - $ref: '#/components/parameters/ActiveQuery'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: A page of promotions.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Promotions'
              examples:
                example:
                  externalValue: ./examples/promotions.json
            application/xml:
              schema:
                $ref: '#/components/schemas/Promotions'
              examples:
                example:
                  externalValue: ./examples/promotions.xml
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/PromotionReadForbidden'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '422':
          $ref: '#/components/responses/PromotionListValidation'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ProtectedDatabaseUnavailable'
    post:
      operationId: createPromotion
      x-mosaiq-status: planned
      summary: Create a promotion
      description: >-
        Creates a promotion of a DRAFT campaign. The server allocates
        `promotion_id`; `promotion_id` and `is_active` are forbidden in the body
        and return 422 `invalid_body`. `campaign_id` must name an existing
        campaign (422 `unknown_campaign`) that is DRAFT (409 `campaign_not_draft`).
        The validity must not end before it starts (422 `ends_before_start`) and
        must lie within the campaign's validity (422 `promotion_outside_campaign`).
        `store_ids` must exist in `api_stores.store_directory_v2` (422
        `unknown_store`), and each channel id must be enabled at one of the listed
        stores, from the same view's `channel_ids` (422 `unknown_channel`).
        `discount_percent` is a two-decimal string above 0.00 and at most 100.00.
        Whether a store's own cap applies is decided where a sale is recorded,
        not here.
      x-mosaiq-roles:
        - ADMIN
        - MARKETING
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePromotionRequest'
            examples:
              example:
                externalValue: ./examples/create-promotion.request.json
          application/xml:
            schema:
              $ref: '#/components/schemas/CreatePromotionRequest'
            examples:
              example:
                externalValue: ./examples/create-promotion.request.xml
      responses:
        '201':
          description: Promotion created.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            Location:
              description: Canonical URI of the new promotion.
              required: true
              schema:
                type: string
                format: uri-reference
                example: /v1/promotions/41
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Promotion'
              examples:
                example:
                  externalValue: ./examples/promotion.json
            application/xml:
              schema:
                $ref: '#/components/schemas/Promotion'
              examples:
                example:
                  externalValue: ./examples/promotion.xml
        '400':
          $ref: '#/components/responses/MalformedBody'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/ForbiddenRole'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '409':
          $ref: '#/components/responses/CampaignNotDraft'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/PromotionValidation'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ProtectedDatabaseUnavailable'
