openapi: 3.1.0
info:
  title: campaigns-service
  version: 1.3.0
  description: >-
    Owns the campaign lifecycle rule. A campaign is created as DRAFT, may be
    edited only while it remains DRAFT, and moves only DRAFT to ACTIVE or
    CANCELLED and ACTIVE to FINISHED or CANCELLED. FINISHED and CANCELLED are
    terminal. Activation is refused after the campaign has ended or while any
    attached experiment is not ready. `label_code` is the stable segment label
    vocabulary key; segment ids are never accepted or returned.
security:
  - bearer: []
paths:
  /v1/campaigns:
    get:
      operationId: listCampaigns
      summary: List campaigns
      description: >-
        Returns campaigns ordered by `campaign_id`. `status` and `label_code`
        are optional filters and pagination applies after filtering.
      x-mosaiq-roles:
        - ADMIN
        - ANALYST
        - MARKETING
        - AUDITOR
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: status
          in: query
          required: false
          description: Exact lifecycle status to return.
          schema:
            $ref: '#/components/schemas/CampaignStatus'
        - name: label_code
          in: query
          required: false
          description: Exact stable segment label code to return.
          schema:
            $ref: '#/components/schemas/LabelCode'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: A page of campaigns.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaigns'
              examples:
                campaigns:
                  externalValue: ./examples/campaigns.json
            application/xml:
              schema:
                $ref: '#/components/schemas/Campaigns'
              examples:
                campaigns:
                  externalValue: ./examples/campaigns.xml
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/ForbiddenRole'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '422':
          $ref: '#/components/responses/ListValidation'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ProtectedDatabaseUnavailable'
    post:
      operationId: createCampaign
      summary: Create a draft campaign
      description: >-
        Creates a campaign in DRAFT. The server allocates `campaign_id`;
        `campaign_id` and `status` are forbidden in the body and return 422
        `invalid_body`. The end date must not precede the start date, and
        `label_code` must exist in the stable segment label vocabulary. A DRAFT
        campaign with the same name, `label_code`, `starts_on` and `ends_on`
        returns 409 `duplicate_draft`.
      x-mosaiq-roles:
        - ADMIN
        - MARKETING
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCampaignRequest'
            examples:
              draft:
                externalValue: ./examples/create-campaign.request.json
          application/xml:
            schema:
              $ref: '#/components/schemas/CreateCampaignRequest'
            examples:
              draft:
                externalValue: ./examples/create-campaign.request.xml
      responses:
        '201':
          description: Draft campaign created.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            Location:
              description: Canonical URI of the new campaign.
              required: true
              schema:
                type: string
                format: uri-reference
                example: /v1/campaigns/301
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
              examples:
                draft:
                  externalValue: ./examples/campaign.json
            application/xml:
              schema:
                $ref: '#/components/schemas/Campaign'
              examples:
                draft:
                  externalValue: ./examples/campaign.xml
        '400':
          $ref: '#/components/responses/MalformedBody'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/ForbiddenRole'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '409':
          $ref: '#/components/responses/CampaignCreateConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/CampaignValidation'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ProtectedDatabaseUnavailable'
  /v1/campaigns/{campaign_id}:
    get:
      operationId: getCampaign
      summary: Get a campaign
      description: Returns one campaign and the transitions currently allowed.
      x-mosaiq-roles:
        - ADMIN
        - ANALYST
        - MARKETING
        - AUDITOR
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: The campaign.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
              examples:
                draft:
                  externalValue: ./examples/campaign.json
            application/xml:
              schema:
                $ref: '#/components/schemas/Campaign'
              examples:
                draft:
                  externalValue: ./examples/campaign.xml
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/ForbiddenRole'
        '404':
          $ref: '#/components/responses/CampaignNotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ProtectedDatabaseUnavailable'
    patch:
      operationId: updateCampaign
      summary: Edit a draft campaign
      description: >-
        Changes at least one of `name`, `label_code`, `starts_on` and
        `ends_on`, only while the campaign is DRAFT. No other field is
        accepted. In particular, `campaign_id` and `status` return 422
        `invalid_body` rather than changing identity or lifecycle state.
      x-mosaiq-roles:
        - ADMIN
        - MARKETING
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCampaignRequest'
            examples:
              campaign_update:
                externalValue: ./examples/update-campaign.request.json
          application/xml:
            schema:
              $ref: '#/components/schemas/UpdateCampaignRequest'
            examples:
              campaign_update:
                externalValue: ./examples/update-campaign.request.xml
      responses:
        '200':
          description: Draft campaign updated.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
              examples:
                campaign:
                  externalValue: ./examples/campaign.json
            application/xml:
              schema:
                $ref: '#/components/schemas/Campaign'
              examples:
                campaign:
                  externalValue: ./examples/campaign.xml
        '400':
          $ref: '#/components/responses/MalformedBody'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/ForbiddenRole'
        '404':
          $ref: '#/components/responses/CampaignNotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '409':
          $ref: '#/components/responses/CampaignNotDraft'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/CampaignValidation'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ProtectedDatabaseUnavailable'
  /v1/campaigns/{campaign_id}/transitions:
    post:
      operationId: transitionCampaign
      summary: Move a campaign to another status
      description: >-
        Applies one conditional state transition. `expected_status` must equal
        the stored status or the request returns `status_changed`. The only
        legal moves are DRAFT to ACTIVE or CANCELLED and ACTIVE to FINISHED or
        CANCELLED. FINISHED and CANCELLED are terminal. A move to ACTIVE is
        additionally refused after `ends_on`, or while any attached experiment
        has no treatment group, or has no control group and other than exactly
        two treatment groups.
      x-mosaiq-roles:
        - ADMIN
        - MARKETING
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionCampaignRequest'
            examples:
              draft_to_active:
                externalValue: ./examples/draft-to-active.request.json
              draft_to_cancelled:
                externalValue: ./examples/draft-to-cancelled.request.json
              active_to_finished:
                externalValue: ./examples/active-to-finished.request.json
              active_to_cancelled:
                externalValue: ./examples/active-to-cancelled.request.json
          application/xml:
            schema:
              $ref: '#/components/schemas/TransitionCampaignRequest'
            examples:
              draft_to_active:
                externalValue: ./examples/draft-to-active.request.xml
              draft_to_cancelled:
                externalValue: ./examples/draft-to-cancelled.request.xml
              active_to_finished:
                externalValue: ./examples/active-to-finished.request.xml
              active_to_cancelled:
                externalValue: ./examples/active-to-cancelled.request.xml
      responses:
        '200':
          description: Campaign transitioned.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
              examples:
                draft_to_active:
                  externalValue: ./examples/draft-to-active.json
                draft_to_cancelled:
                  externalValue: ./examples/draft-to-cancelled.json
                active_to_finished:
                  externalValue: ./examples/active-to-finished.json
                active_to_cancelled:
                  externalValue: ./examples/active-to-cancelled.json
            application/xml:
              schema:
                $ref: '#/components/schemas/Campaign'
              examples:
                draft_to_active:
                  externalValue: ./examples/draft-to-active.xml
                draft_to_cancelled:
                  externalValue: ./examples/draft-to-cancelled.xml
                active_to_finished:
                  externalValue: ./examples/active-to-finished.xml
                active_to_cancelled:
                  externalValue: ./examples/active-to-cancelled.xml
        '400':
          $ref: '#/components/responses/MalformedBody'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/ForbiddenRole'
        '404':
          $ref: '#/components/responses/CampaignNotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '409':
          $ref: '#/components/responses/TransitionConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/TransitionValidation'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ProtectedDatabaseUnavailable'
  /v1/campaigns/{campaign_id}/audience:
    get:
      operationId: getCampaignAudience
      x-mosaiq-status: planned
      summary: Get a campaign's audience
      description: >-
        Returns who the campaign targets: the campaign's `label_code`, an optional
        cap on the number of customers, and `audience_size`, computed when the
        request is served as of `as_of`. `audience_size` counts the customers
        whose current segment label is `label_code` (`api_segments.current_label_v1`,
        state `assigned`), registered in `api_customers.customer_ref_v1` and not
        anonymized, who have not withdrawn consent (a purpose is granted only when
        its latest row in `api_preferences.consent_state_v1` says `GRANTED`,
        ADR-0066 section 2: `PERSONALIZATION`, because the audience is built on a
        segment, and `MARKETING_CONTACT`), who are not excluded and who satisfy
        every eligibility rule, reduced to `max_customers` when a cap is set.
        `getCampaignAudienceBreakdown` counts who is left out, by reason. A
        campaign whose audience was never written has no cap.
      x-mosaiq-roles:
        - ADMIN
        - ANALYST
        - MARKETING
        - AUDITOR
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: The campaign's audience.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignAudience'
              examples:
                example:
                  externalValue: ./examples/campaign-audience.json
            application/xml:
              schema:
                $ref: '#/components/schemas/CampaignAudience'
              examples:
                example:
                  externalValue: ./examples/campaign-audience.xml
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/ForbiddenRole'
        '404':
          $ref: '#/components/responses/CampaignNotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ProtectedDatabaseUnavailable'
    put:
      operationId: putCampaignAudience
      x-mosaiq-status: planned
      summary: Replace a draft campaign's audience
      description: >-
        Replaces the audience's settings while the campaign is DRAFT. The only
        writable member is `max_customers`; an empty body removes the cap.
        `label_code`, `audience_size` and `as_of` are read-only, and sending one
        returns 422 `invalid_body`. The label is changed through `updateCampaign`.
      x-mosaiq-roles:
        - ADMIN
        - MARKETING
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutCampaignAudienceRequest'
            examples:
              example:
                externalValue: ./examples/put-campaign-audience.request.json
          application/xml:
            schema:
              $ref: '#/components/schemas/PutCampaignAudienceRequest'
            examples:
              example:
                externalValue: ./examples/put-campaign-audience.request.xml
      responses:
        '200':
          description: The audience now stored.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignAudience'
              examples:
                example:
                  externalValue: ./examples/campaign-audience.json
            application/xml:
              schema:
                $ref: '#/components/schemas/CampaignAudience'
              examples:
                example:
                  externalValue: ./examples/campaign-audience.xml
        '400':
          $ref: '#/components/responses/MalformedBody'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/ForbiddenRole'
        '404':
          $ref: '#/components/responses/CampaignNotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '409':
          $ref: '#/components/responses/CampaignNotDraft'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/AudienceValidation'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ProtectedDatabaseUnavailable'
  /v1/campaigns/{campaign_id}/audience/breakdown:
    get:
      operationId: getCampaignAudienceBreakdown
      x-mosaiq-status: planned
      summary: Get a campaign's audience with its exclusions counted by reason
      description: >-
        Returns the audience `getCampaignAudience` counts, with the customers it
        leaves out counted by reason, computed when the request is served as of
        `as_of`; nothing is stored. `label_holders` counts the customers whose
        current segment label is `label_code` (`api_segments.current_label_v1`,
        state `assigned`). `reasons` always holds eight entries, in this order,
        and a customer who fails several reasons is counted once, under the first
        that applies:
        `not_in_customer_reference` (the holder is absent from
        `api_customers.customer_ref_v1`, or is flagged anonymized there:
        ADR-0066 section 3 keeps an anonymized customer's key, so this is the
        reason that counts them, and they are never in the audience);
        `personalization_withdrawn` (`PERSONALIZATION` is not granted: the
        audience is built on a segment, so ADR-0066 section 2 excludes the
        customer);
        `marketing_contact_withdrawn` (`MARKETING_CONTACT` is not granted: ADR-0066
        section 2 excludes the customer from every audience, whatever its
        criterion);
        `excluded_customer` (named in the campaign's exclusions);
        `excluded_label` (holds a label listed in the campaign's exclusions; a
        customer holds one current label, so this removes customers only when the
        campaign's own label is listed);
        `registered_after_cutoff` (registered after `registered_on_or_before`);
        `too_few_purchases` (fewer than `min_purchases` net purchases in the
        `purchase_window_days` days before the request, counted as
        `getCampaignEligibilityRules` states); and `over_max_customers` (the
        customers above `max_customers` once every earlier reason is applied).
        A purpose is granted only when its latest row in
        `api_preferences.consent_state_v1` says `GRANTED`: a purpose with no
        row, with a `WITHDRAWN` row, or that cannot be read is treated as
        withdrawn (ADR-0066 section 2), so a customer is counted under the
        first of the two consent reasons whose purpose is not granted. A reason
        whose rule is not set counts 0. The counts add up: `label_holders` equals
        the sum of `excluded` over `reasons` plus `audience_size`, and
        `audience_size` equals the one `getCampaignAudience` returns when
        computed at the same `as_of`.
      x-mosaiq-roles:
        - ADMIN
        - ANALYST
        - MARKETING
        - AUDITOR
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: The campaign's audience and what it leaves out, by reason.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignAudienceBreakdown'
              examples:
                example:
                  externalValue: ./examples/campaign-audience-breakdown.json
            application/xml:
              schema:
                $ref: '#/components/schemas/CampaignAudienceBreakdown'
              examples:
                example:
                  externalValue: ./examples/campaign-audience-breakdown.xml
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/ForbiddenRole'
        '404':
          $ref: '#/components/responses/CampaignNotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ProtectedDatabaseUnavailable'
  /v1/campaigns/{campaign_id}/budget:
    get:
      operationId: getCampaignBudget
      x-mosaiq-status: planned
      summary: Get a campaign's budget
      description: >-
        Returns the campaign's budget. `total_amount` is the most the campaign may
        grant in discounts, and `per_customer_cap` the most one customer may
        receive. A member that was never written is absent, meaning no limit. The
        contract carries no currency.
      x-mosaiq-roles:
        - ADMIN
        - ANALYST
        - MARKETING
        - AUDITOR
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: The campaign's budget.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignBudget'
              examples:
                example:
                  externalValue: ./examples/campaign-budget.json
            application/xml:
              schema:
                $ref: '#/components/schemas/CampaignBudget'
              examples:
                example:
                  externalValue: ./examples/campaign-budget.xml
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/ForbiddenRole'
        '404':
          $ref: '#/components/responses/CampaignNotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ProtectedDatabaseUnavailable'
    put:
      operationId: putCampaignBudget
      x-mosaiq-status: planned
      summary: Replace a draft campaign's budget
      description: >-
        Replaces the budget while the campaign is DRAFT. Both amounts are
        optional two-decimal strings and an empty body removes the budget.
        `per_customer_cap` must not exceed `total_amount` when both are present,
        or the request returns 422 `invalid_body`.
      x-mosaiq-roles:
        - ADMIN
        - MARKETING
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutCampaignBudgetRequest'
            examples:
              example:
                externalValue: ./examples/put-campaign-budget.request.json
          application/xml:
            schema:
              $ref: '#/components/schemas/PutCampaignBudgetRequest'
            examples:
              example:
                externalValue: ./examples/put-campaign-budget.request.xml
      responses:
        '200':
          description: The budget now stored.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignBudget'
              examples:
                example:
                  externalValue: ./examples/campaign-budget.json
            application/xml:
              schema:
                $ref: '#/components/schemas/CampaignBudget'
              examples:
                example:
                  externalValue: ./examples/campaign-budget.xml
        '400':
          $ref: '#/components/responses/MalformedBody'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/ForbiddenRole'
        '404':
          $ref: '#/components/responses/CampaignNotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '409':
          $ref: '#/components/responses/CampaignNotDraft'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/PlanValidation'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ProtectedDatabaseUnavailable'
  /v1/campaigns/{campaign_id}/eligibility-rules:
    get:
      operationId: getCampaignEligibilityRules
      x-mosaiq-status: planned
      summary: Get a campaign's eligibility rules
      description: >-
        Returns the conditions a customer in the audience must satisfy. A customer
        is eligible when every rule that is present holds: registered on or before
        `registered_on_or_before` (`api_customers.customer_ref_v1.registered_on`),
        and having at least `min_purchases` net purchases in the
        `purchase_window_days` days before the request. A purchase is a sale
        counted net of reversals (ADR-0062): its net amount is the sum of
        `(quantity - returned_quantity) * unit_price` over its lines, and a sale
        whose net amount is zero, such as a cancelled one, does not count. The
        count reads `api_sales.net_purchase_line_v1`, never gross
        lines. A campaign with no rules written has none.
      x-mosaiq-roles:
        - ADMIN
        - ANALYST
        - MARKETING
        - AUDITOR
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: The campaign's eligibility rules.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignEligibilityRules'
              examples:
                example:
                  externalValue: ./examples/campaign-eligibility-rules.json
            application/xml:
              schema:
                $ref: '#/components/schemas/CampaignEligibilityRules'
              examples:
