    LookupValidationFailed:
      description: '`invalid_body`.'
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalid_body:
              $ref: '#/components/examples/InvalidLoyaltyBody'
        application/xml:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalid_body:
              $ref: '#/components/examples/InvalidLoyaltyBody'
