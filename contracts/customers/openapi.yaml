        application/xml:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            auth_unavailable:
              $ref: '#/components/examples/AuthUnavailable'
            database_unavailable:
              $ref: '#/components/examples/DatabaseUnavailable'
    RegisterValidationFailed:
      description: >-
        invalid_body — the parsed body violates its schema, including an email
        rejected by customer_email_check, a name that is empty or only
        whitespace, a name over 120 characters, an email over 160 characters,
        a phone over 20 characters, or an undeclared field; unknown_channel —
        registration_channel_id is not known; future_registration —
        registered_on is after the current date.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalid_body:
              $ref: '#/components/examples/InvalidBody'
            unknown_channel:
              $ref: '#/components/examples/UnknownChannel'
            future_registration:
              $ref: '#/components/examples/FutureRegistration'
        application/xml:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalid_body:
              $ref: '#/components/examples/InvalidBody'
            unknown_channel:
              $ref: '#/components/examples/UnknownChannel'
            future_registration:
              $ref: '#/components/examples/FutureRegistration'
    CorrectionValidationFailed:
      description: >-
        invalid_body — the parsed body violates its schema, including an email
        rejected by customer_email_check, a name that is empty or only
        whitespace, a name over 120 characters, an email over 160 characters,
        a phone over 20 characters, or any undeclared field such as
        registered_on; details names every invalid field;
        unknown_channel — registration_channel_id is not known.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalid_body:
              $ref: '#/components/examples/InvalidBody'
            unknown_channel:
              $ref: '#/components/examples/UnknownChannel'
        application/xml:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalid_body:
              $ref: '#/components/examples/InvalidBody'
            unknown_channel:
              $ref: '#/components/examples/UnknownChannel'
    CustomerNotFound:
      description: customer_not_found — the customer_id does not exist.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            customer_not_found:
              $ref: '#/components/examples/CustomerNotFound'
        application/xml:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            customer_not_found:
