openapi: 3.1.0
info:
  title: customers-service
  version: 1.6.0
  description: >-
    Registers, searches, reads and corrects customers under RN-08. Customers
    are never deleted through services; a mistaken registration is corrected
    with PATCH. Also issues and revokes loyalty cards, whose QR code is an
    opaque identifier. Floor roles read customers through the floor view, which
    carries only the customer's own fields; segment, RFM, interests,
    restrictions and consent are read from the services that own them.
servers:
  - url: /api/customers
security:
  - bearer: []
tags:
  - name: Customers
  - name: Loyalty cards
  - name: Meta
paths:
  /v1/customers:
    get:
      tags: [Customers]
      operationId: searchCustomers
      summary: Search customers
      description: >-
        Searches the customer directory. q is matched case-insensitively as a
        substring of name, email or phone; percent (%) and underscore (_) in q
        match themselves literally and are not SQL wildcards. email is an
        exact match that ignores letter case. When both filters are present,
        both must match. A filter value outside its schema, or an empty email,
        returns 422 `invalid_query`, naming the parameter in `details`.
      x-mosaiq-roles: [ADMIN, ANALYST, STORE_MANAGER, MARKETING, AUDITOR, LOYALTY_OFFICER]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: q
          in: query
          description: >-
            Case-insensitive literal substring matched over name, email or
            phone. Percent and underscore are literal characters.
          schema:
            type: string
            minLength: 1
            maxLength: 160
          example: '100% Club_'
        - name: email
          in: query
          description: Exact customer email match, ignoring letter case.
          schema:
            type: string
            maxLength: 160
          example: ana@example.com
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: A page of matching customers.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customers'
              examples:
                literal_percent_and_underscore:
                  externalValue: ./examples/search-literal-percent.json
            application/xml:
              schema:
                $ref: '#/components/schemas/Customers'
              examples:
                literal_percent_and_underscore:
                  externalValue: ./examples/search-literal-percent.xml
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '422':
          $ref: '#/components/responses/CustomerListValidation'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ProtectedDatabaseUnavailable'
    post:
      tags: [Customers]
      operationId: registerCustomer
      summary: Register a customer
      description: >-
        Registers one customer. registered_on is optional and defaults to the
        server's current date. A date after the server's current date is
        refused.
      x-mosaiq-roles: [ADMIN, STORE_MANAGER, LOYALTY_OFFICER]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterCustomerRequest'
            examples:
              registration:
                externalValue: ./examples/register-customer.request.json
          application/xml:
            schema:
              $ref: '#/components/schemas/RegisterCustomerRequest'
            examples:
              registration:
                externalValue: ./examples/register-customer.request.xml
      responses:
        '201':
          description: Customer registered.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            Location:
              description: URI of the registered customer.
              required: true
              schema:
                type: string
                format: uri-reference
              example: /v1/customers/6b8c1d78-38d1-45ba-8805-ddaf3a6c62b4
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
              examples:
                registered_customer:
                  externalValue: ./examples/register-customer.json
            application/xml:
              schema:
                $ref: '#/components/schemas/Customer'
              examples:
                registered_customer:
                  externalValue: ./examples/register-customer.xml
        '400':
          $ref: '#/components/responses/MalformedBody'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '409':
          $ref: '#/components/responses/EmailTaken'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/RegisterValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ProtectedDatabaseUnavailable'
  /v1/customers/{customer_id}:
    get:
      tags: [Customers]
      operationId: getCustomer
      summary: Get one customer
      x-mosaiq-roles: [ADMIN, ANALYST, STORE_MANAGER, MARKETING, AUDITOR, LOYALTY_OFFICER]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/CustomerId'
      responses:
        '200':
          description: The customer.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
              examples:
                customer:
                  externalValue: ./examples/get-customer.json
            application/xml:
              schema:
                $ref: '#/components/schemas/Customer'
              examples:
                customer:
                  externalValue: ./examples/get-customer.xml
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/CustomerNotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ProtectedDatabaseUnavailable'
    patch:
      tags: [Customers]
      operationId: correctCustomer
      summary: Correct a customer's data
      description: >-
        Corrects a mistaken registration. Only name, email, phone and
        registration_channel_id are accepted. Any other field, including
        registered_on, gets 422 invalid_body and a detail naming that field.
      x-mosaiq-roles: [ADMIN, STORE_MANAGER, LOYALTY_OFFICER]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/CustomerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorrectCustomerRequest'
            examples:
              correction:
                externalValue: ./examples/correct-customer.request.json
          application/xml:
            schema:
              $ref: '#/components/schemas/CorrectCustomerRequest'
            examples:
              correction:
                externalValue: ./examples/correct-customer.request.xml
      responses:
        '200':
          description: Corrected customer.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
              examples:
                corrected_customer:
                  externalValue: ./examples/correct-customer.json
            application/xml:
              schema:
                $ref: '#/components/schemas/Customer'
              examples:
                corrected_customer:
                  externalValue: ./examples/correct-customer.xml
        '400':
          $ref: '#/components/responses/MalformedBody'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/CustomerNotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '409':
          $ref: '#/components/responses/EmailTaken'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/CorrectionValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ProtectedDatabaseUnavailable'
  /v1/customers/floor-search:
    get:
      tags: [Customers]
      operationId: searchFloorCustomers
      summary: Search customers as a floor role
      description: >-
        The search a floor role uses to find the customer it is serving, in the
        floor view (`FloorCustomer`: no registration channel or date). `q` is
        required and must hold at least 3 characters once surrounding
        whitespace is removed (a shorter or missing `q` returns 422
        `invalid_query` with the detail code `too_short` or `required`), `size`
        is at most 20 (a larger `size` returns 422 `invalid_pagination`), and
        there is no `email` filter, since an exact email probe would reveal an
        address to a role that may not read it. `SALES_ASSOCIATE` matches `q`
        over name alone and its items omit `email` and `phone`;
        `LOYALTY_OFFICER` matches over name, email and phone and its items
        carry `email` and `phone`. An element a role may not read is absent,
        not null or masked.
      x-mosaiq-roles: [SALES_ASSOCIATE, LOYALTY_OFFICER]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 3
            maxLength: 160
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: A page of matching customers in the floor view.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FloorCustomers'
              examples:
                floor_customers:
                  externalValue: ./examples/search-floor-customers.json
            application/xml:
              schema:
                $ref: '#/components/schemas/FloorCustomers'
              examples:
                floor_customers:
                  externalValue: ./examples/search-floor-customers.xml
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '422':
          $ref: '#/components/responses/CustomerListValidation'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ProtectedDatabaseUnavailable'
  /v1/customers/{customer_id}/floor-view:
    get:
      tags: [Customers]
      operationId: getFloorCustomer
      summary: Get one customer as a floor role
      description: >-
        Returns the customer in the floor view of the token's role, which
        nothing the caller sends can change. `customer_id` and `name` are
        present for both roles; `email` and `phone` only for `LOYALTY_OFFICER`.
        `registration_channel_id` and `registered_on` are never present. The
        elements are customers' own; segment, RFM, interests, restrictions and
        consent belong to other services, each of which narrows its own
        resource by role, and the client composes them. The customer's loyalty
        state is read from `GET /v1/loyalty-cards?customer_id=`.
        `COMMERCIAL_SUPERVISOR` reads no customer element and receives 403
        `forbidden_role`.
      x-mosaiq-roles: [SALES_ASSOCIATE, LOYALTY_OFFICER]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/CustomerId'
      responses:
        '200':
          description: The customer in the caller's floor view.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FloorCustomer'
              examples:
                sales_associate:
                  externalValue: ./examples/get-floor-customer-sales-associate.json
            application/xml:
              schema:
                $ref: '#/components/schemas/FloorCustomer'
              examples:
                sales_associate:
                  externalValue: ./examples/get-floor-customer-sales-associate.xml
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/CustomerNotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ProtectedDatabaseUnavailable'
  /v1/loyalty-cards:
    post:
      tags: [Loyalty cards]
      operationId: issueLoyaltyCard
      summary: Issue a loyalty card to a customer
      description: >-
        Issues one card to the customer named in the body. The service
        generates the card's `code`: 128 random bits from a cryptographically
        secure source, written as 26 Crockford base32 characters. The code is
        derived from nothing about the customer, so it carries no personal data
        and cannot be computed from a customer id, name, email or phone. The
        QR printed on the card encodes exactly the 26 characters of `code`, and
        nothing else: no URL, no customer id, no name. A customer has at most
        one ACTIVE card; issuing a second returns 409 `active_card_exists`, and
        a replacement is issued only after the first is revoked. A card is
        never deleted; revocation is its only end. An unknown `customer_id`
        returns 422 `unknown_customer`.
      x-mosaiq-roles: [ADMIN, LOYALTY_OFFICER]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueLoyaltyCardRequest'
            examples:
              issue:
                externalValue: ./examples/issue-loyalty-card.request.json
          application/xml:
            schema:
              $ref: '#/components/schemas/IssueLoyaltyCardRequest'
            examples:
              issue:
                externalValue: ./examples/issue-loyalty-card.request.xml
      responses:
        '201':
          description: The card was issued.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoyaltyCard'
              examples:
                card:
                  externalValue: ./examples/issue-loyalty-card.json
            application/xml:
              schema:
                $ref: '#/components/schemas/LoyaltyCard'
              examples:
                card:
                  externalValue: ./examples/issue-loyalty-card.xml
        '400':
          $ref: '#/components/responses/MalformedBody'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '409':
          $ref: '#/components/responses/ActiveCardExists'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/IssueValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ProtectedDatabaseUnavailable'
    get:
      tags: [Loyalty cards]
      operationId: listLoyaltyCards
      summary: List a customer's loyalty cards
      description: >-
        Lists every card ever issued to one customer, newest first, active or
        revoked. `customer_id` is required: there is no way to list the cards of
        all customers. The response also carries the customer's `loyalty_state`,
        which is how a client learns it; the customer read does not.
      x-mosaiq-roles: [ADMIN, LOYALTY_OFFICER]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: customer_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: A page of the customer's cards.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoyaltyCards'
              examples:
                cards:
                  externalValue: ./examples/list-loyalty-cards.json
            application/xml:
              schema:
                $ref: '#/components/schemas/LoyaltyCards'
              examples:
                cards:
                  externalValue: ./examples/list-loyalty-cards.xml
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '422':
          $ref: '#/components/responses/CustomerListValidation'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ProtectedDatabaseUnavailable'
  /v1/loyalty-cards/lookup:
    post:
      tags: [Loyalty cards]
      operationId: lookupLoyaltyCard
      summary: Look a scanned code up
      description: >-
        Resolves the code a scanner read from a QR to the card's id and the
        customer it belongs to. The code travels in the body, never in the URL,
        so it stays out of access logs. The response holds two identifiers and
        no personal data; the caller reads the customer through
        `GET /v1/customers/{customer_id}`, which applies the role's
        representation. A code that matches no card returns 404
        `card_not_found`. A revoked card returns 409 `card_revoked` and names no
        customer. A body with any member besides `code`, or a `code` that is not
        26 Crockford base32 characters, returns 422 `invalid_body`. The service
        applies its request limit to this operation per caller, so a code
        cannot be guessed by repetition (429 `rate_limited`).
      x-mosaiq-roles: [ADMIN, SALES_ASSOCIATE, LOYALTY_OFFICER]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LookupLoyaltyCardRequest'
            examples:
              lookup:
                externalValue: ./examples/lookup-loyalty-card.request.json
          application/xml:
            schema:
              $ref: '#/components/schemas/LookupLoyaltyCardRequest'
            examples:
              lookup:
                externalValue: ./examples/lookup-loyalty-card.request.xml
      responses:
        '200':
          description: The card the code belongs to.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoyaltyCardLookup'
              examples:
                lookup:
                  externalValue: ./examples/lookup-loyalty-card.json
            application/xml:
              schema:
                $ref: '#/components/schemas/LoyaltyCardLookup'
              examples:
                lookup:
                  externalValue: ./examples/lookup-loyalty-card.xml
        '400':
          $ref: '#/components/responses/MalformedBody'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/CardNotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '409':
          $ref: '#/components/responses/CardRevoked'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/LookupValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ProtectedDatabaseUnavailable'
  /v1/loyalty-cards/{card_id}/revocation:
    put:
      tags: [Loyalty cards]
      operationId: revokeLoyaltyCard
      summary: Revoke a loyalty card
      description: >-
        Revokes the card, records who did it, when and why, and answers with the
        card. The operation is idempotent: revoking a card that is already
        revoked answers 200 with the original revocation, unchanged. A revoked
        card is never reactivated and never deleted. A lookup of its code
        answers 409 `card_revoked` from the moment this returns.
      x-mosaiq-roles: [ADMIN, LOYALTY_OFFICER]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: card_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeLoyaltyCardRequest'
            examples:
              revocation:
                externalValue: ./examples/revoke-loyalty-card.request.json
          application/xml:
            schema:
              $ref: '#/components/schemas/RevokeLoyaltyCardRequest'
            examples:
              revocation:
                externalValue: ./examples/revoke-loyalty-card.request.xml
      responses:
        '200':
          description: The revoked card.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoyaltyCard'
              examples:
                card:
                  externalValue: ./examples/revoke-loyalty-card.json
            application/xml:
              schema:
                $ref: '#/components/schemas/LoyaltyCard'
              examples:
                card:
                  externalValue: ./examples/revoke-loyalty-card.xml
        '400':
          $ref: '#/components/responses/MalformedBody'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/CardNotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/LookupValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ProtectedDatabaseUnavailable'
  /health/live:
    get:
      tags: [Meta]
      operationId: getLiveness
      summary: Report process liveness
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '204':
          description: The process is live.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
  /health/ready:
    get:
      tags: [Meta]
      operationId: getReadiness
      summary: Report schema readiness
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '204':
          description: The service is ready.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
        '503':
          $ref: '#/components/responses/SchemaNotReady'
  /openapi.yaml:
    get:
      tags: [Meta]
      operationId: getOpenApiDocument
      summary: Get this OpenAPI document
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: This contract, served byte for byte.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/yaml:
              schema:
                type: string
  /schema.xsd:
    get:
      tags: [Meta]
      operationId: getXmlSchema
      summary: Get the customers XML schema
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: The customers XSD, served byte for byte.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/xml:
              schema:
                type: string
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      description: >-
        Caller correlation id. A value that does not match the schema is
        ignored and replaced by the service.
      schema:
        type: string
        pattern: '^[0-9A-Za-z-]{1,64}$'
    CustomerId:
      name: customer_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  headers:
    CorrelationId:
      description: Correlation id used for this response.
      required: true
      schema:
        type: string
        pattern: '^[0-9A-Za-z-]{1,64}$'
    RetryAfter:
      description: Seconds until another request should be attempted.
      required: true
      schema:
        type: integer
        minimum: 1
  schemas:
    Customer:
      type: object
      additionalProperties: false
      required:
        - customer_id
        - name
        - email
        - phone
        - registration_channel_id
        - registered_on
      properties:
        customer_id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 120
        email:
          $ref: '#/components/schemas/NullableEmail'
        phone:
          type: [string, 'null']
          maxLength: 20
        registration_channel_id:
          type: integer
          minimum: -32768
          maximum: 32767
        registered_on:
          type: string
          format: date
      xml:
        name: Customer
        namespace: https://mosaiq.maxthecoder.online/xml/customers/v1
    Customers:
      type: object
      additionalProperties: false
      required: [customers, page_info]
      properties:
        customers:
          type: array
          items:
            $ref: '#/components/schemas/Customer'
        page_info:
          $ref: '#/components/schemas/PageInfo'
      xml:
        name: Customers
        namespace: https://mosaiq.maxthecoder.online/xml/customers/v1
    RegisterCustomerRequest:
      type: object
      additionalProperties: false
      required: [name, email, phone, registration_channel_id]
      properties:
        name:
          type: string
          maxLength: 120
          description: >-
            Refused with 422 invalid_body when it is empty or only
            whitespace.
        email:
          $ref: '#/components/schemas/NullableEmail'
        phone:
          type: [string, 'null']
          maxLength: 20
        registration_channel_id:
          type: integer
          minimum: -32768
          maximum: 32767
        registered_on:
          type: string
          format: date
          description: >-
            Registration date. When omitted, the server uses its current date.
      xml:
        name: RegisterCustomerRequest
        namespace: https://mosaiq.maxthecoder.online/xml/customers/v1
    CorrectCustomerRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: >-
        A correction containing only fields that customers-service may update.
        In particular, registered_on is not accepted.
      properties:
        name:
          type: string
          maxLength: 120
          description: >-
            Refused with 422 invalid_body when it is empty or only
            whitespace.
        email:
          $ref: '#/components/schemas/NullableEmail'
        phone:
          type: [string, 'null']
          maxLength: 20
        registration_channel_id:
          type: integer
          minimum: -32768
          maximum: 32767
      xml:
        name: CorrectCustomerRequest
        namespace: https://mosaiq.maxthecoder.online/xml/customers/v1
    NullableEmail:
      type: [string, 'null']
      maxLength: 160
      pattern: '^[^@\s]+@[^@\s.]+(?:\.[^@\s.]+)+$'
      description: >-
        Null or an address accepted by customer_email_check: non-whitespace
        local and domain parts, one at-sign, and a dotted domain. It is stored
        and returned lower-cased, and no two customers share it in any letter
        case (ux_customer_email_lower).
    PageInfo:
      type: object
      additionalProperties: false
      required: [page, size, total]
      properties:
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [field, code]
      properties:
        field:
          type: string
        code:
          type: string
    Error:
      type: object
      additionalProperties: false
      required: [code, message, correlation_id, details]
      properties:
        code:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
        message:
          type: string
        correlation_id:
          type: string
          pattern: '^[0-9A-Za-z-]{1,64}$'
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
    LoyaltyCard:
      type: object
      additionalProperties: false
      required: [card_id, customer_id, code, status, issued_at, issued_by, revoked_at, revoked_by, revocation_reason]
      properties:
        card_id:
          type: string
          format: uuid
        customer_id:
          type: string
          format: uuid
        code:
          $ref: '#/components/schemas/CardCode'
        status:
          type: string
          enum: [ACTIVE, REVOKED]
        issued_at:
          type: string
          format: date-time
        issued_by:
          type: string
          format: uuid
        revoked_at:
          type: [string, 'null']
          format: date-time
        revoked_by:
          type: [string, 'null']
          format: uuid
        revocation_reason:
          type: [string, 'null']
          enum: [LOST, STOLEN, REPLACED, CUSTOMER_REQUEST, OTHER, null]
      xml:
        name: LoyaltyCard
        namespace: https://mosaiq.maxthecoder.online/xml/customers/v1
    CardCode:
      type: string
      pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
      description: >-
        An opaque identifier: 128 random bits as 26 Crockford base32
        characters (digits and uppercase letters except I, L, O and U). It
        holds no personal data and is derived from none. A QR encodes this
        string alone.
    FloorCustomer:
      type: object
      additionalProperties: false
      description: >-
        A customer in the floor view: `customer_id` and `name` always; `email`
        and `phone` only for `LOYALTY_OFFICER`, absent for `SALES_ASSOCIATE`.
      required: [customer_id, name]
      properties:
        customer_id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 120
        email:
          $ref: '#/components/schemas/NullableEmail'
        phone:
          type: [string, 'null']
          maxLength: 20
      xml:
        name: FloorCustomer
        namespace: https://mosaiq.maxthecoder.online/xml/customers/v1
    FloorCustomers:
      type: object
      additionalProperties: false
      required: [customers, page_info]
      properties:
        customers:
          type: array
          items:
            $ref: '#/components/schemas/FloorCustomer'
        page_info:
          $ref: '#/components/schemas/PageInfo'
      xml:
        name: FloorCustomers
        namespace: https://mosaiq.maxthecoder.online/xml/customers/v1
    LoyaltyCards:
      type: object
      additionalProperties: false
      description: >-
        The customer's cards and its `loyalty_state`: `ACTIVE` when one card is
        ACTIVE, `REVOKED` when cards exist and every one is revoked, `NONE`
        when none was ever issued.
      required: [loyalty_state, loyalty_cards, page_info]
      properties:
        loyalty_state:
          type: string
          enum: [NONE, ACTIVE, REVOKED]
        loyalty_cards:
          type: array
          items:
            $ref: '#/components/schemas/LoyaltyCard'
        page_info:
          $ref: '#/components/schemas/PageInfo'
      xml:
        name: LoyaltyCards
        namespace: https://mosaiq.maxthecoder.online/xml/customers/v1
    IssueLoyaltyCardRequest:
      type: object
      additionalProperties: false
      required: [customer_id]
      properties:
        customer_id:
          type: string
          format: uuid
      xml:
        name: IssueLoyaltyCardRequest
        namespace: https://mosaiq.maxthecoder.online/xml/customers/v1
    RevokeLoyaltyCardRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          enum: [LOST, STOLEN, REPLACED, CUSTOMER_REQUEST, OTHER]
      xml:
        name: RevokeLoyaltyCardRequest
        namespace: https://mosaiq.maxthecoder.online/xml/customers/v1
    LookupLoyaltyCardRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          $ref: '#/components/schemas/CardCode'
      xml:
        name: LookupLoyaltyCardRequest
        namespace: https://mosaiq.maxthecoder.online/xml/customers/v1
    LoyaltyCardLookup:
      type: object
      additionalProperties: false
      required: [card_id, customer_id]
      properties:
        card_id:
          type: string
          format: uuid
        customer_id:
          type: string
          format: uuid
      xml:
        name: LoyaltyCardLookup
        namespace: https://mosaiq.maxthecoder.online/xml/customers/v1
  examples:
    MalformedBody:
      value:
        code: malformed_body
        message: The request body could not be parsed safely.
        correlation_id: corr-432-malformed
        details: []
    InvalidToken:
      value:
        code: invalid_token
        message: The bearer token is invalid.
        correlation_id: corr-432-token
        details: []
    SessionRevoked:
      value:
        code: session_revoked
        message: The token session is no longer live.
        correlation_id: corr-432-session
        details: []
    ForbiddenRole:
      value:
        code: forbidden_role
        message: The authenticated role cannot perform this operation.
        correlation_id: corr-432-role
        details: []
    NotAcceptable:
      value:
        code: not_acceptable
        message: The requested response format is unsupported.
        correlation_id: corr-432-accept
        details: []
    PayloadTooLarge:
      value:
        code: payload_too_large
        message: The request body exceeds 64 KiB.
        correlation_id: corr-432-size
        details: []
    UnsupportedMediaType:
      value:
        code: unsupported_media_type
        message: The request format is unsupported.
        correlation_id: corr-432-media
        details: []
    InvalidPagination:
      value:
        code: invalid_pagination
        message: The pagination values are outside their allowed ranges.
        correlation_id: corr-432-page
        details:
          - field: size
            code: out_of_range
    RateLimited:
      value:
        code: rate_limited
        message: The request limit was exceeded.
        correlation_id: corr-432-rate
        details: []
    AuthUnavailable:
      value:
        code: auth_unavailable
        message: Session state cannot be checked.
        correlation_id: corr-432-auth
        details: []
    DatabaseUnavailable:
      value:
        code: database_unavailable
        message: The customer database is unavailable.
        correlation_id: corr-432-database
        details: []
    SchemaNotReady:
      value:
        code: schema_not_ready
        message: The required database schema has not been applied.
        correlation_id: corr-432-schema
        details: []
    EmailTaken:
      value:
        code: email_taken
        message: The email already belongs to another customer.
        correlation_id: corr-432-email
        details:
          - field: email
            code: not_unique
    UnknownChannel:
      value:
        code: unknown_channel
        message: The registration channel does not exist.
        correlation_id: corr-432-channel
        details:
          - field: registration_channel_id
            code: unknown_reference
    FutureRegistration:
      value:
        code: future_registration
        message: The registration date cannot be in the future.
        correlation_id: corr-432-future
        details:
          - field: registered_on
            code: future_date
    CustomerNotFound:
      value:
        code: customer_not_found
        message: The customer does not exist.
        correlation_id: corr-432-missing
        details:
          - field: customer_id
            code: not_found
    InvalidBody:
      value:
        code: invalid_body
        message: The parsed body violates the request schema.
        correlation_id: corr-432-body
        details:
          - field: registered_on
            code: unexpected_field
    InvalidLoyaltyBody:
      value:
        code: invalid_body
        message: The parsed body violates the request schema.
        correlation_id: corr-791-body
        details:
          - field: code
            code: invalid_format
  responses:
    MalformedBody:
      description: malformed_body — the body cannot be parsed safely.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            malformed_body:
              $ref: '#/components/examples/MalformedBody'
        application/xml:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            malformed_body:
              $ref: '#/components/examples/MalformedBody'
    Unauthorized:
      description: >-
        invalid_token — the bearer token is invalid; session_revoked — its
        session is no longer live.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalid_token:
              $ref: '#/components/examples/InvalidToken'
            session_revoked:
              $ref: '#/components/examples/SessionRevoked'
        application/xml:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalid_token:
              $ref: '#/components/examples/InvalidToken'
            session_revoked:
              $ref: '#/components/examples/SessionRevoked'
    Forbidden:
      description: forbidden_role — the authenticated role is not allowed.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            forbidden_role:
              $ref: '#/components/examples/ForbiddenRole'
        application/xml:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            forbidden_role:
              $ref: '#/components/examples/ForbiddenRole'
    NotAcceptable:
      description: not_acceptable — the response format is unsupported.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            not_acceptable:
              $ref: '#/components/examples/NotAcceptable'
        application/xml:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            not_acceptable:
              $ref: '#/components/examples/NotAcceptable'
    EmailTaken:
      description: >-
        email_taken — the email already belongs to another customer, in any
        letter case.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            email_taken:
              $ref: '#/components/examples/EmailTaken'
        application/xml:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            email_taken:
              $ref: '#/components/examples/EmailTaken'
    PayloadTooLarge:
      description: payload_too_large — the body exceeds 64 KiB.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            payload_too_large:
              $ref: '#/components/examples/PayloadTooLarge'
        application/xml:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            payload_too_large:
              $ref: '#/components/examples/PayloadTooLarge'
    UnsupportedMediaType:
      description: unsupported_media_type — the request format is unsupported.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unsupported_media_type:
              $ref: '#/components/examples/UnsupportedMediaType'
        application/xml:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unsupported_media_type:
              $ref: '#/components/examples/UnsupportedMediaType'
    CustomerListValidation:
      description: '`invalid_pagination` or `invalid_query`.'
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalid_pagination:
              $ref: '#/components/examples/InvalidPagination'
            invalid_query:
              externalValue: ./examples/invalid-query.json
        application/xml:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalid_pagination:
              $ref: '#/components/examples/InvalidPagination'
            invalid_query:
              externalValue: ./examples/invalid-query.xml
    RateLimited:
      description: rate_limited — the request limit was exceeded.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            rate_limited:
              $ref: '#/components/examples/RateLimited'
        application/xml:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            rate_limited:
              $ref: '#/components/examples/RateLimited'
    ProtectedDatabaseUnavailable:
      description: >-
        auth_unavailable — session state cannot be checked;
        database_unavailable — PostgreSQL cannot complete the operation.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            auth_unavailable:
