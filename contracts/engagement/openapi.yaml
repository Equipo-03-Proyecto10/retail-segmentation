    IncidentSourceType:
      type: string
      description: Which queued write was refused.
      enum:
      - SALE
      - CHECK_IN
      - ENGAGEMENT_EVENT
      - CUSTOMER_WRITE
    IncidentStatus:
      type: string
      description: The resolution state. Moves forward only.
      enum:
      - OPEN
      - ACKNOWLEDGED
      - RESOLVED
    CaptureIncidentRequest:
      type: object
      additionalProperties: false
      description: A refused queued write, reported once. It carries no customer
        field and no free text.
      required:
      - client_incident_id
      - source_type
      - source_operation_id
      - source_correlation_id
      - store_id
      - refused_status
      - refused_code
      - attempts
      - occurred_at
      properties:
        client_incident_id:
          type: string
          format: uuid
          description: The idempotency key, the UUIDv5 of `source_operation_id` under
            one fixed namespace, computed when the outbox row is created.
        source_type:
          $ref: '#/components/schemas/IncidentSourceType'
        source_operation_id:
          type: string
          format: uuid
          description: The refused write's own key, its `Idempotency-Key`, `client_event_id`
            or `client_check_in_id`.
        source_correlation_id:
          type: string
          pattern: ^[0-9A-Za-z-]{1,64}$
          description: The `X-Correlation-ID` of the refused attempt.
        store_id:
          type: integer
          format: int32
        refused_status:
          type: integer
          minimum: 400
          maximum: 499
          description: The HTTP status of the final refusal.
        refused_code:
          type: string
          pattern: ^[a-z][a-z0-9_]{0,63}$
          description: The refusing service's error code, for example `stock_unavailable`.
        attempts:
          type: integer
          minimum: 1
        occurred_at:
          type: string
          format: date-time
          description: When the user acted, by the device clock.
        line_count:
          type:
          - integer
          - 'null'
          minimum: 1
          description: Lines in the refused sale; only for `SALE`, otherwise null.
