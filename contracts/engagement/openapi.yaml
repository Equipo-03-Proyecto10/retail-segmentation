openapi: 3.1.0
info:
  title: engagement-service
  version: 2.4.0
  description: 'Records client-originated field events (RN-55): in-store engagement
    events and capture incidents, the device''s reports of a refused queued write
    (ADR-0071). Both live in MongoDB, in `engagement_event` and `capture_incident`.
    Engagement events live in MongoDB, are recorded once per client event, attributed
    to the caller, voided rather than deleted, and summarized. `POST /v1/engagement-events`
    and `POST /v2/engagement-events` read PostgreSQL through the published store,
    product and customer views to check the references each kind carries. Every
    operation answers 503 `database_unavailable` when its database is unreachable,
    MongoDB included. XML events are polymorphic: each event or request root carries
    the `xsi:type` for its kind, so each schema admits only that kind''s fields. `/v1`
    is frozen. `/v2` (XSD `engagement.v2.xsd`, namespace
    `.../xml/engagement/v2`, served at `/schema.v2.xsd`) keeps `QR_SCAN` and `RECO_CLICK`
    with their meaning and adds `STORE_VISIT`, `RECO_IMPRESSION`, `CAMPAIGN_EXPOSURE`,
    `CART_ADD`, `CART_REMOVE` and `NAVIGATION`, each a distinct fact. None of these events
    is a sale: a confirmed transaction exists only in sales-service. A `CAMPAIGN_EXPOSURE`
    carries the campaign and the customer. experimentation does not call this service:
    engagement relays the exposure on the Redis Stream `stream:engagement.v1.interaction_recorded`
    from an outbox kept on the event document (ADR-0075), and experimentation keeps its own
    projection and counts exposures per campaign and customer from it, never as a conversion.
    A void reaches that projection as a later notice, so the count is eventually consistent.
    The stream is contracted in `contracts/streams/engagement.interaction_recorded.v1.md`. The v2 summary
    counts every type.'
security:
- bearer: []
tags:
- name: Engagement
- name: Capture incidents
- name: Meta
paths:
  /v1/engagement-events:
    post:
      tags:
      - Engagement
      summary: Record a QR scan or a recommendation click
      description: 'Records the event once per `client_event_id`, attributed to
        the token''s `sub` (`recorded_by`). The body has two shapes, `QR_SCAN` and
        `RECO_CLICK`. Store, product and customer are checked against the published
        store, product and customer views: the store must exist and be active. A
        new event answers 201. The same `client_event_id` arriving again with the
        same `type`, `store_id` and `product_id` answers 200 with the original event
        and writes nothing; with any other type, store or product it answers 409
        `client_event_conflict`. `occurred_at` more than five minutes ahead of the
        server answers 422 `occurred_in_future`.'
      operationId: createEngagementEvent
      x-mosaiq-roles:
      - ADMIN
      - STORE_MANAGER
      - SALES_ASSOCIATE
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: &id001
              $ref: '#/components/schemas/EngagementEventRequest'
            examples:
              qr_scan:
                externalValue: ./examples/qr-scan.request.json
              reco_click:
                externalValue: ./examples/reco-click.request.json
          application/xml:
            schema: *id001
            examples:
              qr_scan:
                externalValue: ./examples/qr-scan.request.xml
              reco_click:
                externalValue: ./examples/reco-click.request.xml
      responses:
        '200':
          description: 'A replay: the original event, nothing written.'
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema: &id002
                $ref: '#/components/schemas/EngagementEvent'
              examples:
                replay:
                  externalValue: ./examples/replay.json
            application/xml:
              schema: *id002
              examples:
                replay:
                  externalValue: ./examples/replay.xml
        '201':
          description: The event was recorded.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema: &id003
                $ref: '#/components/schemas/EngagementEvent'
              examples:
                qr_scan:
                  externalValue: ./examples/qr-scan.json
                reco_click:
                  externalValue: ./examples/reco-click.json
            application/xml:
              schema: *id003
              examples:
                qr_scan:
                  externalValue: ./examples/qr-scan.xml
                reco_click:
                  externalValue: ./examples/reco-click.xml
        '400':
          $ref: '#/components/responses/MalformedBody'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '409':
          $ref: '#/components/responses/CreateConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/CreateInvalid'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/OperationUnavailable'
    get:
      tags:
      - Engagement
      summary: List engagement events
      description: Returns a page ordered by `occurred_at`, newest first. `from`
        and `to` are RFC 3339 timestamps bounding `occurred_at`. Voided events are
        listed unless `voided=false`.
      operationId: listEngagementEvents
      x-mosaiq-roles: &id005
      - ADMIN
      - ANALYST
      - STORE_MANAGER
      - MARKETING
      - AUDITOR
      - SALES_ASSOCIATE
      - COMMERCIAL_SUPERVISOR
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/Type'
      - $ref: '#/components/parameters/StoreId'
      - $ref: '#/components/parameters/CustomerId'
      - $ref: '#/components/parameters/Voided'
      - $ref: '#/components/parameters/From'
      - $ref: '#/components/parameters/To'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: A page of events.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema: &id004
                $ref: '#/components/schemas/EngagementEventPage'
              examples:
                page:
                  externalValue: ./examples/events-page.json
            application/xml:
              schema: *id004
              examples:
                page:
                  externalValue: ./examples/events-page.xml
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '422':
          $ref: '#/components/responses/InvalidQuery'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/OperationUnavailable'
  /v1/engagement-events/{event_id}:
    get:
      tags:
      - Engagement
      summary: Get one engagement event
      description: Returns the event with its `history`.
      operationId: getEngagementEvent
      x-mosaiq-roles: *id005
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: The event.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema: &id006
                $ref: '#/components/schemas/EngagementEvent'
              examples:
                voided:
                  externalValue: ./examples/voided-event.json
            application/xml:
              schema: *id006
              examples:
                voided:
                  externalValue: ./examples/voided-event.xml
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/OperationUnavailable'
  /v1/engagement-events/{event_id}/void:
    post:
      tags:
      - Engagement
      summary: Void an engagement event
      description: 'Voids the event: it is never deleted, a `VOIDED` entry is added
        to its `history`, and summaries stop counting it.'
      operationId: voidEngagementEvent
      x-mosaiq-roles:
      - ADMIN
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema: &id007
              $ref: '#/components/schemas/VoidRequest'
            examples:
              void:
                externalValue: ./examples/void.request.json
          application/xml:
            schema: *id007
            examples:
              void:
                externalValue: ./examples/void.request.xml
      responses:
        '200':
          description: The voided event.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema: &id008
                $ref: '#/components/schemas/EngagementEvent'
              examples:
                voided:
                  externalValue: ./examples/voided-event.json
            application/xml:
              schema: *id008
              examples:
                voided:
                  externalValue: ./examples/voided-event.xml
        '400':
          $ref: '#/components/responses/MalformedBody'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '409':
          $ref: '#/components/responses/VoidConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/InvalidBody'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/OperationUnavailable'
  /v1/engagement-summaries:
    get:
      tags:
      - Engagement
      summary: Summarize engagement
      description: Counts events that are not voided, grouped by `store`, `day`
        or `type`. `from` and `to` are UTC dates (`YYYY-MM-DD`), both inclusive,
        and a day is a UTC day.
      operationId: getEngagementSummary
      x-mosaiq-roles:
      - ADMIN
      - ANALYST
      - STORE_MANAGER
      - MARKETING
      - INVENTORY_PLANNER
      - AUDITOR
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/SummaryFrom'
      - $ref: '#/components/parameters/SummaryTo'
      - $ref: '#/components/parameters/SummaryStoreId'
      - $ref: '#/components/parameters/GroupBy'
      responses:
        '200':
          description: The counts.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema: &id009
                $ref: '#/components/schemas/EngagementSummary'
              examples:
                by_store:
                  externalValue: ./examples/summary-by-store.json
                by_day:
                  externalValue: ./examples/summary-by-day.json
                by_type:
                  externalValue: ./examples/summary-by-type.json
            application/xml:
              schema: *id009
              examples:
                by_store:
                  externalValue: ./examples/summary-by-store.xml
                by_day:
                  externalValue: ./examples/summary-by-day.xml
                by_type:
                  externalValue: ./examples/summary-by-type.xml
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '422':
          $ref: '#/components/responses/InvalidSummaryQuery'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/OperationUnavailable'
  /v1/capture-incidents:
    post:
      tags:
      - Capture incidents
      summary: Report a refused floor write
      description: 'The device reports, once, that a queued write (`source_type`,
        `source_operation_id`) was finally refused (ADR-0071). Recorded once per
        `client_incident_id`, attributed to the token''s `sub` (`reported_by`). The
        service does not verify the refusal: an incident is a claim, shown as
        reported. The same `client_incident_id` arriving again with the same
        `source_type` and `source_operation_id`, or a second report of the same
        `(source_type, source_operation_id)`, answers 200 with the original and writes
        nothing; any other combination answers 409 `client_incident_conflict`. The
        store must exist and the caller must be assigned to it (403 `forbidden_store`,
        ADR-0060; `ADMIN` is not narrowed). `occurred_at` more than five minutes
        ahead of the server answers 422 `occurred_in_future`. There is no customer
        field and no free text. The reporter does not read incidents back.'
      operationId: reportCaptureIncident
      x-mosaiq-roles:
      - SALES_ASSOCIATE
      - LOYALTY_OFFICER
      - STORE_MANAGER
      - COMMERCIAL_SUPERVISOR
      - ADMIN
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaptureIncidentRequest'
            examples:
              refused_sale:
                externalValue: ./examples/capture-incident.request.json
          application/xml:
            schema:
              $ref: '#/components/schemas/CaptureIncidentRequest'
            examples:
              refused_sale:
                externalValue: ./examples/capture-incident.request.xml
      responses:
        '200':
          description: A replay, the original incident with nothing written.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureIncident'
              examples:
                replay:
                  externalValue: ./examples/capture-incident.json
            application/xml:
              schema:
                $ref: '#/components/schemas/CaptureIncident'
              examples:
                replay:
                  externalValue: ./examples/capture-incident.xml
        '201':
          description: The recorded incident.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureIncident'
              examples:
                open:
                  externalValue: ./examples/capture-incident.json
            application/xml:
              schema:
                $ref: '#/components/schemas/CaptureIncident'
              examples:
                open:
                  externalValue: ./examples/capture-incident.xml
        '400':
          $ref: '#/components/responses/MalformedBody'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/IncidentForbidden'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '409':
          $ref: '#/components/responses/IncidentCreateConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/IncidentCreateInvalid'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/OperationUnavailable'
    get:
      tags:
      - Capture incidents
      summary: List capture incidents
      description: 'Returns a page ordered by `recorded_at`, newest first, narrowed
        to the stores the caller is assigned to (ADR-0060); `ADMIN` sees every store.
        A `store_id` filter outside the caller''s stores answers 403 `forbidden_store`.
        The mobile poll sends `status=OPEN` and `recorded_since` set to the largest
        server `recorded_at` it holds minus five minutes (ADR-0071).'
      operationId: listCaptureIncidents
      x-mosaiq-roles:
      - COMMERCIAL_SUPERVISOR
      - ADMIN
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/IncidentStatus'
      - $ref: '#/components/parameters/StoreId'
      - $ref: '#/components/parameters/IncidentSourceType'
      - $ref: '#/components/parameters/RecordedSince'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: A page of incidents.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureIncidentPage'
              examples:
                page:
                  externalValue: ./examples/capture-incidents-page.json
            application/xml:
              schema:
                $ref: '#/components/schemas/CaptureIncidentPage'
              examples:
                page:
                  externalValue: ./examples/capture-incidents-page.xml
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/IncidentForbidden'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '422':
          $ref: '#/components/responses/InvalidQuery'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/OperationUnavailable'
  /v1/capture-incidents/{incident_id}:
    get:
      tags:
      - Capture incidents
      summary: Get one capture incident
      description: Returns the incident with its review `history`. An incident of
        a store outside the caller's assignment answers 403 `forbidden_store`.
      operationId: getCaptureIncident
      x-mosaiq-roles:
      - COMMERCIAL_SUPERVISOR
      - ADMIN
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/IncidentId'
      responses:
        '200':
          description: The incident.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureIncident'
              examples:
                resolved:
                  externalValue: ./examples/capture-incident-resolved.json
                open:
                  externalValue: ./examples/capture-incident.json
            application/xml:
              schema:
                $ref: '#/components/schemas/CaptureIncident'
              examples:
                resolved:
                  externalValue: ./examples/capture-incident-resolved.xml
                open:
                  externalValue: ./examples/capture-incident.xml
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/IncidentForbidden'
        '404':
          $ref: '#/components/responses/IncidentNotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/OperationUnavailable'
  /v1/capture-incidents/{incident_id}/reviews:
    post:
      tags:
      - Capture incidents
      summary: Acknowledge or resolve a capture incident
      description: 'Appends a review `{status, note, by, at}` to `history` and moves
        the incident forward only: `OPEN` to `ACKNOWLEDGED` to `RESOLVED`, and `OPEN`
        to `RESOLVED` is allowed. A move to the current status or backward answers
        409 `invalid_transition`. `note` is optional, at most 200 characters, and is
        shown to supervisors only. An incident is never deleted. Narrowed to the
        caller''s stores (403 `forbidden_store`).'
      operationId: reviewCaptureIncident
      x-mosaiq-roles:
      - COMMERCIAL_SUPERVISOR
      - ADMIN
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/IncidentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaptureIncidentReviewRequest'
            examples:
              resolve:
                externalValue: ./examples/capture-incident-review.request.json
              acknowledge:
                externalValue: ./examples/capture-incident-acknowledge.request.json
          application/xml:
            schema:
              $ref: '#/components/schemas/CaptureIncidentReviewRequest'
            examples:
              resolve:
                externalValue: ./examples/capture-incident-review.request.xml
              acknowledge:
                externalValue: ./examples/capture-incident-acknowledge.request.xml
      responses:
        '201':
          description: The incident with the review appended.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureIncident'
              examples:
                resolved:
                  externalValue: ./examples/capture-incident-resolved.json
                acknowledged:
                  externalValue: ./examples/capture-incident-acknowledged.json
            application/xml:
              schema:
                $ref: '#/components/schemas/CaptureIncident'
              examples:
                resolved:
                  externalValue: ./examples/capture-incident-resolved.xml
                acknowledged:
                  externalValue: ./examples/capture-incident-acknowledged.xml
        '400':
          $ref: '#/components/responses/MalformedBody'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/IncidentForbidden'
        '404':
          $ref: '#/components/responses/IncidentNotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '409':
          $ref: '#/components/responses/IncidentReviewConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/InvalidBody'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/OperationUnavailable'
  /v1/capture-incident-summaries:
    get:
      tags:
      - Capture incidents
      summary: Summarize capture incidents
      description: Counts incidents grouped by `store`, `day`, `source_type` or
        `refused_code`. `from` and `to` are UTC dates (`YYYY-MM-DD`), both inclusive,
        and a day is a UTC day of `recorded_at`. Narrowed to the caller's stores.
      operationId: getCaptureIncidentSummary
      x-mosaiq-roles:
      - COMMERCIAL_SUPERVISOR
      - ADMIN
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/SummaryFrom'
      - $ref: '#/components/parameters/SummaryTo'
      - $ref: '#/components/parameters/SummaryStoreId'
      - $ref: '#/components/parameters/IncidentGroupBy'
      responses:
        '200':
          description: The counts.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureIncidentSummary'
              examples:
                by_store:
                  externalValue: ./examples/capture-incident-summary-by-store.json
                by_day:
                  externalValue: ./examples/capture-incident-summary-by-day.json
                by_source_type:
                  externalValue: ./examples/capture-incident-summary-by-source-type.json
                by_refused_code:
                  externalValue: ./examples/capture-incident-summary-by-refused-code.json
            application/xml:
              schema:
                $ref: '#/components/schemas/CaptureIncidentSummary'
              examples:
                by_store:
                  externalValue: ./examples/capture-incident-summary-by-store.xml
                by_day:
                  externalValue: ./examples/capture-incident-summary-by-day.xml
                by_source_type:
                  externalValue: ./examples/capture-incident-summary-by-source-type.xml
                by_refused_code:
                  externalValue: ./examples/capture-incident-summary-by-refused-code.xml
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/IncidentForbidden'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '422':
          $ref: '#/components/responses/InvalidSummaryQuery'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/OperationUnavailable'
  /health/live:
    get:
      tags:
      - Meta
      summary: Check process liveness
      operationId: getLiveness
      security: []
      parameters: &id010
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '204':
          description: The process is live.
          headers: &id011
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
  /health/ready:
    get:
      tags:
      - Meta
      summary: Check schema readiness
      operationId: getReadiness
      security: []
      parameters: *id010
      responses:
        '204':
          description: The required schema is ready.
          headers: *id011
        '503':
          $ref: '#/components/responses/SchemaNotReady'
  /openapi.yaml:
    get:
      tags:
      - Meta
      summary: Get this OpenAPI document
      operationId: getOpenApi
      security: []
      parameters: *id010
      responses:
        '200':
