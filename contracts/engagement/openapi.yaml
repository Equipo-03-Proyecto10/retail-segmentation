        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/InvalidBody'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/OperationUnavailable'
  /v2/engagement-summaries:
    get:
      tags:
      - Engagement
      summary: Summarize engagement
      description: Counts events that are not voided, grouped by `store`, `day` or `type`. `from` and `to` are UTC dates (`YYYY-MM-DD`), both inclusive, and a day is a UTC day. Every event type is counted, including `STORE_VISIT`, `RECO_IMPRESSION`, `CAMPAIGN_EXPOSURE`, `CART_ADD`, `CART_REMOVE` and `NAVIGATION`; grouped by `type` each is its own key and none is folded into another or read as a sale.
      operationId: getEngagementSummaryV2
      x-mosaiq-roles:
      - ADMIN
      - ANALYST
      - STORE_MANAGER
      - MARKETING
      - INVENTORY_PLANNER
      - AUDITOR
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/SummaryFrom'
      - $ref: '#/components/parameters/SummaryTo'
      - $ref: '#/components/parameters/SummaryStoreId'
      - $ref: '#/components/parameters/GroupBy'
      responses:
        '200':
          description: The counts.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EngagementSummaryV2'
              examples:
                by_store:
                  externalValue: ./examples/v2/summary-by-store.json
                by_day:
                  externalValue: ./examples/v2/summary-by-day.json
                by_type:
                  externalValue: ./examples/v2/summary-by-type.json
            application/xml:
              schema:
                $ref: '#/components/schemas/EngagementSummaryV2'
              examples:
                by_store:
                  externalValue: ./examples/v2/summary-by-store.xml
                by_day:
                  externalValue: ./examples/v2/summary-by-day.xml
                by_type:
                  externalValue: ./examples/v2/summary-by-type.xml
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '422':
          $ref: '#/components/responses/InvalidSummaryQuery'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/OperationUnavailable'
  /schema.v2.xsd:
    get:
      tags:
      - Meta
      summary: Get the engagement v2 XML Schema
      operationId: getSchemaV2
      security: []
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: The engagement XSD, served byte for byte.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/xml:
              schema:
                type: string
        '406':
          $ref: '#/components/responses/NotAcceptable'
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      description: Caller-supplied correlation id. A missing or invalid value is
        replaced by the service, and the effective value is returned on every response.
      schema:
        type: string
        pattern: ^[0-9A-Za-z-]{1,64}$
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    EventId:
      name: event_id
      in: path
      required: true
      description: The server-assigned event id, a UUID string (ADR-0038).
      schema: &id015
        type: string
        format: uuid
    Type:
      name: type
      in: query
      required: false
      schema:
        type: string
        enum:
        - QR_SCAN
        - RECO_CLICK
    StoreId:
      name: store_id
      in: query
      required: false
      schema: &id013
        type: integer
        format: int32
    CustomerId:
      name: customer_id
      in: query
      required: false
      schema: &id014
        type: string
        format: uuid
    Voided:
      name: voided
      in: query
      required: false
      description: True lists only voided events, false only live ones.
      schema:
        type: boolean
    From:
      name: from
      in: query
      required: false
      description: Include events whose `occurred_at` is at or after this RFC 3339
        timestamp.
      schema: &id012
        type: string
        format: date-time
    To:
      name: to
      in: query
      required: false
      description: Include events whose `occurred_at` is at or before this RFC 3339
        timestamp. A `to` before `from` answers 422 `invalid_query`.
      schema: *id012
    SummaryFrom:
      name: from
      in: query
      required: false
      description: First UTC day counted (`YYYY-MM-DD`, inclusive).
      schema:
        type: string
        format: date
    SummaryTo:
      name: to
      in: query
      required: false
      description: Last UTC day counted (`YYYY-MM-DD`, inclusive). A `to` before
        `from` answers 422 `invalid_query`.
      schema:
        type: string
        format: date
    SummaryStoreId:
      name: store_id
      in: query
      required: false
      description: Count only this store's events.
      schema: *id013
    GroupBy:
      name: group_by
      in: query
      required: true
      description: How to group the counts. A missing or unknown value answers 422
        `invalid_query`.
      schema:
        type: string
        enum:
        - store
        - day
        - type
    TypeV2:
      name: type
      in: query
      required: false
      schema:
        type: string
        enum:
        - QR_SCAN
        - RECO_CLICK
        - STORE_VISIT
        - RECO_IMPRESSION
        - CAMPAIGN_EXPOSURE
        - CART_ADD
        - CART_REMOVE
        - NAVIGATION
    IncidentId:
      name: incident_id
      in: path
      required: true
      description: The server-assigned incident id, a UUID string.
      schema:
        type: string
        format: uuid
    IncidentStatus:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum:
        - OPEN
        - ACKNOWLEDGED
        - RESOLVED
    IncidentSourceType:
      name: source_type
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/IncidentSourceType'
    RecordedSince:
      name: recorded_since
      in: query
      required: false
      description: Include incidents whose server `recorded_at` is at or after this
        RFC 3339 timestamp.
      schema:
        type: string
        format: date-time
    IncidentGroupBy:
      name: group_by
      in: query
      required: true
      description: How to group the counts. A missing or unknown value answers 422
        `invalid_query`.
      schema:
        type: string
        enum:
        - store
        - day
        - source_type
        - refused_code
  headers:
    CorrelationId:
      description: The effective correlation id for this request.
      required: true
      schema:
        type: string
        pattern: ^[0-9A-Za-z-]{1,64}$
    RetryAfter:
      description: Seconds until the caller should retry.
      required: true
      schema:
        type: integer
        minimum: 1
  schemas:
    QrScanRequest:
      type: object
      additionalProperties: false
      description: A QR scan. `label_code` and `rank` are forbidden.
      required:
      - client_event_id
      - type
      - store_id
      - product_id
      - occurred_at
      properties:
        client_event_id: *id014
        type:
          type: string
          const: QR_SCAN
        store_id: *id013
        product_id: *id013
        customer_id: *id014
        occurred_at: *id012
      xml:
        name: EngagementEventRequest
        namespace: https://mosaiq.maxthecoder.online/xml/engagement/v1
    RecoClickRequest:
      type: object
      additionalProperties: false
      description: 'A tap on a recommendation: the QR scan fields plus the segment
        label and the item''s position.'
      required:
      - client_event_id
      - type
      - store_id
      - product_id
      - label_code
      - rank
      - occurred_at
      properties:
        client_event_id: *id014
        type:
          type: string
          const: RECO_CLICK
        store_id: *id013
        product_id: *id013
        customer_id: *id014
        label_code: &id016
          type: string
          pattern: ^[A-Z][A-Z0-9_]{0,39}$
        rank:
          type: integer
          minimum: 1
        occurred_at: *id012
      xml:
        name: EngagementEventRequest
        namespace: https://mosaiq.maxthecoder.online/xml/engagement/v1
    EngagementEventRequest:
      description: Two shapes, discriminated by `type`, mirroring ADR-0038's validator.
        Any other property answers 422 `invalid_body`. In XML the root is `EngagementEventRequest`
        carrying `xsi:type` `QrScanRequest` or `RecoClickRequest`.
      oneOf:
      - $ref: '#/components/schemas/QrScanRequest'
      - $ref: '#/components/schemas/RecoClickRequest'
      discriminator:
        propertyName: type
        mapping:
          QR_SCAN: '#/components/schemas/QrScanRequest'
          RECO_CLICK: '#/components/schemas/RecoClickRequest'
    VoidRequest:
      type: object
      additionalProperties: false
      required:
      - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
      xml:
        name: VoidRequest
        namespace: https://mosaiq.maxthecoder.online/xml/engagement/v1
    HistoryEntry:
      type: object
      additionalProperties: false
      required:
      - action
      - reason
      - by
      - at
      properties:
        action:
          type: string
          enum:
          - VOIDED
        reason:
          type: string
          minLength: 1
          maxLength: 500
        by: *id014
        at: *id012
    EngagementEventItem:
      type: object
      additionalProperties: false
      required: &id017
      - event_id
      - client_event_id
      - type
      - store_id
      - product_id
      - customer_id
      - label_code
      - rank
      - recorded_by
      - occurred_at
      - recorded_at
      - voided
      - history
      properties: &id018
        event_id: *id015
        client_event_id: *id014
        type:
          type: string
          enum:
          - QR_SCAN
          - RECO_CLICK
        store_id: *id013
        product_id: *id013
        customer_id:
          anyOf:
          - *id014
          - type: 'null'
        label_code:
          anyOf:
          - *id016
          - type: 'null'
          description: Null for a QR_SCAN.
        rank:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
          description: Null for a QR_SCAN.
        recorded_by:
          type: string
          format: uuid
          description: The token's `sub` when the event was recorded.
        occurred_at: *id012
        recorded_at: *id012
        voided:
          type: boolean
        history:
          type: array
          description: One `VOIDED` entry once the event is voided; empty before.
          items:
            $ref: '#/components/schemas/HistoryEntry'
    EngagementEvent:
      type: object
      additionalProperties: false
      required: *id017
      properties: *id018
      xml:
        name: EngagementEvent
        namespace: https://mosaiq.maxthecoder.online/xml/engagement/v1
    EngagementEventPage:
      type: object
      additionalProperties: false
      required:
      - engagement_events
      - page_info
      properties:
        engagement_events:
          type: array
          items:
            $ref: '#/components/schemas/EngagementEventItem'
        page_info:
          $ref: '#/components/schemas/PageInfo'
      xml:
        name: EngagementEvents
        namespace: https://mosaiq.maxthecoder.online/xml/engagement/v1
    EngagementSummary:
      type: object
      additionalProperties: false
      required:
      - from
      - to
      - group_by
      - groups
      description: Counts only events that are not voided. A day is a UTC day.
      properties:
        from:
          anyOf:
          - type: string
            format: date
          - type: 'null'
        to:
          anyOf:
          - type: string
            format: date
          - type: 'null'
        group_by:
          type: string
          enum:
          - store
          - day
          - type
        groups:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - key
            - count
            properties:
              key:
                type: string
                description: The store id, the UTC date, or the event type.
              count:
                type: integer
                minimum: 0
      xml:
        name: EngagementSummary
        namespace: https://mosaiq.maxthecoder.online/xml/engagement/v1
    PageInfo:
      type: object
      additionalProperties: false
      required:
      - page
      - size
      - total
      properties:
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
      xml:
        name: PageInfo
        namespace: https://mosaiq.maxthecoder.online/xml/common/v1
    ErrorDetail:
      type: object
      additionalProperties: false
      required:
      - field
      - code
      properties:
        field:
          type: string
        code:
