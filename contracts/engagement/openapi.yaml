  /v2/engagement-events/{event_id}/void:
    post:
      tags:
      - Engagement
      summary: Void an engagement event
      description: 'Voids the event: it is never deleted, a `VOIDED` entry is added to its `history`, and summaries stop counting it.'
      operationId: voidEngagementEventV2
      x-mosaiq-roles:
      - ADMIN
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoidRequest'
            examples:
              void:
                externalValue: ./examples/v2/void.request.json
          application/xml:
            schema:
              $ref: '#/components/schemas/VoidRequest'
            examples:
              void:
                externalValue: ./examples/v2/void.request.xml
      responses:
        '200':
          description: The voided event.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EngagementEventV2'
              examples:
                voided:
                  externalValue: ./examples/v2/voided-event.json
            application/xml:
              schema:
