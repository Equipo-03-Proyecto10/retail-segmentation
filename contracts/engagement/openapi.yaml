  /v2/engagement-events:
    post:
      tags:
      - Engagement
      summary: Record an engagement event (never a sale)
      description: 'Records the event once per `client_event_id`, attributed to the token''s `sub` (`recorded_by`). The body has eight shapes, one per `type`. The event is never a sale. Store, product and customer are checked against the published store, product and customer views: the store must exist and be active. A new event answers 201. The same `client_event_id` arriving again with the same `type`, `store_id` and `product_id` answers 200 with the original event and writes nothing; with any other type, store or product it answers 409 `client_event_conflict`. `occurred_at` more than five minutes ahead of the server answers 422 `occurred_in_future`.'
      operationId: createEngagementEventV2
      x-mosaiq-roles:
      - ADMIN
      - STORE_MANAGER
      - SALES_ASSOCIATE
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EngagementEventRequestV2'
            examples:
              qr_scan:
                externalValue: ./examples/v2/qr-scan.request.json
              reco_click:
                externalValue: ./examples/v2/reco-click.request.json
              store_visit:
                externalValue: ./examples/v2/store-visit.request.json
              reco_impression:
                externalValue: ./examples/v2/reco-impression.request.json
              campaign_exposure:
                externalValue: ./examples/v2/campaign-exposure.request.json
              cart_add:
                externalValue: ./examples/v2/cart-add.request.json
              cart_remove:
                externalValue: ./examples/v2/cart-remove.request.json
              navigation:
                externalValue: ./examples/v2/navigation.request.json
          application/xml:
            schema:
              $ref: '#/components/schemas/EngagementEventRequestV2'
            examples:
              qr_scan:
                externalValue: ./examples/v2/qr-scan.request.xml
              reco_click:
                externalValue: ./examples/v2/reco-click.request.xml
              store_visit:
                externalValue: ./examples/v2/store-visit.request.xml
              reco_impression:
                externalValue: ./examples/v2/reco-impression.request.xml
              campaign_exposure:
                externalValue: ./examples/v2/campaign-exposure.request.xml
              cart_add:
                externalValue: ./examples/v2/cart-add.request.xml
              cart_remove:
                externalValue: ./examples/v2/cart-remove.request.xml
              navigation:
                externalValue: ./examples/v2/navigation.request.xml
      responses:
        '200':
          description: 'A replay: the original event, nothing written.'
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EngagementEventV2'
              examples:
                replay:
                  externalValue: ./examples/v2/replay.json
            application/xml:
              schema:
                $ref: '#/components/schemas/EngagementEventV2'
              examples:
                replay:
                  externalValue: ./examples/v2/replay.xml
        '201':
          description: The event was recorded.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EngagementEventV2'
              examples:
                qr_scan:
                  externalValue: ./examples/v2/qr-scan.json
                reco_click:
                  externalValue: ./examples/v2/reco-click.json
                store_visit:
                  externalValue: ./examples/v2/store-visit.json
                reco_impression:
                  externalValue: ./examples/v2/reco-impression.json
                campaign_exposure:
                  externalValue: ./examples/v2/campaign-exposure.json
                cart_add:
                  externalValue: ./examples/v2/cart-add.json
                cart_remove:
                  externalValue: ./examples/v2/cart-remove.json
                navigation:
                  externalValue: ./examples/v2/navigation.json
            application/xml:
              schema:
                $ref: '#/components/schemas/EngagementEventV2'
              examples:
                qr_scan:
                  externalValue: ./examples/v2/qr-scan.xml
                reco_click:
                  externalValue: ./examples/v2/reco-click.xml
                store_visit:
                  externalValue: ./examples/v2/store-visit.xml
                reco_impression:
                  externalValue: ./examples/v2/reco-impression.xml
                campaign_exposure:
                  externalValue: ./examples/v2/campaign-exposure.xml
                cart_add:
                  externalValue: ./examples/v2/cart-add.xml
                cart_remove:
                  externalValue: ./examples/v2/cart-remove.xml
                navigation:
                  externalValue: ./examples/v2/navigation.xml
        '400':
          $ref: '#/components/responses/MalformedBody'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '409':
          $ref: '#/components/responses/CreateConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/CreateInvalid'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/OperationUnavailable'
    get:
      tags:
      - Engagement
      summary: List engagement events
      description: Returns a page ordered by `occurred_at`, newest first. `from` and `to` are RFC 3339 timestamps bounding `occurred_at`. Voided events are listed unless `voided=false`.
      operationId: listEngagementEventsV2
      x-mosaiq-roles:
