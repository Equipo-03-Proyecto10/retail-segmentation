        propertyName: type
        mapping:
          QR_SCAN: '#/components/schemas/QrScanRequestV2'
          RECO_CLICK: '#/components/schemas/RecoClickRequestV2'
          STORE_VISIT: '#/components/schemas/StoreVisitRequestV2'
          RECO_IMPRESSION: '#/components/schemas/RecoImpressionRequestV2'
          CAMPAIGN_EXPOSURE: '#/components/schemas/CampaignExposureRequestV2'
          CART_ADD: '#/components/schemas/CartAddRequestV2'
          CART_REMOVE: '#/components/schemas/CartRemoveRequestV2'
          NAVIGATION: '#/components/schemas/NavigationRequestV2'
