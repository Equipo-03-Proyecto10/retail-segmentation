openapi: 3.1.0
info:
  title: model-registry-service
  version: 1.1.0
  description: >-
    Keeps every model version immutable and says which one is published. A model version is
    immutable once published, carries its dataset, parameters, metrics and reference distribution,
    and changes state only by an explicit publication or rollback (RN-66, ADR-0064). model-registry
    serves `model-versions`, with their append-only publications and rollbacks beneath them,
    and `model-trainings`, the runs that fit and register draft versions. Exactly one version
    is published at a time, because a customer holds one current segment (RN-20). The current
    published version is published to other services as `api_models.published_version_v1`,
    not through this API (ADR-0044). It also serves `drift-reports` and `drift-alerts`, the
    other half of the rule: every report and alert is judged against the reference distribution
    of the version it names, and carries the statistic, the reference, the current window, the
    threshold and the model version (RN-66, ADR-0065). A change of version inside a window is
    never compared (ADR-0064). The drift operations are published ahead of their implementation
    (ADR-0073, F23-09) and are marked planned.
security:
- bearer: []
tags:
- name: Versions
- name: Publications
- name: Trainings
- name: Drift reports
- name: Drift alerts
- name: Meta
paths:
  /v1/model-versions:
    get:
      tags:
      - Versions
      summary: List model versions
      description: >-
        Returns a page of versions, newest first. `method` and `state` filter on the stored
        values. `state=PUBLISHED` is the version every customer is currently scored under:
        at most one row, because exactly one version is published at a time (ADR-0064). Each
        version carries its dataset, parameters, seed, metrics, owner, state and reference
        distribution.
      operationId: listModelVersions
      x-mosaiq-roles:
      - ADMIN
      - ANALYST
      - MARKETING
      - AUDITOR
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/MethodFilter'
      - $ref: '#/components/parameters/VersionStateFilter'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: A page of versions.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelVersionPage'
              examples:
                page:
                  externalValue: ./examples/model-versions-page.json
                none:
                  externalValue: ./examples/model-versions-none.json
            application/xml:
              schema:
                $ref: '#/components/schemas/ModelVersionPage'
              examples:
                page:
                  externalValue: ./examples/model-versions-page.xml
                none:
                  externalValue: ./examples/model-versions-none.xml
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '422':
          $ref: '#/components/responses/ListInvalid'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/OperationUnavailable'
    post:
      tags:
      - Versions
      summary: Register a draft version
      description: >-
        Registers an immutable DRAFT version from a definition fitted elsewhere, such as an
        RFM rule set (`method` RFM_RULES, `parameters.rule_set_id` naming the rfm-engine rule
        set). Registering publishes nothing. There is no operation to edit or delete a version,
        published or not: a change is a new version, and the absent routes answer 405 `method_not_allowed`.
        A version trained by the registry is created by `POST /v1/model-trainings`, not here.
        `parameters`, `seed` and `frozen_scoring` must belong to `method`, and boundaries
        must be monotonic, or the answer is 422 `invalid_body` with a detail code `method_mismatch`,
        `not_monotonic` or `distribution_mismatch`. A name already used is 409 `model_version_name_taken`.
      operationId: createModelVersion
      x-mosaiq-roles:
      - ADMIN
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelVersionRequest'
            examples:
              rfm_rules:
                externalValue: ./examples/model-version.request.json
              kmeans:
                externalValue: ./examples/model-version-kmeans.request.json
          application/xml:
            schema:
              $ref: '#/components/schemas/ModelVersionRequest'
            examples:
              rfm_rules:
                externalValue: ./examples/model-version.request.xml
              kmeans:
                externalValue: ./examples/model-version-kmeans.request.xml
      responses:
        '201':
          description: The draft version was registered.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelVersion'
              examples:
                rfm_rules:
                  externalValue: ./examples/model-version-created.json
            application/xml:
              schema:
                $ref: '#/components/schemas/ModelVersion'
              examples:
                rfm_rules:
                  externalValue: ./examples/model-version-created.xml
        '400':
          $ref: '#/components/responses/MalformedBody'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '409':
          $ref: '#/components/responses/VersionNameTaken'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/InvalidBody'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/OperationUnavailable'
  /v1/model-versions/{version_id}:
    get:
      tags:
      - Versions
      summary: Get one model version
      description: >-
        Returns one version with its full definition, frozen scoring, dataset, metrics and
        reference distribution, in any state.
      operationId: getModelVersion
      x-mosaiq-roles:
      - ADMIN
      - ANALYST
      - MARKETING
      - AUDITOR
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/VersionId'
      responses:
        '200':
          description: The version.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelVersion'
              examples:
                published:
                  externalValue: ./examples/model-version.json
                retired:
                  externalValue: ./examples/model-version-rfm-rules.json
                draft:
                  externalValue: ./examples/model-version-draft.json
                from_web_run:
                  externalValue: ./examples/model-version-from-web-run.json
            application/xml:
              schema:
                $ref: '#/components/schemas/ModelVersion'
              examples:
                published:
                  externalValue: ./examples/model-version.xml
                retired:
                  externalValue: ./examples/model-version-rfm-rules.xml
                draft:
                  externalValue: ./examples/model-version-draft.xml
                from_web_run:
                  externalValue: ./examples/model-version-from-web-run.xml
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/VersionNotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/OperationUnavailable'
  /v1/model-versions/{version_id}/publications:
    get:
      tags:
      - Publications
      summary: List a version's publications
      description: >-
        Returns the append-only publications and rollbacks that made this version the published
        one, newest first. Each row names the version it replaced, so the whole history can
        be followed from any version.
      operationId: listModelPublications
      x-mosaiq-roles:
      - ADMIN
      - ANALYST
      - MARKETING
      - AUDITOR
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/VersionId'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: A page of publications.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelPublicationPage'
              examples:
                page:
                  externalValue: ./examples/publications-page.json
                none:
                  externalValue: ./examples/publications-none.json
            application/xml:
              schema:
                $ref: '#/components/schemas/ModelPublicationPage'
              examples:
                page:
                  externalValue: ./examples/publications-page.xml
                none:
                  externalValue: ./examples/publications-none.xml
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/VersionNotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '422':
          $ref: '#/components/responses/InvalidPagination'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/OperationUnavailable'
    post:
      tags:
      - Publications
      summary: Publish a draft version
      description: >-
        Publishes a DRAFT version: it becomes the one published version and the previously
        published version becomes RETIRED, atomically, recording who and why. Every customer
        is then scored under the new version in a full run, recorded as a change of version
        and never as behaviour (ADR-0063, ADR-0064); the answer does not wait for that run.
        Only a DRAFT can be published: any other state is 409 `version_not_draft`. Losing
        a race for the single published slot is 409 `publication_conflict`; read the published
        version again and retry. Only an administrator publishes (RN-05).
      operationId: publishModelVersion
      x-mosaiq-roles:
      - ADMIN
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/VersionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelPublicationRequest'
            examples:
              reason:
                externalValue: ./examples/publication.request.json
          application/xml:
            schema:
              $ref: '#/components/schemas/ModelPublicationRequest'
            examples:
              reason:
                externalValue: ./examples/publication.request.xml
      responses:
        '201':
          description: The version was published.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelPublication'
              examples:
                published:
                  externalValue: ./examples/publication-published.json
            application/xml:
              schema:
                $ref: '#/components/schemas/ModelPublication'
              examples:
                published:
                  externalValue: ./examples/publication-published.xml
        '400':
          $ref: '#/components/responses/MalformedBody'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/VersionNotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '409':
          $ref: '#/components/responses/NotDraft'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/InvalidBody'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/OperationUnavailable'
  /v1/model-versions/{version_id}/rollbacks:
    post:
      tags:
      - Publications
      summary: Roll back to a retired version
      description: >-
        Publishes again a version that was published and then retired, as a new publication
        with action ROLLBACK; the currently published version becomes RETIRED. Nothing is
        rewritten: rows already scored under the replaced version stay as they were, and customers
        are scored under the restored version in a full run recorded as a change of version
        (ADR-0064). The path names the version restored. A version that is not RETIRED is
        409 `version_not_retired`, whether it is a DRAFT that was never published or the version
        already published. Losing a race is 409 `publication_conflict`. Only an administrator
        rolls back.
      operationId: rollbackToModelVersion
      x-mosaiq-roles:
      - ADMIN
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/VersionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelPublicationRequest'
            examples:
              reason:
                externalValue: ./examples/rollback.request.json
          application/xml:
            schema:
              $ref: '#/components/schemas/ModelPublicationRequest'
            examples:
              reason:
                externalValue: ./examples/rollback.request.xml
      responses:
        '201':
          description: The rollback was recorded.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelPublication'
              examples:
                rolled_back:
                  externalValue: ./examples/publication-rolled-back.json
            application/xml:
              schema:
                $ref: '#/components/schemas/ModelPublication'
              examples:
                rolled_back:
                  externalValue: ./examples/publication-rolled-back.xml
        '400':
          $ref: '#/components/responses/MalformedBody'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/VersionNotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '409':
          $ref: '#/components/responses/NotRetired'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/InvalidBody'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/OperationUnavailable'
  /v1/model-trainings:
    get:
      tags:
      - Trainings
      summary: List training runs
      description: >-
        Returns a page of training runs, newest first. `method` and `state` filter on the
        stored values.
      operationId: listModelTrainings
      x-mosaiq-roles:
      - ADMIN
      - ANALYST
      - MARKETING
      - AUDITOR
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/MethodFilter'
      - $ref: '#/components/parameters/TrainingStateFilter'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: A page of trainings.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelTrainingPage'
              examples:
                page:
                  externalValue: ./examples/trainings-page.json
            application/xml:
              schema:
                $ref: '#/components/schemas/ModelTrainingPage'
              examples:
                page:
                  externalValue: ./examples/trainings-page.xml
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '422':
          $ref: '#/components/responses/ListInvalid'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/OperationUnavailable'
    post:
      tags:
      - Trainings
      summary: Start a training run
      description: >-
        Starts a K-means training over the net purchases of the window. The answer is 201
        with the training RUNNING; poll `GET /v1/model-trainings/{training_id}`. A COMPLETED
        training registers a DRAFT version named `version_name`, carrying the dataset fingerprint
        and origin, the parameters, the seed, the metrics, the frozen centroids and the reference
        distribution, and publishes nothing. The seed is recorded even when the caller omits
        it, so the run is reproducible (RN-58). Two trainings never run at once: while one
        runs, a new request is 409 `training_in_progress`. A `version_name` already used is
        409 `model_version_name_taken`. Only RFM_RULES versions are registered through `POST
        /v1/model-versions`; `method` here is always KMEANS.
      operationId: createModelTraining
      x-mosaiq-roles:
      - ADMIN
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelTrainingRequest'
            examples:
              with_seed:
                externalValue: ./examples/training.request.json
              without_seed:
                externalValue: ./examples/training-without-seed.request.json
          application/xml:
            schema:
              $ref: '#/components/schemas/ModelTrainingRequest'
            examples:
              with_seed:
                externalValue: ./examples/training.request.xml
              without_seed:
                externalValue: ./examples/training-without-seed.request.xml
      responses:
        '201':
          description: The training was started.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelTraining'
              examples:
                running:
                  externalValue: ./examples/training-running.json
            application/xml:
              schema:
                $ref: '#/components/schemas/ModelTraining'
              examples:
                running:
                  externalValue: ./examples/training-running.xml
        '400':
          $ref: '#/components/responses/MalformedBody'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '409':
          description: '`training_in_progress` or `model_version_name_taken`.'
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                training_in_progress:
                  externalValue: ./examples/training-in-progress.json
                model_version_name_taken:
                  externalValue: ./examples/model-version-name-taken.json
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                training_in_progress:
                  externalValue: ./examples/training-in-progress.xml
                model_version_name_taken:
                  externalValue: ./examples/model-version-name-taken.xml
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/InvalidBody'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/OperationUnavailable'
  /v1/model-trainings/{training_id}:
    get:
      tags:
      - Trainings
      summary: Get one training run
      description: >-
        Returns one training with its parameters, seed, dataset, metrics and the version it
        registered.
      operationId: getModelTraining
      x-mosaiq-roles:
      - ADMIN
      - ANALYST
      - MARKETING
      - AUDITOR
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/TrainingId'
      responses:
        '200':
          description: The training.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelTraining'
              examples:
                running:
                  externalValue: ./examples/training-running.json
                completed:
                  externalValue: ./examples/training-completed.json
                failed:
                  externalValue: ./examples/training-failed.json
            application/xml:
              schema:
                $ref: '#/components/schemas/ModelTraining'
              examples:
                running:
                  externalValue: ./examples/training-running.xml
                completed:
                  externalValue: ./examples/training-completed.xml
                failed:
                  externalValue: ./examples/training-failed.xml
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TrainingNotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/OperationUnavailable'
  /v1/drift-reports:
    get:
      tags:
      - Drift reports
      summary: List drift reports
      description: >-
        Returns a page of drift reports, newest window first. A report is one comparison of one model
        version against its own reference distribution (RN-66, ADR-0065), of one of two kinds. `DATA_DRIFT`
        compares the distribution of the customers' current segments, and of R, F and M, with the
        version's reference: it reports a distribution change, with the statistics and thresholds
        and the bins that explain each variable. `OUTCOME_TEST` is the outcome test of one matured
        cohort, the only kind that can claim a change in the relation between a segment and
        repurchase. `comparison` says whether a number exists: `INSUFFICIENT_DATA` when the window
        holds fewer than 200 customers, and `NOT_COMPARED` with reason `VERSION_CHANGE` when the window
        crosses a publication or a rollback, because a change of version is never reported as behaviour
        (ADR-0064). Neither carries a statistic. A migration of one customer between segments and a
        customer's own consumption shift are not drift and are never in a report. The monitor writes
        reports on its schedule; no operation here starts a run. `kind`, `model_version_id` and
        `comparison` filter on the stored values and combine.
      operationId: listDriftReports
      x-mosaiq-status: planned
      x-mosaiq-roles:
      - ADMIN
      - ANALYST
      - MARKETING
      - AUDITOR
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/DriftKindFilter'
      - $ref: '#/components/parameters/ModelVersionIdFilter'
      - $ref: '#/components/parameters/ComparisonFilter'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: A page of drift reports.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriftReportPage'
              examples:
                page:
                  externalValue: ./examples/drift-reports-page.json
                none:
                  externalValue: ./examples/drift-reports-none.json
            application/xml:
              schema:
                $ref: '#/components/schemas/DriftReportPage'
              examples:
                page:
                  externalValue: ./examples/drift-reports-page.xml
                none:
                  externalValue: ./examples/drift-reports-none.xml
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '422':
          $ref: '#/components/responses/ListInvalid'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/OperationUnavailable'
  /v1/drift-reports/{report_id}:
    get:
      tags:
      - Drift reports
      summary: Get one drift report
      description: >-
        Returns one report with everything needed to read it without another call. For `DATA_DRIFT`, each
        compared variable carries its `state`, its statistics against their thresholds, and the reference
        and current share of every bin, so a client can chart both distributions; the window, the
        version and the reference it was judged against are named on the report. For `OUTCOME_TEST`, the
        relation, the horizon and the cohort are named, with each segment's reference and current
        repurchase rate and its test result. `previous_report_id` names the report of the same version
        and kind that precedes this one, the other window or cohort of the persistence rule, and `alert_ids`
        the alerts this report raised.
      operationId: getDriftReport
      x-mosaiq-status: planned
      x-mosaiq-roles:
      - ADMIN
      - ANALYST
      - MARKETING
      - AUDITOR
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/ReportId'
      responses:
        '200':
          description: The report.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriftReport'
              examples:
                alarm:
                  externalValue: ./examples/drift-report.json
                alarm_pending:
                  externalValue: ./examples/drift-report-alarm-pending.json
                insufficient_data:
                  externalValue: ./examples/drift-report-insufficient-data.json
                not_compared:
                  externalValue: ./examples/drift-report-not-compared.json
                outcome_test:
                  externalValue: ./examples/drift-report-outcome-test.json
                outcome_test_first_cohort:
                  externalValue: ./examples/drift-report-outcome-test-first-cohort.json
            application/xml:
              schema:
                $ref: '#/components/schemas/DriftReport'
              examples:
                alarm:
                  externalValue: ./examples/drift-report.xml
                alarm_pending:
                  externalValue: ./examples/drift-report-alarm-pending.xml
                insufficient_data:
                  externalValue: ./examples/drift-report-insufficient-data.xml
                not_compared:
                  externalValue: ./examples/drift-report-not-compared.xml
                outcome_test:
                  externalValue: ./examples/drift-report-outcome-test.xml
                outcome_test_first_cohort:
                  externalValue: ./examples/drift-report-outcome-test-first-cohort.xml
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/DriftReportNotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/OperationUnavailable'
  /v1/drift-alerts:
    get:
      tags:
      - Drift alerts
      summary: List drift alerts
      description: >-
        Returns a page of drift alerts, newest first. A report raises an alert for a variable that holds
        its alarm in two consecutive windows, or for an outcome test in which a segment passes in two
        consecutive matured cohorts; a watch level is shown in a report and is never alerted (ADR-0065).
        An alarm that continues raises a further alert in each report whose variable is still at `ALARM`.
        Alerts are append-only facts: nothing here acknowledges, edits or closes one. Each alert can be
        explained from itself: `model_version` and `variable` say what changed and under which version;
        `statistics` against their thresholds and the `bins` that moved most, or the segment's reference
        and current repurchase rate, say by how much; `suggested_review` says what to review, as a stable
        `code` and a `text`. `claim` is the only wording a client may use for the finding: `DISTRIBUTION_CHANGE`,
        or `CONCEPT_DRIFT` on an alert of an `OUTCOME_TEST` alone. `kind`, `model_version_id` and `variable`
        filter on the stored values and combine.
      operationId: listDriftAlerts
      x-mosaiq-status: planned
      x-mosaiq-roles:
      - ADMIN
      - ANALYST
      - MARKETING
      - AUDITOR
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/DriftKindFilter'
      - $ref: '#/components/parameters/ModelVersionIdFilter'
      - $ref: '#/components/parameters/VariableFilter'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: A page of drift alerts.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriftAlertPage'
              examples:
                page:
                  externalValue: ./examples/drift-alerts-page.json
                none:
                  externalValue: ./examples/drift-alerts-none.json
            application/xml:
              schema:
                $ref: '#/components/schemas/DriftAlertPage'
              examples:
                page:
                  externalValue: ./examples/drift-alerts-page.xml
                none:
                  externalValue: ./examples/drift-alerts-none.xml
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '422':
          $ref: '#/components/responses/ListInvalid'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/OperationUnavailable'
  /v1/drift-alerts/{alert_id}:
    get:
      tags:
      - Drift alerts
      summary: Get one drift alert
      description: >-
        Returns one alert, with the window and the reference it was judged against, the statistics and
        bins or the outcome test that explain it, and the review it suggests. `report_id` names the
        report that raised it and `previous_report_id` the earlier report that held the same finding,
        so the persistence rule can be read. The full evidence, every bin and every variable, is in the
        report.
      operationId: getDriftAlert
      x-mosaiq-status: planned
      x-mosaiq-roles:
      - ADMIN
      - ANALYST
      - MARKETING
      - AUDITOR
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/AlertId'
      responses:
        '200':
          description: The alert.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriftAlert'
              examples:
                segment_shares:
                  externalValue: ./examples/drift-alert.json
                feature:
                  externalValue: ./examples/drift-alert-feature.json
                outcome_test:
                  externalValue: ./examples/drift-alert-outcome-test.json
            application/xml:
              schema:
                $ref: '#/components/schemas/DriftAlert'
              examples:
                segment_shares:
                  externalValue: ./examples/drift-alert.xml
                feature:
                  externalValue: ./examples/drift-alert-feature.xml
                outcome_test:
                  externalValue: ./examples/drift-alert-outcome-test.xml
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/DriftAlertNotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/OperationUnavailable'
  /health/live:
    get:
      tags:
      - Meta
      summary: Check process liveness
      operationId: getLiveness
      security: []
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '204':
          description: The process is live.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
  /health/ready:
    get:
      tags:
      - Meta
      summary: Check schema readiness
      operationId: getReadiness
      security: []
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '204':
          description: The required schema is ready.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
        '503':
          $ref: '#/components/responses/SchemaNotReady'
  /openapi.yaml:
    get:
      tags:
      - Meta
      summary: Get this OpenAPI document
      operationId: getOpenApi
      security: []
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: The OpenAPI document, served byte for byte.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/yaml:
              schema:
                type: string
        '406':
          $ref: '#/components/responses/NotAcceptable'
  /schema.xsd:
    get:
      tags:
      - Meta
      summary: Get the model-registry XML Schema
      operationId: getSchema
      security: []
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: The model-registry XSD, served byte for byte.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/xml:
              schema:
                type: string
        '406':
          $ref: '#/components/responses/NotAcceptable'
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      description: >-
        Caller-supplied correlation id. A missing or invalid value is replaced by the service,
        and the effective value is returned on every response.
      schema:
        type: string
        pattern: ^[0-9A-Za-z-]{1,64}$
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    VersionId:
      name: version_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    TrainingId:
      name: training_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    MethodFilter:
      name: method
      in: query
      required: false
      description: Keep only versions or trainings of this method.
      schema:
        $ref: '#/components/schemas/Method'
    VersionStateFilter:
      name: state
      in: query
      required: false
      description: >-
        Keep only versions in this state. `state=PUBLISHED` returns the current published
        version.
      schema:
        $ref: '#/components/schemas/VersionState'
    TrainingStateFilter:
      name: state
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/TrainingState'
    ReportId:
      name: report_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    AlertId:
      name: alert_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    DriftKindFilter:
      name: kind
      in: query
      required: false
      description: Keep only reports or alerts of this kind.
      schema:
        $ref: '#/components/schemas/DriftKind'
    ModelVersionIdFilter:
      name: model_version_id
      in: query
      required: false
      description: >-
        Keep only what concerns this model version. The version is a resource of this service, so its
        id is a query field and never a path.
      schema:
        type: integer
        format: int64
        minimum: 1
    ComparisonFilter:
      name: comparison
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/DriftComparison'
    VariableFilter:
      name: variable
      in: query
      required: false
      description: Keep only alerts about this variable.
      schema:
        $ref: '#/components/schemas/DriftVariable'
  headers:
    CorrelationId:
      description: The effective correlation id for this request.
      required: true
      schema:
        type: string
        pattern: ^[0-9A-Za-z-]{1,64}$
    RetryAfter:
      description: Seconds until the caller should retry.
      required: true
      schema:
        type: integer
        minimum: 1
  schemas:
    Method:
      type: string
      enum:
      - RFM_RULES
      - KMEANS
    TrainingMethod:
      type: string
      enum:
      - KMEANS
    VersionState:
      type: string
      enum:
      - DRAFT
      - PUBLISHED
      - RETIRED
    VersionSource:
      type: string
      enum:
      - REGISTERED
      - TRAINING
      - WEB_RUN
    DataOrigin:
      type: string
      enum:
      - OBSERVED
      - SEEDED
    TrainingState:
      type: string
      enum:
      - RUNNING
      - COMPLETED
      - FAILED
    PublicationAction:
      type: string
      enum:
      - PUBLISH
      - ROLLBACK
    Feature:
      type: string
      enum:
      - R
      - F
      - M
    Normalization:
      type: string
      enum:
      - NONE
      - MIN_MAX
    Money:
      type: string
      pattern: ^[0-9]+\.[0-9]{2}$
    Name:
      type: string
      minLength: 1
      maxLength: 80
    WindowDays:
      type: integer
      minimum: 1
      maximum: 3650
    Dataset:
      type: object
      additionalProperties: false
      description: What a version was fitted on.
      required:
      - fingerprint
      - origin
      - row_count
      properties:
        fingerprint:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: Lowercase SHA-256 of the canonical net-purchase data the version was
            fitted on.
        origin:
          $ref: '#/components/schemas/DataOrigin'
          description: '`SEEDED` if any sale the fit read is seeded, else `OBSERVED` (ADR-0052).'
        row_count:
          type: integer
          minimum: 0
          description: Net purchases read.
    ModelParameters:
      type: object
      additionalProperties: false
      description: >-
        The definition. RFM_RULES sets `rule_set_id` and leaves `k`, `max_iterations` and
        `tolerance` null, with `normalization` NONE. KMEANS sets those three, leaves `rule_set_id`
        null and uses MIN_MAX (ADR-0018). Absent values are null in JSON and omitted in XML.
      required:
      - rule_set_id
      - k
      - max_iterations
      - tolerance
      - features
      - normalization
      properties:
        rule_set_id:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 1
          description: >-
            RFM_RULES only: the rfm-engine rule set whose boundaries the version froze. A
            body field, never a path.
        k:
          type:
          - integer
          - 'null'
          minimum: 2
          maximum: 20
          description: 'KMEANS only: the number of clusters.'
        max_iterations:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 1000
          description: KMEANS only.
        tolerance:
          type:
          - number
          - 'null'
          exclusiveMinimum: 0
          description: 'KMEANS only: the centroid-shift threshold that ends the fit.'
        features:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Feature'
        normalization:
          $ref: '#/components/schemas/Normalization'
    QuintileBoundaries:
      type: object
      additionalProperties: false
      required:
      - recency_boundaries
      - frequency_boundaries
      - monetary_boundaries
      properties:
        recency_boundaries:
          type: array
          minItems: 4
          maxItems: 4
          items:
            type: integer
            minimum: 0
          description: Largest recency in days that still scores 5, 4, 3 and 2; non-decreasing.
        frequency_boundaries:
          type: array
          minItems: 4
          maxItems: 4
          items:
            type: integer
            minimum: 1
          description: Smallest net purchase count that scores 5, 4, 3 and 2; non-increasing.
        monetary_boundaries:
          type: array
          minItems: 4
          maxItems: 4
          items:
            $ref: '#/components/schemas/Money'
          description: Smallest net total that scores 5, 4, 3 and 2; non-increasing.
    Centroid:
      type: object
      additionalProperties: false
      required:
      - cluster_index
      - label_code
      - r
      - f
      - m
      properties:
        cluster_index:
          type: integer
          minimum: 0
        label_code:
          type: string
          description: The label paired with the cluster at fit time (ADR-0030).
        r:
          type: number
          description: Normalized recency of the centroid.
        f:
          type: number
          description: Normalized frequency of the centroid.
        m:
          type: number
          description: Normalized monetary value of the centroid. A coordinate, not money.
    NormalizationBounds:
      type: object
      additionalProperties: false
      description: The raw minimum and maximum used for min-max scaling.
      required:
      - r_min
      - r_max
      - f_min
      - f_max
      - m_min
      - m_max
      properties:
        r_min:
          type: number
        r_max:
          type: number
        f_min:
          type: number
        f_max:
          type: number
        m_min:
          type: number
        m_max:
          type: number
    FrozenScoring:
      type: object
      additionalProperties: false
      description: >-
        What a customer is scored against, so a score never depends on the population (ADR-0063).
        RFM_RULES sets `quintile_boundaries`, with no centroids and null bounds. KMEANS sets
        `centroids` (one per `k`) and `normalization_bounds`, with null boundaries. A mismatch
        with `method` is 422 `invalid_body`, detail `method_mismatch`.
      required:
      - quintile_boundaries
      - centroids
      - normalization_bounds
      properties:
        quintile_boundaries:
          oneOf:
          - $ref: '#/components/schemas/QuintileBoundaries'
          - type: 'null'
        centroids:
          type: array
          items:
            $ref: '#/components/schemas/Centroid'
        normalization_bounds:
          oneOf:
          - $ref: '#/components/schemas/NormalizationBounds'
          - type: 'null'
    FeatureDistribution:
      type: object
      additionalProperties: false
      required:
      - feature
      - bin_edges
      - proportions
      properties:
        feature:
          $ref: '#/components/schemas/Feature'
        bin_edges:
          type: array
          minItems: 2
          items:
            type: number
          description: Strictly increasing edges.
        proportions:
          type: array
          minItems: 1
          items:
            type: number
            minimum: 0
            maximum: 1
          description: One share per bin, so one fewer than the edges; they sum to 1.
    LabelShare:
      type: object
      additionalProperties: false
      required:
      - label_code
      - share
      properties:
        label_code:
          type: string
        share:
          type: number
          minimum: 0
          maximum: 1
    ReferenceDistribution:
      type: object
      additionalProperties: false
      description: >-
        The distribution of the fitted data, which drift is judged against. A malformed histogram
        (edges not increasing, a count that is not one fewer than the edges, shares that do
        not sum to 1) is 422 `invalid_body`, detail `distribution_mismatch`.
      required:
      - sample_size
      - captured_at
      - features
      - labels
      properties:
        sample_size:
          type: integer
          minimum: 1
        captured_at:
          type: string
          format: date-time
        features:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: '#/components/schemas/FeatureDistribution'
        labels:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/LabelShare'
    Metrics:
      type: object
      additionalProperties: false
      description: 'As they apply: null for a measure the method does not have.'
      required:
      - inertia
      - silhouette
      - stability
      properties:
        inertia:
          type:
          - number
          - 'null'
          minimum: 0
        silhouette:
          type:
          - number
          - 'null'
          minimum: -1
          maximum: 1
        stability:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 1
    ModelVersionRequest:
      type: object
      additionalProperties: false
      required:
      - name
      - method
      - window_days
      - parameters
      - frozen_scoring
      - reference_distribution
      - dataset
      - metrics
      properties:
        name:
          $ref: '#/components/schemas/Name'
        method:
          $ref: '#/components/schemas/Method'
        window_days:
          $ref: '#/components/schemas/WindowDays'
        seed:
          type:
          - integer
          - 'null'
          format: int64
          description: 'KMEANS: the seed the fit used. RFM_RULES: null.'
        parameters:
          $ref: '#/components/schemas/ModelParameters'
        frozen_scoring:
          $ref: '#/components/schemas/FrozenScoring'
        reference_distribution:
          $ref: '#/components/schemas/ReferenceDistribution'
        dataset:
          $ref: '#/components/schemas/Dataset'
        metrics:
          $ref: '#/components/schemas/Metrics'
      xml:
        name: ModelVersionRequest
        namespace: https://mosaiq.maxthecoder.online/xml/model-registry/v1
    ModelVersion:
      type: object
      additionalProperties: false
      description: >-
        An immutable record. Its definition, scoring, dataset, metrics and reference distribution
        never change after creation; only `state`, `published_at` and `retired_at` follow
        the append-only publications (ADR-0064).
      required:
      - version_id
      - name
      - method
      - state
      - source
      - window_days
      - seed
      - parameters
      - frozen_scoring
      - reference_distribution
      - dataset
      - metrics
      - owner_id
      - source_run_id
      - training_id
      - created_at
      - published_at
      - retired_at
      properties:
        version_id:
          type: integer
          format: int64
        name:
          $ref: '#/components/schemas/Name'
        method:
          $ref: '#/components/schemas/Method'
        state:
          $ref: '#/components/schemas/VersionState'
          description: Changes only through a publication or a rollback.
        source:
          $ref: '#/components/schemas/VersionSource'
          description: >-
            `REGISTERED` by `POST /v1/model-versions`, `TRAINING` by a training, `WEB_RUN`
            by the registry for a segmentation run the web started (ADR-0064).
        window_days:
          $ref: '#/components/schemas/WindowDays'
        seed:
          type:
          - integer
          - 'null'
          format: int64
        parameters:
          $ref: '#/components/schemas/ModelParameters'
        frozen_scoring:
          $ref: '#/components/schemas/FrozenScoring'
        reference_distribution:
          $ref: '#/components/schemas/ReferenceDistribution'
        dataset:
          $ref: '#/components/schemas/Dataset'
        metrics:
          $ref: '#/components/schemas/Metrics'
        owner_id:
          type:
          - string
          - 'null'
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          description: >-
            The user who registered it; null for a version the registry created from a web
            run.
        source_run_id:
          type:
          - integer
          - 'null'
          format: int64
          description: The segmentation run a `WEB_RUN` version came from; otherwise null.
        training_id:
          type:
          - integer
          - 'null'
          format: int64
          description: The training that produced a `TRAINING` version; otherwise null.
        created_at:
          type: string
          format: date-time
        published_at:
          type:
          - string
          - 'null'
          format: date-time
          description: The instant of the version's latest publication or rollback.
        retired_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When a later publication replaced it; null unless `state` is RETIRED.
      xml:
        name: ModelVersion
        namespace: https://mosaiq.maxthecoder.online/xml/model-registry/v1
    ModelVersionPage:
      type: object
      additionalProperties: false
      required:
      - versions
      - page_info
      properties:
        versions:
          type: array
          items:
            $ref: '#/components/schemas/ModelVersion'
        page_info:
          $ref: '#/components/schemas/PageInfo'
      xml:
        name: ModelVersions
        namespace: https://mosaiq.maxthecoder.online/xml/model-registry/v1
    ModelPublicationRequest:
      type: object
      additionalProperties: false
      required:
      - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
      xml:
        name: ModelPublicationRequest
        namespace: https://mosaiq.maxthecoder.online/xml/model-registry/v1
    ModelPublication:
      type: object
      additionalProperties: false
      description: >-
        One append-only fact. A rollback is a new row naming the restored version, never an
        edit.
      required:
      - publication_id
      - version_id
      - action
      - previous_version_id
      - reason
      - published_by
      - published_at
      properties:
        publication_id:
          type: integer
          format: int64
        version_id:
          type: integer
          format: int64
          description: The version that became published.
        action:
          $ref: '#/components/schemas/PublicationAction'
        previous_version_id:
          type:
          - integer
          - 'null'
          format: int64
          description: The version it replaced; null for the first publication.
        reason:
          type: string
        published_by:
          type:
          - string
          - 'null'
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          description: The administrator; null when the registry published a web run's version.
        published_at:
          type: string
          format: date-time
      xml:
        name: ModelPublication
        namespace: https://mosaiq.maxthecoder.online/xml/model-registry/v1
    ModelPublicationPage:
      type: object
      additionalProperties: false
      required:
      - publications
      - page_info
      properties:
        publications:
          type: array
          items:
            $ref: '#/components/schemas/ModelPublication'
        page_info:
          $ref: '#/components/schemas/PageInfo'
      xml:
        name: ModelPublications
        namespace: https://mosaiq.maxthecoder.online/xml/model-registry/v1
    ModelTrainingRequest:
      type: object
      additionalProperties: false
      required:
      - version_name
      - method
      - window_days
      - parameters
      properties:
        version_name:
          $ref: '#/components/schemas/Name'
          description: The name of the DRAFT version a completed training registers.
        method:
          $ref: '#/components/schemas/TrainingMethod'
        window_days:
          $ref: '#/components/schemas/WindowDays'
        seed:
          type:
          - integer
          - 'null'
          format: int64
          description: Optional; when absent the service chooses one and records it.
        parameters:
          $ref: '#/components/schemas/ModelParameters'
      xml:
        name: ModelTrainingRequest
        namespace: https://mosaiq.maxthecoder.online/xml/model-registry/v1
    ModelTraining:
      type: object
      additionalProperties: false
      description: >-
        `dataset`, `metrics`, `iterations`, `converged` and `version_id` are null until COMPLETED.
      required:
      - training_id
      - method
      - state
      - version_name
      - window_days
      - seed
      - parameters
      - dataset
      - metrics
      - iterations
      - converged
      - version_id
      - started_at
      - finished_at
      - started_by
      - failure_code
      properties:
        training_id:
          type: integer
          format: int64
        method:
          $ref: '#/components/schemas/TrainingMethod'
        state:
          $ref: '#/components/schemas/TrainingState'
        version_name:
          $ref: '#/components/schemas/Name'
        window_days:
          $ref: '#/components/schemas/WindowDays'
        seed:
          type: integer
          format: int64
          description: 'Always set: the requested seed or the one the service chose (RN-58).'
        parameters:
          $ref: '#/components/schemas/ModelParameters'
        dataset:
          oneOf:
          - $ref: '#/components/schemas/Dataset'
          - type: 'null'
        metrics:
          oneOf:
          - $ref: '#/components/schemas/Metrics'
          - type: 'null'
        iterations:
          type:
          - integer
          - 'null'
          minimum: 0
        converged:
          type:
          - boolean
          - 'null'
        version_id:
          type:
          - integer
          - 'null'
          format: int64
          description: The DRAFT version a COMPLETED training registered.
        started_at:
          type: string
          format: date-time
        finished_at:
          type:
          - string
          - 'null'
          format: date-time
        started_by:
          type: string
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        failure_code:
          type:
          - string
          - 'null'
          description: Set only when `state` is FAILED, such as `source_unavailable`.
      xml:
        name: ModelTraining
        namespace: https://mosaiq.maxthecoder.online/xml/model-registry/v1
    ModelTrainingPage:
      type: object
      additionalProperties: false
      required:
      - trainings
      - page_info
      properties:
        trainings:
          type: array
          items:
            $ref: '#/components/schemas/ModelTraining'
        page_info:
          $ref: '#/components/schemas/PageInfo'
      xml:
        name: ModelTrainings
        namespace: https://mosaiq.maxthecoder.online/xml/model-registry/v1
    DriftKind:
      type: string
      description: >-
        `DATA_DRIFT` is a distribution change: the segments or the R, F and M of the customers differ from
        the version's reference distribution (ADR-0065). `OUTCOME_TEST` is the test of the relation
        between a segment and repurchase within the horizon, on a matured cohort.
      enum:
      - DATA_DRIFT
      - OUTCOME_TEST
    DistributionVariable:
      type: string
      description: >-
        What a distribution change is measured on: the share of customers in each segment, or the R, F
        or M of the customers. Categories and channels are not variables of this contract; ADR-0065 does
        not name them.
      enum:
      - SEGMENT_SHARES
      - R
      - F
      - M
    DriftVariable:
      type: string
      description: >-
        What an alert is about: a `DistributionVariable`, or `REPURCHASE_RATE` for the outcome test.
      enum:
      - SEGMENT_SHARES
      - R
      - F
      - M
      - REPURCHASE_RATE
    DriftComparison:
      type: string
      description: >-
        `COMPARED`: the statistics exist. `INSUFFICIENT_DATA`: the window holds fewer than 200 customers
        (a `DATA_DRIFT` report) or no segment has 100 customers on both sides (an `OUTCOME_TEST` report),
        so there is no number. `NOT_COMPARED`: the window crosses a change of version, so nothing is
        compared (ADR-0064, ADR-0065).
      enum:
      - COMPARED
      - INSUFFICIENT_DATA
      - NOT_COMPARED
    NotComparedReason:
      type: string
      description: >-
        `VERSION_CHANGE`: a publication or a rollback falls inside the window. A methodological
        difference is never drift.
      enum:
      - VERSION_CHANGE
    DriftStatisticName:
      type: string
      description: >-
        `PSI` is the population stability index over the bins, an empty bin floored at 0.0005 of its side
        before the logarithm. `CHI_SQUARE` is the chi-square goodness of fit of the segment shares
        against the reference shares (ADR-0065).
      enum:
      - PSI
      - CHI_SQUARE
    ThresholdBasis:
      type: string
      description: >-
        What the thresholds are compared with: `VALUE` (the statistic's `value`, reached at or above the
        threshold, for PSI) or `P_VALUE` (the `p_value`, below the threshold, for CHI_SQUARE).
      enum:
      - VALUE
      - P_VALUE
    StatisticLevel:
      type: string
      description: >-
        `ALARM` when the alarm threshold is passed, else `WATCH` when the watch threshold is passed, else
        `NORMAL`. The level of one statistic in one window; persistence is in `VariableState`.
      enum:
      - NORMAL
      - WATCH
      - ALARM
    VariableState:
      type: string
      description: >-
        The state of a variable in a window. `ALARM_PENDING`: the alarm condition holds in this window
        and did not in the previous one. `ALARM`: it holds in this window and in the previous one, which
        is the only state that raises an alert. `WATCH`: a statistic passed its watch threshold and the
        alarm condition does not hold. The alarm condition of SEGMENT_SHARES is the PSI alarm threshold
        and the chi-square alarm together; of R, F and M, the PSI alarm threshold.
      enum:
      - NORMAL
      - WATCH
      - ALARM_PENDING
      - ALARM
    OutcomeResult:
      type: string
      description: >-
        `PASSED`: the segment's repurchase rate differs from the reference significantly after the Holm
        correction and by at least the minimum difference. `NOT_PASSED`: it was tested and did not pass.
        `NOT_TESTED`: either side has fewer customers than the minimum, so no statistic exists.
      enum:
      - PASSED
      - NOT_PASSED
      - NOT_TESTED
    DriftClaim:
      type: string
      description: >-
        The wording a client may use for what an alert found. `DISTRIBUTION_CHANGE` for every alert of
        a `DATA_DRIFT` report. `CONCEPT_DRIFT` only for an alert of an `OUTCOME_TEST` report, whose
        `outcome_test` names the relation, the horizon and the cohort (ADR-0065).
      enum:
      - DISTRIBUTION_CHANGE
      - CONCEPT_DRIFT
    OutcomeClaim:
      type: string
      description: >-
        Present on an outcome test only when a segment passed in two consecutive matured cohorts, and
        null otherwise, so no other result carries the phrase.
      enum:
      - CONCEPT_DRIFT
    OutcomeRelation:
      type: string
      description: >-
        The monitored relation: the probability that a customer repurchases within the horizon, given
        the customer's segment (ADR-0065).
      enum:
      - REPURCHASE_GIVEN_SEGMENT
    ReviewCode:
      type: string
      description: >-
        What to review, stable for a client to branch on. `REVIEW_SEGMENT_MIX`: whether the frozen scoring
        still fits the customers. `REVIEW_FEATURE_DISTRIBUTION`: whether a variable changed for a reason
        other than behaviour, such as the season or the data. `REVIEW_PREDICTIVE_RELATION`: what the
        segments predict.
      enum:
      - REVIEW_SEGMENT_MIX
      - REVIEW_FEATURE_DISTRIBUTION
      - REVIEW_PREDICTIVE_RELATION
    PValue:
      type: number
      minimum: 0
      maximum: 1
    ModelVersionRef:
      type: object
      additionalProperties: false
      description: The model version a report or alert concerns, a resource of this service.
      required:
      - version_id
      - name
      - method
      properties:
        version_id:
          type: integer
          format: int64
          minimum: 1
        name:
          $ref: '#/components/schemas/Name'
        method:
          $ref: '#/components/schemas/Method'
    DriftWindow:
      type: object
      additionalProperties: false
      description: >-
        What was compared with the reference. For `DATA_DRIFT`, the trailing `days` days ending at `end`,
        with the customers' current assignments read as one snapshot at `end`. For `OUTCOME_TEST`, the
        outcome window `(start, end]` of one cohort, where `start` is the cohort's as-of date and `end`
        is `start` plus the horizon, already in the past.
      required:
      - start
      - end
      - days
      - customer_count
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        days:
          $ref: '#/components/schemas/WindowDays'
        customer_count:
          type: integer
          minimum: 0
          description: Customers in the window. Fewer than 200 is `INSUFFICIENT_DATA` for `DATA_DRIFT`.
    DriftReference:
      type: object
      additionalProperties: false
      description: >-
        The reference the version was judged against: its own `reference_distribution` (ADR-0064), whose
        `sample_size` and `captured_at` are repeated here. The reference shares of each bin are in
        `bins`, so a client never has to read the version to explain a report.
      required:
      - sample_size
      - captured_at
      properties:
        sample_size:
          type: integer
          minimum: 1
        captured_at:
          type: string
          format: date-time
    DriftBin:
      type: object
      additionalProperties: false
      description: >-
        One bin of a variable, with the share of customers in it in the reference and in the window.
        For SEGMENT_SHARES, a bin is a segment and `label` is its label code. For R, F and M, the bins
        are those of the version's reference, labelled `B1` upward in order, with `lower` and `upper`
        as the version's `bin_edges` give them, plus `NO_VALUE` for customers with no value (no edges).
        The shares of one variable sum to 1 on each side.
      required:
      - label
      - lower
      - upper
      - reference_share
      - current_share
      - contribution
      properties:
        label:
          type: string
          minLength: 1
        lower:
          type:
          - number
          - 'null'
        upper:
          type:
          - number
          - 'null'
        reference_share:
          type: number
          minimum: 0
          maximum: 1
        current_share:
          type: number
          minimum: 0
          maximum: 1
        contribution:
          type: number
          minimum: 0
          description: >-
            This bin's term of the PSI, `(current - reference) * ln(current / reference)`, so the bins
            that moved most are the ones with the largest contribution.
    DriftStatistic:
      type: object
      additionalProperties: false
      description: One statistic of one variable in one window, with the thresholds it is judged by.
      required:
      - statistic
      - value
      - p_value
      - degrees_of_freedom
      - threshold_basis
      - watch_threshold
      - alarm_threshold
      - level
      properties:
        statistic:
          $ref: '#/components/schemas/DriftStatisticName'
        value:
          type: number
          minimum: 0
          description: The PSI, or the chi-square statistic.
        p_value:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 1
          description: CHI_SQUARE only; null for PSI.
        degrees_of_freedom:
          type:
          - integer
          - 'null'
          minimum: 1
          description: CHI_SQUARE only, the number of segments less one; null for PSI.
        threshold_basis:
          $ref: '#/components/schemas/ThresholdBasis'
        watch_threshold:
          type: number
          description: 0.10 for PSI, 0.05 for the chi-square p-value (ADR-0065). Conventional, not derived.
        alarm_threshold:
          type: number
          description: 0.25 for PSI, 0.01 for the chi-square p-value (ADR-0065). Conventional, not derived.
        level:
          $ref: '#/components/schemas/StatisticLevel'
    VariableDrift:
      type: object
      additionalProperties: false
      description: >-
        One variable of a compared `DATA_DRIFT` report: its state, its statistics against their thresholds
        (SEGMENT_SHARES has the PSI and the chi-square, R, F and M the PSI) and the reference and current
        share of every bin.
      required:
      - variable
      - state
      - statistics
      - bins
      properties:
        variable:
          $ref: '#/components/schemas/DistributionVariable'
        state:
          $ref: '#/components/schemas/VariableState'
        statistics:
          type: array
          minItems: 1
          maxItems: 2
          items:
            $ref: '#/components/schemas/DriftStatistic'
        bins:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/DriftBin'
    OutcomeRates:
      type: object
      additionalProperties: false
      description: Customers of a segment on one side of the test, and how many repurchased within the horizon.
      required:
      - customers
      - repurchasers
      - rate
      properties:
        customers:
          type: integer
          minimum: 0
        repurchasers:
          type: integer
          minimum: 0
        rate:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 1
          description: '`repurchasers` over `customers`; null when there are no customers.'
    OutcomeThresholds:
      type: object
      additionalProperties: false
      description: The thresholds ADR-0065 sets for the outcome test.
      required:
      - alpha
      - min_difference_points
      - min_customers_per_side
      properties:
        alpha:
          type: number
          minimum: 0
          maximum: 1
          description: The family-wise level of the Holm correction across segments, 0.05.
        min_difference_points:
          type: number
          description: The smallest difference in percentage points that counts, 5.
        min_customers_per_side:
          type: integer
          minimum: 1
          description: A segment is tested only when both sides have this many customers, 100.
    OutcomeSegment:
      type: object
      additionalProperties: false
      description: >-
        One segment's repurchase rate in the reference cohort and in the current matured cohort, and the
        two-proportion z-test between them.
      required:
      - label_code
      - reference
      - current
      - difference_points
      - z
      - p_value
      - adjusted_p_value
      - result
      - persisted
      properties:
        label_code:
          type: string
        reference:
          $ref: '#/components/schemas/OutcomeRates'
        current:
          $ref: '#/components/schemas/OutcomeRates'
        difference_points:
          type:
          - number
          - 'null'
          description: >-
            The current rate less the reference rate, in percentage points; null when a side has no
            customers.
        z:
          type:
          - number
          - 'null'
          description: Null when `result` is NOT_TESTED.
        p_value:
          oneOf:
          - $ref: '#/components/schemas/PValue'
          - type: 'null'
          description: Two-sided, null when `result` is NOT_TESTED.
        adjusted_p_value:
          oneOf:
          - $ref: '#/components/schemas/PValue'
          - type: 'null'
          description: After the Holm correction across the tested segments, null when `result` is NOT_TESTED.
        result:
          $ref: '#/components/schemas/OutcomeResult'
        persisted:
          type: boolean
          description: >-
            True when `result` is PASSED here and the same segment was PASSED in the report named by
            `previous_report_id`: two consecutive matured cohorts.
    OutcomeTest:
      type: object
      additionalProperties: false
      description: >-
        The outcome test of one matured cohort (ADR-0065). The relation, the horizon and the cohort are
        named here, beside any claim. A customer repurchases if at least one accepted sale of theirs,
        net of reversals, falls in `(cohort_as_of, cohort_as_of + horizon_days]`. Only cohorts whose
        horizon is already in the past are tested, and two consecutive cohorts have as-of dates exactly
        one horizon apart.
      required:
      - relation
      - horizon_days
      - cohort_as_of
      - thresholds
      - segments
      - claim
      properties:
        relation:
          $ref: '#/components/schemas/OutcomeRelation'
        horizon_days:
          type: integer
          minimum: 1
          description: The horizon `H`, 30 days.
        cohort_as_of:
          type: string
          format: date-time
          description: The as-of date `t` of the cohort, whose customers are grouped by their segment at `t`.
        thresholds:
          $ref: '#/components/schemas/OutcomeThresholds'
        segments:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OutcomeSegment'
          description: >-
            Every segment of the version for a report; only the segments that persisted for an alert.
        claim:
          oneOf:
          - $ref: '#/components/schemas/OutcomeClaim'
          - type: 'null'
          description: >-
            `CONCEPT_DRIFT` when at least one segment persisted, and null otherwise. A cohort in which a
            segment passed for the first time claims nothing yet.
    SuggestedReview:
      type: object
      additionalProperties: false
      description: >-
        The review an alert suggests. It is a suggestion, never a verdict: a change in distribution is
        not shown to mean that the segments stopped predicting anything.
      required:
      - code
      - text
      properties:
        code:
          $ref: '#/components/schemas/ReviewCode'
        text:
          type: string
          minLength: 1
          maxLength: 500
          description: >-
            English text naming the variable and the change, for a client to show as it is. Its wording
            follows `claim`.
    DriftReport:
      type: object
      additionalProperties: false
      description: >-
        One comparison of one model version with its reference, immutable once written. `variables` is
        empty unless the report is a `COMPARED` `DATA_DRIFT`; `outcome_test` is null unless it is a
        `COMPARED` `OUTCOME_TEST`. For an `INSUFFICIENT_DATA` or `NOT_COMPARED` report neither is present:
        there is no number, and nothing is guessed. Repeating the monitor on the same data gives the same
        report.
      required:
      - report_id
      - kind
      - model_version
      - comparison
      - not_compared_reason
      - window
      - reference
      - previous_report_id
      - variables
      - outcome_test
      - alert_ids
      - computed_at
      properties:
        report_id:
          type: integer
          format: int64
        kind:
          $ref: '#/components/schemas/DriftKind'
        model_version:
          $ref: '#/components/schemas/ModelVersionRef'
        comparison:
          $ref: '#/components/schemas/DriftComparison'
        not_compared_reason:
          oneOf:
          - $ref: '#/components/schemas/NotComparedReason'
          - type: 'null'
          description: Set only when `comparison` is NOT_COMPARED.
        window:
          $ref: '#/components/schemas/DriftWindow'
        reference:
          $ref: '#/components/schemas/DriftReference'
        previous_report_id:
          type:
          - integer
          - 'null'
          format: int64
          description: >-
            The report of the same version and kind whose window precedes this one, the other window of
            the persistence rule; null for the first.
        variables:
          type: array
          items:
            $ref: '#/components/schemas/VariableDrift'
        outcome_test:
          oneOf:
          - $ref: '#/components/schemas/OutcomeTest'
          - type: 'null'
        alert_ids:
          type: array
          items:
            type: integer
            format: int64
          description: The alerts this report raised, empty when it raised none.
        computed_at:
          type: string
          format: date-time
      xml:
        name: DriftReport
        namespace: https://mosaiq.maxthecoder.online/xml/model-registry/v1
    DriftReportPage:
      type: object
      additionalProperties: false
      required:
      - reports
      - page_info
      properties:
        reports:
          type: array
          items:
            $ref: '#/components/schemas/DriftReport'
        page_info:
          $ref: '#/components/schemas/PageInfo'
      xml:
        name: DriftReports
        namespace: https://mosaiq.maxthecoder.online/xml/model-registry/v1
    DriftAlert:
      type: object
      additionalProperties: false
      description: >-
        An append-only finding of one report, explained from itself: which variable changed (`variable`),
        under which version (`model_version`), by how much (`statistics` and `bins` for a `DATA_DRIFT`
        alert, `outcome_test` for an `OUTCOME_TEST` alert) and what review it suggests (`suggested_review`).
        A `DATA_DRIFT` alert has `statistics` and `bins`, the three bins with the largest `contribution`
        first, and a null `outcome_test`. An `OUTCOME_TEST` alert has empty `statistics` and `bins`, and
        an `outcome_test` holding the segments that persisted.
      required:
      - alert_id
      - report_id
      - previous_report_id
      - kind
      - claim
      - model_version
      - variable
      - window
      - reference
      - statistics
      - bins
      - outcome_test
      - suggested_review
      - raised_at
      properties:
        alert_id:
          type: integer
          format: int64
        report_id:
          type: integer
          format: int64
          description: The report that raised the alert, a resource of this service.
        previous_report_id:
          type: integer
          format: int64
          description: The earlier report that held the same finding; an alert needs two consecutive windows.
        kind:
          $ref: '#/components/schemas/DriftKind'
        claim:
          $ref: '#/components/schemas/DriftClaim'
        model_version:
          $ref: '#/components/schemas/ModelVersionRef'
        variable:
          $ref: '#/components/schemas/DriftVariable'
        window:
          $ref: '#/components/schemas/DriftWindow'
        reference:
          $ref: '#/components/schemas/DriftReference'
        statistics:
          type: array
          maxItems: 2
          items:
            $ref: '#/components/schemas/DriftStatistic'
        bins:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/DriftBin'
          description: The bins that moved most, by contribution, largest first.
        outcome_test:
          oneOf:
          - $ref: '#/components/schemas/OutcomeTest'
          - type: 'null'
        suggested_review:
          $ref: '#/components/schemas/SuggestedReview'
        raised_at:
          type: string
          format: date-time
      xml:
        name: DriftAlert
        namespace: https://mosaiq.maxthecoder.online/xml/model-registry/v1
    DriftAlertPage:
      type: object
      additionalProperties: false
      required:
      - alerts
      - page_info
      properties:
        alerts:
          type: array
          items:
            $ref: '#/components/schemas/DriftAlert'
        page_info:
          $ref: '#/components/schemas/PageInfo'
      xml:
        name: DriftAlerts
        namespace: https://mosaiq.maxthecoder.online/xml/model-registry/v1
    PageInfo:
      type: object
      additionalProperties: false
      required:
      - page
      - size
      - total
      properties:
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
      xml:
        name: PageInfo
        namespace: https://mosaiq.maxthecoder.online/xml/common/v1
    ErrorDetail:
      type: object
      additionalProperties: false
      required:
      - field
      - code
      properties:
        field:
          type: string
        code:
          type: string
    Error:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      - correlation_id
      - details
      properties:
        code:
          type: string
        message:
          type: string
        correlation_id:
          type: string
          pattern: ^[0-9A-Za-z-]{1,64}$
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
      xml:
        name: Error
        namespace: https://mosaiq.maxthecoder.online/xml/common/v1
  responses:
    Unauthorized:
      description: '`invalid_token` or `session_revoked`.'
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalid_token:
              externalValue: ./examples/invalid-token.json
            session_revoked:
              externalValue: ./examples/session-revoked.json
        application/xml:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalid_token:
              externalValue: ./examples/invalid-token.xml
            session_revoked:
