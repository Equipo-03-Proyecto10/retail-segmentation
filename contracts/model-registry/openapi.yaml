              externalValue: ./examples/database-unavailable.json
        application/xml:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            auth_unavailable:
              externalValue: ./examples/auth-unavailable.xml
            database_unavailable:
              externalValue: ./examples/database-unavailable.xml
    SchemaNotReady:
      description: '`schema_not_ready`.'
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            schema_not_ready:
              externalValue: ./examples/schema-not-ready.json
        application/xml:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            schema_not_ready:
              externalValue: ./examples/schema-not-ready.xml
    MalformedBody:
      description: '`malformed_body`.'
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            malformed_body:
              externalValue: ./examples/malformed-body.json
        application/xml:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            malformed_body:
              externalValue: ./examples/malformed-body.xml
    PayloadTooLarge:
      description: '`payload_too_large`.'
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            payload_too_large:
              externalValue: ./examples/payload-too-large.json
        application/xml:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            payload_too_large:
              externalValue: ./examples/payload-too-large.xml
    UnsupportedMediaType:
      description: '`unsupported_media_type`.'
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unsupported_media_type:
              externalValue: ./examples/unsupported-media-type.json
        application/xml:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unsupported_media_type:
              externalValue: ./examples/unsupported-media-type.xml
    InvalidBody:
      description: '`invalid_body`.'
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalid_body:
              externalValue: ./examples/invalid-body.json
        application/xml:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalid_body:
              externalValue: ./examples/invalid-body.xml
    InvalidPagination:
      description: '`invalid_pagination`.'
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalid_pagination:
              externalValue: ./examples/invalid-pagination.json
        application/xml:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalid_pagination:
              externalValue: ./examples/invalid-pagination.xml
    ListInvalid:
      description: '`invalid_query` or `invalid_pagination`.'
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalid_query:
              externalValue: ./examples/invalid-query.json
            invalid_pagination:
              externalValue: ./examples/invalid-pagination.json
        application/xml:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalid_query:
              externalValue: ./examples/invalid-query.xml
            invalid_pagination:
              externalValue: ./examples/invalid-pagination.xml
    VersionNotFound:
      description: '`model_version_not_found`.'
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
