services:
  - name: auth
    port: 5001
    rule: "A principal is authenticated only by a valid credential of an active account, and every token stays usable only while its session is live (RN-52; related RN-03)"
    rn: [RN-52]
    wave: core
    resources: [sessions, jwks.json]
  - name: users
    port: 5002
    rule: "Accounts obey the single-administrator rule (never two, never zero, moved only by an explicit transfer), have case-insensitively unique emails, are deactivated, never deleted, and say which stores a floor user works in through one assignment per user and store (RN-01, RN-02, RN-04, ADR-0060)"
    rn: [RN-01, RN-02, RN-04]
    wave: core
    resources: [users, roles, administrator-transfers, store-assignments]
  - name: products
    port: 5003
    rule: "A product has a unique SKU, a price that is never negative and exactly one existing category, and is retired by deactivation (RN-10, RN-11)"
    rn: [RN-10, RN-11]
    wave: core
    resources: [products]
  - name: categories
    port: 5004
    rule: "The category tree has no cycles, and a category with products, children or customer interests is never deleted through services (RN-33, RN-06, RN-07)"
    rn: [RN-33, RN-06, RN-07]
    wave: core
    resources: [categories]
  - name: stores
    port: 5005
    rule: "Each store has at most one location, with valid coordinates and a 25–2000 m geofence, and one operating status, weekly opening hours, set of enabled channels and maximum discount, all set by ADMIN only (RN-53)"
    rn: [RN-53]
    wave: core
    resources: [stores]
  - name: stock
    port: 5006
    rule: "Stock is never negative, and changes only through an accepted sale, its reversal or a recorded movement with a reason (RN-14, RN-69, ADR-0031)"
    rn: [RN-14, RN-69]
    wave: core
    resources: [stock-levels, stock-movements, availabilities]
  - name: customers
    port: 5007
    rule: "A customer is registered once, with a valid unique email when given, a known channel and a registration date not in the future, and is never deleted through services; its loyalty card is an opaque code derived from nothing about the customer, a customer holds at most one active card, and a card is revoked, never deleted, so revoking it again changes nothing (RN-08)"
    rn: [RN-08]
    wave: core
    resources: [customers, loyalty-cards]
  - name: customer-preferences
    port: 5008
    rule: "A customer's preferred channels and interest categories are each replaced only atomically, as a whole set of existing references (RN-54)"
    rn: [RN-54]
    wave: core
    resources: [preference-profiles]
  - name: sales
    port: 5009
    rule: "A sale is recorded exactly once, all or nothing, consuming its stock in the same transaction, and only with lines dated not in the future and not before the customer's registration, for active products, with positive quantities and positive two-decimal prices; it is never edited or deleted, and a cancellation or return is recorded beside it as an append-only reversal that restores stock in the same transaction (RN-11 to RN-13, RN-37 (accepted sales), RN-70)"
    rn: [RN-11, RN-12, RN-13, RN-37, RN-70]
    wave: core
    resources: [sales, sale-reversals, channels]
  - name: segments
    port: 5010
    rule: "A customer has at most one current segment, named by its stable label code, unassigned states are reported as they are, a migration compares one customer's labels within one model version, and a comparison across versions is marked methodological (RN-20, RN-21, RN-39, RN-59, RN-60)"
    rn: [RN-20, RN-21, RN-39, RN-59, RN-60]
    wave: core
    resources: [segments, segment-assignments, segment-migrations]
  - name: recommendations
    port: 5011
    rule: "Recommend active, in-stock products not already bought, matching a stated signal, with reasons, or report why nothing qualifies (RN-40)"
    rn: [RN-40]
    wave: core
    resources: [recommendations]
  - name: engagement
    port: 5012
    rule: "In-store engagement (`QR_SCAN`, `RECO_CLICK`, `STORE_VISIT`, `RECO_IMPRESSION`, `CAMPAIGN_EXPOSURE`, `CART_ADD`, `CART_REMOVE`, `NAVIGATION`) is recorded once per client event as a distinct fact that is never a sale, attributed, voided rather than deleted, and summarized (RN-55)"
    rn: [RN-55]
    wave: core
    resources: [engagement-events, engagement-summaries]
  - name: check-ins
    port: 5013
    rule: "A staff check-in is verified only when the server-computed distance lies within the store's geofence at acceptable accuracy, and overrides are append-only reviews (RN-56); a customer visit is a separate fact that never holds a position, recorded only for an active loyalty code and a customer who has not withdrawn profiling, once per duplicate window (RN-72)"
    rn: [RN-56, RN-72]
    wave: core
    resources: [check-ins, customer-visits]
  - name: campaigns
    port: 5014
    rule: "A campaign moves only DRAFT→ACTIVE/CANCELLED and ACTIVE→FINISHED/CANCELLED, is edited only in DRAFT, never ends before it starts, and is activated only before it has ended and while every attached experiment is ready (RN-15, RN-16, RN-22, RN-24 (activation), RN-31, RN-32, RN-49 (activation)), and a promotion belongs to one campaign, discounts by a percentage above zero, and is valid only within that campaign's dates (RN-71)"
    rn: [RN-15, RN-16, RN-22, RN-24, RN-31, RN-32, RN-49, RN-71]
    wave: second
    resources: [campaigns, promotions]
  - name: audit-trail
    port: 5015
    rule: "The audit trail is append-only, attributed, free of credentials, and readable by ADMIN and AUDITOR only (RN-28, RN-29, RN-30)"
    rn: [RN-28, RN-29, RN-30]
    wave: second
    resources: [audit-entries]
  - name: rfm-engine
    port: 5016
    rule: "A customer's R, F and M are a function of their accepted, unreversed purchases under one rule-set version, change only for the customers an event touched, and equal a full recalculation of that version at the same instant (RN-65)"
    rn: [RN-65]
    wave: third
    resources: [rfm-profiles, rfm-rule-sets, rfm-recalculations]
  - name: model-registry
    port: 5019
    rule: "A model version is immutable once published, carries its dataset, parameters, metrics and reference distribution, changes state only by an explicit publication or rollback, and every drift alert is judged against that reference (RN-66)"
    rn: [RN-66]
    wave: third
    resources: [model-versions, model-trainings]
  - name: analytics-kpis
    port: 5022
    rule: "A KPI is reported only under its published definition, window and data origin, from `api_*` objects, and only to the roles and stores allowed to read it (RN-68)"
    rn: [RN-68]
    wave: third
    resources: [kpi-reports]
