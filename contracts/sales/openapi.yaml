openapi: 3.1.0
info:
  title: sales-service
  version: 1.4.0
  description: >-
    Records a sale exactly once, all or nothing, and reads sales and the channel
    vocabulary back (RN-11 to RN-13, RN-37). A sale is never edited or deleted:
    a cancellation or a return is recorded beside it as a reversal, an
    append-only fact, and every reader counts net units (ADR-0062). A sales file
    reaches the service as a sale import: its rows travel as numbered chunks under
    the 64 KiB body cap and a worker applies them one row at a time through the
    same rule, each row accepted or refused on its own and every refusal reported
    by line, field and reason (ADR-0070).
security:
  - bearer: []
tags:
  - name: Sales
  - name: Sale reversals
  - name: Sale imports
  - name: Channels
  - name: Meta
paths:
  /v1/sales:
    post:
      tags: [Sales]
      summary: Record a sale
      description: >-
        Records the whole sale in one transaction, or nothing: the header, every
        line and the stock consumed by each line commit together. `occurred_at` must
        carry an offset, must not be in the future and must not precede the
        customer's registration. Every product must be active, every quantity
        positive and every `unit_price` the price actually charged (RN-13), positive
        with two decimals. Lines refuse an empty list (`no_lines`) and a product
        twice (`duplicate_product_line`); a line-level refusal names the line in
        `details`, with a zero-based index as in `lines[1].quantity`. The schema
        does not cap or constrain these values, so that the service answers with its
        own code.

        Idempotency. The `Idempotency-Key` becomes `source_transaction_id =
        'svc-sales:' || lowercase(key)`. The service hashes the caller's `sub`, the
        ids, `occurred_at` in UTC and the lines sorted by `product_id` with
        two-decimal prices, so a JSON retry and an XML retry hash the same. The same
        key with the same hash is a replay: 200 with the original sale and
        `Idempotent-Replayed: true`. The same key with a different hash is 409
        `idempotency_key_reused`. Only accepted sales are remembered, so a refused
        request may be retried with the same key.

        A client retries only on a network error, a timeout or a 503, always with
        the same key, and treats 409 and 422 as final. A 503 `database_unavailable`
        is retried like any other 503.
      operationId: recordSale
      x-mosaiq-roles:
        - ADMIN
        - STORE_MANAGER
        - SALES_ASSOCIATE
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaleRequest'
            examples:
              three_lines:
                externalValue: ./examples/record-sale.request.json
              no_lines:
                externalValue: ./examples/empty-sale.request.json
          application/xml:
            schema:
              $ref: '#/components/schemas/SaleRequest'
            examples:
              three_lines:
                externalValue: ./examples/record-sale.request.xml
              no_lines:
                externalValue: ./examples/empty-sale.request.xml
      responses:
        '200':
          description: The key was already used by an identical request; the original sale is returned.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sale'
              examples:
                replayed:
                  externalValue: ./examples/record-sale-replay.json
            application/xml:
              schema:
                $ref: '#/components/schemas/Sale'
              examples:
                replayed:
                  externalValue: ./examples/record-sale-replay.xml
        '201':
          description: The sale was recorded.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sale'
              examples:
                recorded:
                  externalValue: ./examples/record-sale.json
            application/xml:
              schema:
                $ref: '#/components/schemas/Sale'
              examples:
                recorded:
                  externalValue: ./examples/record-sale.xml
        '400':
          $ref: '#/components/responses/SaleBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '409':
          $ref: '#/components/responses/SaleConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/SaleRefused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/OperationUnavailable'
    get:
      tags: [Sales]
      summary: List sales
      description: >-
        Returns a page of sales, newest first by `occurred_at`, then by `sale_id`.
        `customer_id` and `store_id` filter exactly; `from` (inclusive) and `to`
        (exclusive) are RFC 3339 timestamps with an offset. A malformed filter, or
        `from` after `to`, gets 422 `invalid_query`. A sale carries no product name
        or price from products: clients fetch them with `GET /v1/products?ids=`.
        With `customer_id`, the read is one named customer's sales history, a
        logged read (ADR-0072): before it returns, it records one `HISTORY_READ`
        domain event (`history` `SALES`, the customer as subject) naming who
        read and when, never what was returned, and a 403 on it records one with
        outcome `REFUSED`. When that event cannot be recorded the read is 503
        `audit_unavailable` and returns no sales. A read without `customer_id`
        records nothing.
      operationId: listSales
      x-mosaiq-roles:
        - ADMIN
        - ANALYST
        - STORE_MANAGER
        - MARKETING
        - AUDITOR
        - SALES_ASSOCIATE
        - COMMERCIAL_SUPERVISOR
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/CustomerIdFilter'
        - $ref: '#/components/parameters/StoreIdFilter'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: A page of sales.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalePage'
              examples:
                sales_page:
                  externalValue: ./examples/list-sales.json
            application/xml:
              schema:
                $ref: '#/components/schemas/SalePage'
              examples:
                sales_page:
                  externalValue: ./examples/list-sales.xml
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '422':
          $ref: '#/components/responses/InvalidSaleQuery'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/OperationUnavailable'
  /v1/sales/{sale_id}:
    get:
      tags: [Sales]
      summary: Get one sale
      description: >-
        Returns the sale with its lines. Used for the phone's status check and for
        the desktop read-back.
      operationId: getSale
      x-mosaiq-roles:
        - ADMIN
        - ANALYST
        - STORE_MANAGER
        - MARKETING
        - AUDITOR
        - SALES_ASSOCIATE
        - COMMERCIAL_SUPERVISOR
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/SaleId'
      responses:
        '200':
          description: The requested sale.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sale'
              examples:
                sale:
                  externalValue: ./examples/get-sale.json
            application/xml:
              schema:
                $ref: '#/components/schemas/Sale'
              examples:
                sale:
                  externalValue: ./examples/get-sale.xml
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/SaleNotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/OperationUnavailable'
  /v1/sale-reversals:
    post:
      x-mosaiq-status: planned
      tags: [Sale reversals]
      summary: Record a cancellation or a return
      description: >-
        Records a reversal of an accepted sale as a new fact. The sale, its lines
        and its `total` are never changed: `total` stays what was charged, and
        `transaction_line.returned_quantity` carries each line's running total,
        written by this service alone in the same transaction (ADR-0062).

        Two kinds. A `CANCELLATION` reverses the whole sale: it takes a `reason`,
        takes no `lines` (`unexpected_lines`), and is refused once the sale has any
        reversal (`sale_already_reversed`). A `RETURN` reverses one or more lines,
        whole or in part: it takes `lines`, each with its own `reason` and a
        `quantity`, and no header `reason`. A return may be repeated until every
        unit is back; returning more units than remain is 409
        `quantity_exceeds_remaining`. A product appears once per request
        (`duplicate_product_line`) and must be on the sale (`unknown_sale_line`).

        Who may do what. `x-mosaiq-roles` lists the roles that may call the
        operation at all. `SALES_ASSOCIATE` may record only a `CANCELLATION`; a
        `RETURN` from that role is 403 `forbidden_role`. `ADMIN` and
        `STORE_MANAGER` may record both. The floor roles work only in their
        assigned stores, and a reversal of a sale at another store is 403
        `forbidden_store` (ADR-0060).

        When. The window is configuration, not a requirement. By default a
        cancellation is accepted on the sale's calendar day and a return within
        30 days of the sale's `occurred_at`; after that the answer is 409
        `reversal_window_closed`, naming the kind in `details`.

        Stock. Inside the same transaction the service restores stock through
        `api_stock.restock_v1`: every unit of a cancellation, and every unit of a
        return line whose `resellable` is true (the default). A line marked
        `resellable: false` is recorded and restores nothing. If the store has no
        stock record for a product, the whole reversal is refused with 422
        `no_stock_record`. Nothing commits unless the reversal, the
        `returned_quantity` updates and the stock all commit.

        Idempotency. `Idempotency-Key` is required and its namespace is this
        resource's own: a key used on `POST /v1/sales` is unrelated. The service
        hashes the caller's `sub`, `sale_id`, `kind`, the cancellation `reason`
        and the lines sorted by `product_id` with their `quantity`, `reason` and
        `resellable`, so a JSON retry and an XML retry hash the same. The same
        key with the same hash is a replay: 200 with the original reversal and
        `Idempotent-Replayed: true`, and nothing recorded. The same key with a
        different hash is 409 `idempotency_key_reused`. Only accepted reversals
        are remembered, so a refused request may be retried with the same key. A
        client retries only on a network error, a timeout or a 503, with the same
        key, and treats 409 and 422 as final.

        The sale itself is not changed in any representation: `GET /v1/sales`
        keeps returning what was charged. Clients read what was reversed from
        `GET /v1/sale-reversals?sale_id=`.
      operationId: recordSaleReversal
      x-mosaiq-roles:
        - ADMIN
        - STORE_MANAGER
        - SALES_ASSOCIATE
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaleReversalRequest'
            examples:
              cancellation:
                externalValue: ./examples/cancel-sale.request.json
              return:
                externalValue: ./examples/return-lines.request.json
          application/xml:
            schema:
              $ref: '#/components/schemas/SaleReversalRequest'
            examples:
              cancellation:
                externalValue: ./examples/cancel-sale.request.xml
              return:
                externalValue: ./examples/return-lines.request.xml
      responses:
        '200':
          description: The key was already used by an identical request; the original reversal is returned.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaleReversal'
              examples:
                replayed:
                  externalValue: ./examples/cancel-sale-replay.json
            application/xml:
              schema:
                $ref: '#/components/schemas/SaleReversal'
              examples:
                replayed:
                  externalValue: ./examples/cancel-sale-replay.xml
        '201':
          description: The reversal was recorded.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            Location:
              $ref: '#/components/headers/ReversalLocation'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaleReversal'
              examples:
                cancellation:
                  externalValue: ./examples/cancel-sale.json
                return:
                  externalValue: ./examples/return-lines.json
            application/xml:
              schema:
                $ref: '#/components/schemas/SaleReversal'
              examples:
                cancellation:
                  externalValue: ./examples/cancel-sale.xml
                return:
                  externalValue: ./examples/return-lines.xml
        '400':
          $ref: '#/components/responses/SaleBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ReversalForbidden'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '409':
          $ref: '#/components/responses/ReversalConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ReversalRefused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/OperationUnavailable'
    get:
      x-mosaiq-status: planned
      tags: [Sale reversals]
      summary: List reversals
      description: >-
        Returns a page of reversals, newest first by `recorded_at`, then by
        `reversal_id`. `sale_id`, `customer_id`, `store_id` and `kind` filter
        exactly; `from` (inclusive) and `to` (exclusive) bound `recorded_at` and are
        RFC 3339 timestamps with an offset. A malformed filter, or `from` after
        `to`, gets 422 `invalid_query`. A caller confined to assigned stores sees
        only those stores' reversals, and one that names another store gets 403
        `forbidden_store` (ADR-0060). A reversal carries no product name or price
        from products: clients fetch them with `GET /v1/products?ids=`.
      operationId: listSaleReversals
      x-mosaiq-roles:
        - ADMIN
        - ANALYST
        - STORE_MANAGER
        - MARKETING
        - AUDITOR
        - SALES_ASSOCIATE
        - COMMERCIAL_SUPERVISOR
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/SaleIdFilter'
        - $ref: '#/components/parameters/CustomerIdFilter'
        - $ref: '#/components/parameters/StoreIdFilter'
        - $ref: '#/components/parameters/ReversalKindFilter'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: A page of reversals.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaleReversalPage'
              examples:
                reversals_page:
                  externalValue: ./examples/list-sale-reversals.json
            application/xml:
              schema:
                $ref: '#/components/schemas/SaleReversalPage'
              examples:
                reversals_page:
                  externalValue: ./examples/list-sale-reversals.xml
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ReversalForbidden'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '422':
          $ref: '#/components/responses/InvalidSaleQuery'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/OperationUnavailable'
  /v1/sale-reversals/{reversal_id}:
    get:
      x-mosaiq-status: planned
      tags: [Sale reversals]
      summary: Get one reversal
      description: >-
        Returns the reversal with its lines, for the status check after a retry and
        for the desktop read-back.
      operationId: getSaleReversal
      x-mosaiq-roles:
        - ADMIN
        - ANALYST
        - STORE_MANAGER
        - MARKETING
        - AUDITOR
        - SALES_ASSOCIATE
        - COMMERCIAL_SUPERVISOR
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ReversalId'
      responses:
        '200':
          description: The requested reversal.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaleReversal'
              examples:
                reversal:
                  externalValue: ./examples/get-sale-reversal.json
            application/xml:
              schema:
                $ref: '#/components/schemas/SaleReversal'
              examples:
                reversal:
                  externalValue: ./examples/get-sale-reversal.xml
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ReversalForbidden'
        '404':
          $ref: '#/components/responses/SaleReversalNotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/OperationUnavailable'
  /v1/sale-imports:
    post:
      x-mosaiq-status: planned
      tags: [Sale imports]
      summary: Open a sales import
      description: >-
        Opens an import and reserves its place. No row travels here: the CSV never
        reaches the service. The client reads the file, checks its header and sends
        the rows afterwards as numbered chunks with `PUT
        /v1/sale-imports/{import_id}/chunks/{sequence}`, each an ordinary JSON or XML
        body under the 64 KiB cap (ADR-0070).

        `contract_version` is 1, the CSV contract of the web's page. `header` is the
        eight column names in order: `transaction_id`, `customer_id`, `store_id`,
        `channel_id`, `occurred_at`, `product_id`, `quantity`, `unit_price`.
        `total_rows` is the number of data lines, 1 to 100,000; the header is line 1
        and is not counted. `chunk_count` is the number of chunks the client will
        send, 1 to 667. A value out of range is 422 `invalid_body` naming the field
        (`total_rows` or `chunk_count`, with `out_of_range`); a version other than 1
        is 422 `invalid_body` on `contract_version` with `unsupported_version`; a
        header that is not those eight names in that order is 422 `invalid_body`
        naming the first wrong column as `header[3]` with `unexpected_column`.

        One import is open at a time. While another is `RECEIVING` or `PROCESSING`
        the answer is 409 `import_in_progress`; its id is the newest in `GET
        /v1/sale-imports`. The importer is the token's `sub`, never a body field, and
        only `ADMIN` imports (ADR-0070 section 7).

        Idempotency. `Idempotency-Key` is required and its namespace is this
        resource's own. The service hashes the caller's `sub` and the body, so a JSON
        retry and an XML retry hash the same. The same key with the same hash is a
        replay: 200 with the import that key created, as it stands now, `Idempotent-Replayed:
        true`, and nothing created. The same key with a different hash is 409
        `idempotency_key_reused`. A client retries only on a network error, a timeout
        or a 503, with the same key, and treats 409 and 422 as final.
      operationId: createSaleImport
      x-mosaiq-roles:
        - ADMIN
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaleImportRequest'
            examples:
              nine_rows_two_chunks:
                externalValue: ./examples/create-sale-import.request.json
          application/xml:
            schema:
              $ref: '#/components/schemas/SaleImportRequest'
            examples:
              nine_rows_two_chunks:
                externalValue: ./examples/create-sale-import.request.xml
      responses:
        '200':
          description: The key was already used by an identical request; the import it created is returned.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            Idempotent-Replayed:
              $ref: '#/components/headers/ImportIdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaleImport'
              examples:
                replayed:
                  externalValue: ./examples/create-sale-import-replay.json
            application/xml:
              schema:
                $ref: '#/components/schemas/SaleImport'
              examples:
                replayed:
                  externalValue: ./examples/create-sale-import-replay.xml
        '201':
          description: The import was opened and is `RECEIVING`.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            Location:
              $ref: '#/components/headers/ImportLocation'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaleImport'
              examples:
                opened:
                  externalValue: ./examples/create-sale-import.json
            application/xml:
              schema:
                $ref: '#/components/schemas/SaleImport'
              examples:
                opened:
                  externalValue: ./examples/create-sale-import.xml
        '400':
          $ref: '#/components/responses/SaleBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '409':
          $ref: '#/components/responses/ImportCreateConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ImportCreateRefused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/OperationUnavailable'
    get:
      x-mosaiq-status: planned
      tags: [Sale imports]
      summary: List the recent imports
      description: >-
        Returns a page of imports, newest first by `created_at`, then by
        `import_id`, with the status and counts of each. It carries no rows and no
        rejections: `GET /v1/sale-imports/{import_id}/rejections` reads those. The
        newest import is the one that blocks a new one while it is `RECEIVING` or
        `PROCESSING`.
      operationId: listSaleImports
      x-mosaiq-roles:
        - ADMIN
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: A page of imports.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaleImportPage'
              examples:
                imports_page:
                  externalValue: ./examples/list-sale-imports.json
            application/xml:
              schema:
                $ref: '#/components/schemas/SaleImportPage'
              examples:
                imports_page:
                  externalValue: ./examples/list-sale-imports.xml
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '422':
          $ref: '#/components/responses/InvalidPagination'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/OperationUnavailable'
  /v1/sale-imports/{import_id}:
    get:
      x-mosaiq-status: planned
      tags: [Sale imports]
      summary: Get one import, its progress and its reconciled counts
      description: >-
        Returns the import's `status`, `next_sequence` and counts. It is how a
        client resumes: one that lost its connection asks, then continues at
        `next_sequence`, the lowest chunk the service has not yet staged. Sending a
        chunk that was already staged is harmless (see `sendSaleImportChunk`), so a
        client unsure whether its last chunk arrived may also simply send it again.

        The counts reconcile, and the service refuses to report an import
        `COMPLETED` unless they do: `received` (the rows staged) equals `accepted` +
        `rejected` + `pending`, and `pending` is zero at `COMPLETED`, where
        `received` also equals `total_rows`. `accepted` and `rejected` are rows, not
        sales: a sale spread over several lines of the file can be partly accepted
        (ADR-0070 section 4). `accepted`, `rejected` and `pending` may move while the
        import is `RECEIVING`, so a client reads them as final only at `COMPLETED`.
        In `CANCELLED` and `EXPIRED`, `pending` keeps counting the rows that were
        received and never applied, so the identity holds in every status.

        `RECEIVING`: chunks are still expected. `PROCESSING`: every chunk is staged
        and rows remain to apply. `COMPLETED`: every row has an outcome.
        `CANCELLED`: the administrator cancelled it. `EXPIRED`: 24 hours passed
        without a chunk, and the staged rows not yet applied were dropped.
        `finished_at` is set in the last three, and absent (`null` in JSON) before.
      operationId: getSaleImport
      x-mosaiq-roles:
        - ADMIN
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ImportId'
      responses:
        '200':
          description: The requested import.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaleImport'
              examples:
                processing:
                  externalValue: ./examples/get-sale-import.json
                completed:
                  externalValue: ./examples/get-sale-import-completed.json
            application/xml:
              schema:
                $ref: '#/components/schemas/SaleImport'
              examples:
                processing:
                  externalValue: ./examples/get-sale-import.xml
                completed:
                  externalValue: ./examples/get-sale-import-completed.xml
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/SaleImportNotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/OperationUnavailable'
  /v1/sale-imports/{import_id}/chunks/{sequence}:
    put:
      x-mosaiq-status: planned
      tags: [Sale imports]
      summary: Send one numbered chunk of rows
      description: >-
        Stages chunk `sequence`, counted from 0, and answers 202 with the import's
        counts. Nothing is applied inside the request: a worker of this service
        applies the rows afterwards, one at a time, through the same rule as `POST
        /v1/sales` (ADR-0070 sections 3 and 4).

        A chunk is the rows as positional cells, `{line, cells[]}`, so the service,
        not the client, decides what a row is. `line` is the row's line in the file,
        the header being line 1. It must be positive, unique and increasing within the
        import, across chunks as well as inside one; otherwise 422 `invalid_body`
        with `details[].field` as `rows[2].line`. A chunk is validated structurally
        and nothing else: 1 to 150 rows, at most 64 cells per row, each cell a string
        of at most 256 characters. A violation is 422 `invalid_body` naming the field
        (`rows` with `too_many`, `rows[0].cells[4]` with `too_long`). Values are never
        typed here: a price of `19.999`, a future date, an unparsable number or nine
        cells is a row rejection later, reported by line (`listSaleImportRejections`),
        never a refusal of the chunk, because one bad row must not reject its
        neighbours (ADR-0020).

        Size. The client stops a chunk at 150 rows or 60,000 bytes of serialized
        body, whichever comes first, so the cap is never what it discovers. A larger
        body is still 413 `payload_too_large` from NGINX, unchanged, and a client that
        sends more than 10 requests a second (burst 20) is 429 `rate_limited` with
        `Retry-After`. In XML a cell is written as an element, empty when the cell
        is empty, so the position of every cell is kept.

        Order and repetition. Chunks are sent in order. The same `sequence` with the
        same body, compared by the SHA-256 of the canonical form (the rows by `line`,
        each `line` with its cells in order, so a JSON and an XML retry compare equal),
        is a replay: 200 with the import and `Idempotent-Replayed: true`, and nothing
        staged twice. The same `sequence` with another body is 409 `chunk_conflict`. A
        `sequence` above `next_sequence` is 409 `chunk_out_of_order`, whose `details`
        name `next_sequence`: the answer cannot carry the number (an error detail is a
        `field` and a `code`), so its message states it and `GET
        /v1/sale-imports/{import_id}` returns it. An import that is not `RECEIVING`
        is 409 `import_not_receiving`.

        Reconciliation. The rows of all chunks must add up to `total_rows`, and the
        chunks must number `chunk_count`. When the last chunk (`sequence` =
        `chunk_count` - 1) arrives and they do not, the answer is 422
        `row_count_mismatch` and the import stays `RECEIVING` until it is cancelled or
        expires; a client treats the refusal as final, cancels, and opens a new import
        with the numbers of the file it read. When they do add up, the import becomes
        `PROCESSING`.
      operationId: sendSaleImportChunk
      x-mosaiq-roles:
        - ADMIN
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ImportId'
        - $ref: '#/components/parameters/ChunkSequence'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaleImportChunk'
            examples:
              last_chunk:
                externalValue: ./examples/send-sale-import-chunk.request.json
              malformed_cell:
                externalValue: ./examples/send-sale-import-chunk-malformed-cell.request.json
          application/xml:
            schema:
              $ref: '#/components/schemas/SaleImportChunk'
            examples:
              last_chunk:
                externalValue: ./examples/send-sale-import-chunk.request.xml
              malformed_cell:
                externalValue: ./examples/send-sale-import-chunk-malformed-cell.request.xml
      responses:
        '200':
          description: The same chunk was already staged; the import is returned and nothing is staged again.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            Idempotent-Replayed:
              $ref: '#/components/headers/ImportIdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaleImport'
              examples:
                replayed:
                  externalValue: ./examples/sale-import-chunk-replay.json
            application/xml:
              schema:
                $ref: '#/components/schemas/SaleImport'
              examples:
                replayed:
                  externalValue: ./examples/sale-import-chunk-replay.xml
        '202':
          description: The chunk was staged. Its rows are applied afterwards, so the counts are not final.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaleImport'
              examples:
                staged:
                  externalValue: ./examples/sale-import-chunk-accepted.json
            application/xml:
              schema:
                $ref: '#/components/schemas/SaleImport'
              examples:
                staged:
                  externalValue: ./examples/sale-import-chunk-accepted.xml
        '400':
          $ref: '#/components/responses/MalformedBody'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/SaleImportNotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '409':
          $ref: '#/components/responses/ChunkConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ChunkRefused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/OperationUnavailable'
  /v1/sale-imports/{import_id}/rejections:
    get:
      x-mosaiq-status: planned
      tags: [Sale imports]
      summary: List the rows an import refused
      description: >-
        Returns a page of the rejected rows, ordered by `line`, with `page` and
        `size` as everywhere else and `PageInfo.total` equal to the import's
        `rejected`. The report survives the import: it stays readable after
        `COMPLETED`, as the web's does. Rows are applied in file order by one worker,
        so a page read during processing does not shift when later rows are
        refused.

        Each rejection carries the `line` of the file (the header is line 1), the
        `field` at fault, a stable `code` a program branches on, and a `message` a
        person can act on: it names the line, says what is wrong and what a valid
        value looks like, and quotes at most 64 characters of the offending cell, with
        control characters removed. `field` is the column name (`transaction_id`,
        `customer_id`, `store_id`, `channel_id`, `occurred_at`, `product_id`,
        `quantity` or `unit_price`) and is absent (`null` in JSON) when the row as
        a whole is at fault. A rejection rolls back nothing else: every other row of
        the file is judged on its own.

        A duplicate says which kind it is. `duplicate_row` always carries
        `duplicate_of`: `FILE` when an earlier line of this same file, an accepted
        one, already made the row's line, and then `first_line` names it; and
        `RECORDED_SALE` when the sale was recorded before this import began, by an
        earlier import of the same file, through the web page's upload
        (ADR-0070 section 5) or as a seeded sale, and then `sale_id` names it when it
        is known. A repeat inside the file and a sale already recorded need different
        actions, which is why the report keeps them apart. Neither records anything.

        The codes are those the same fault gets on `POST /v1/sales`, plus the codes
        that only a file can cause:

        | `code` | `field` | The row |
        |---|---|---|
        | `wrong_cell_count` | absent | does not have exactly eight cells |
        | `invalid_value` | the column | has a blank cell, or one that is not of its column's type: a whole number (`store_id`, `channel_id`, `product_id`, `quantity`), a UUID (`customer_id`), a decimal (`unit_price`) or an ISO 8601 date and time (`occurred_at`) |
        | `missing_offset` | `occurred_at` | has a date and time with no UTC offset |
        | `formula_like_id` | `transaction_id` | has an id that starts with `=`, `+`, `-` or `@`, which a spreadsheet would evaluate |
        | `id_too_long` | `transaction_id` | has an id of more than 50 characters |
        | `header_mismatch` | the first column that disagrees | names a `transaction_id` already accepted in this import with another customer, store, channel or date |
        | `duplicate_row` | absent | repeats a line that already exists (see `duplicate_of`) |
        | `unknown_customer`, `unknown_store`, `unknown_channel`, `unknown_product` | the column | names no such customer, store, channel or product |
        | `inactive_product` | `product_id` | names a product that is no longer active |
        | `before_registration` | `occurred_at` | is dated before the customer registered |
        | `future_dated` | `occurred_at` | is dated in the future |
        | `invalid_price` | `unit_price` | has a price that is not positive or has more than two decimals |
        | `invalid_quantity` | `quantity` | has a quantity that is not positive |
        | `stock_unavailable` | `quantity` | asks for more units than the store holds |
        | `no_stock_record` | `product_id` | names a product the store holds no stock record for |
      operationId: listSaleImportRejections
      x-mosaiq-roles:
        - ADMIN
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ImportId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: A page of rejections.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaleImportRejectionPage'
              examples:
                rejections_page:
                  externalValue: ./examples/list-sale-import-rejections.json
            application/xml:
              schema:
                $ref: '#/components/schemas/SaleImportRejectionPage'
              examples:
                rejections_page:
                  externalValue: ./examples/list-sale-import-rejections.xml
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/SaleImportNotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '422':
          $ref: '#/components/responses/InvalidPagination'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/OperationUnavailable'
  /v1/sale-imports/{import_id}/status:
    put:
      x-mosaiq-status: planned
      tags: [Sale imports]
      summary: Cancel an import
      description: >-
        Sets the import's status to `CANCELLED`, the only value a client may set. Rows
        already accepted stay accepted: nothing is rolled back (ADR-0020), and only the
        chunks not yet applied are dropped. Their rows stay in `pending`, so the counts
        still reconcile. Cancelling an import that is already `CANCELLED` answers 200
        with it, unchanged. An import that is `COMPLETED` or `EXPIRED` has finished,
        and cancelling it is 409 `import_finished`.

        A revoked session does not stop an import that was already received: the
        importer was checked on every chunk and the work outlives the token
        (ADR-0070 section 3). Cancelling is what stops it.
      operationId: cancelSaleImport
      x-mosaiq-roles:
        - ADMIN
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ImportId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaleImportStatusRequest'
            examples:
              cancel:
                externalValue: ./examples/cancel-sale-import.request.json
          application/xml:
            schema:
              $ref: '#/components/schemas/SaleImportStatusRequest'
            examples:
              cancel:
                externalValue: ./examples/cancel-sale-import.request.xml
      responses:
        '200':
          description: The import is `CANCELLED`.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaleImport'
              examples:
                cancelled:
                  externalValue: ./examples/cancel-sale-import.json
            application/xml:
              schema:
                $ref: '#/components/schemas/SaleImport'
              examples:
                cancelled:
                  externalValue: ./examples/cancel-sale-import.xml
        '400':
          $ref: '#/components/responses/MalformedBody'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/SaleImportNotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '409':
          $ref: '#/components/responses/ImportFinished'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ImportStatusRefused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/OperationUnavailable'
  /v1/channels:
    get:
      tags: [Sales]
      summary: List the sales channels
      description: >-
        Returns the whole channel vocabulary, five rows today. It is read only:
        sales validates every sale's `channel_id` against it and the phone must
        offer it (E-01). No resource of another service is served here, and there is
        no write operation.
      operationId: listChannels
      x-mosaiq-roles:
        - ADMIN
        - ANALYST
        - STORE_MANAGER
        - MARKETING
        - INVENTORY_PLANNER
        - AUDITOR
        - SALES_ASSOCIATE
        - LOYALTY_OFFICER
        - COMMERCIAL_SUPERVISOR
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: The channels.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelList'
              examples:
                channels:
                  externalValue: ./examples/list-channels.json
            application/xml:
              schema:
                $ref: '#/components/schemas/ChannelList'
              examples:
                channels:
                  externalValue: ./examples/list-channels.xml
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/OperationUnavailable'
  /health/live:
    get:
      tags: [Meta]
      summary: Check process liveness
      operationId: getLiveness
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '204':
          description: The process is live.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
  /health/ready:
    get:
      tags: [Meta]
      summary: Check schema readiness
      operationId: getReadiness
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '204':
          description: The required schema is ready.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
        '503':
          $ref: '#/components/responses/SchemaNotReady'
  /openapi.yaml:
    get:
      tags: [Meta]
      summary: Get this OpenAPI document
      operationId: getOpenApi
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: The OpenAPI document, served byte for byte.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/yaml:
              schema:
                type: string
        '406':
          $ref: '#/components/responses/NotAcceptable'
  /schema.xsd:
    get:
      tags: [Meta]
      summary: Get the sales XML Schema
      operationId: getSchema
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: The sales XSD, served byte for byte.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/xml:
              schema:
                type: string
        '406':
          $ref: '#/components/responses/NotAcceptable'
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      description: >-
        Caller-supplied correlation id. A missing or invalid value is replaced
        by the service, and the effective value is returned on every response.
      schema:
        type: string
        pattern: '^[0-9A-Za-z-]{1,64}$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        A UUID the client generates once, when the sale is created, and reuses
        on every retry of that sale.
      schema:
        type: string
        format: uuid
    SaleId:
      name: sale_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ReversalId:
      name: reversal_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ImportId:
      name: import_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ChunkSequence:
      name: sequence
      in: path
      required: true
      description: >-
        The chunk's number, counted from 0 and at most `chunk_count` - 1. At
        most 667 chunks make an import.
      schema:
        type: integer
        minimum: 0
        maximum: 666
    SaleIdFilter:
      name: sale_id
      in: query
      required: false
      description: Restrict the page to the reversals of this sale.
      schema:
        type: integer
        format: int64
    ReversalKindFilter:
      name: kind
      in: query
      required: false
      description: Restrict the page to cancellations or to returns.
      schema:
        $ref: '#/components/schemas/ReversalKind'
    CustomerIdFilter:
      name: customer_id
      in: query
      required: false
      description: Restrict the page to this customer.
      schema:
        type: string
        format: uuid
    StoreIdFilter:
      name: store_id
      in: query
      required: false
      description: Restrict the page to this store.
      schema:
        type: integer
    From:
      name: from
      in: query
      required: false
      description: Inclusive lower bound on `occurred_at`, RFC 3339 with an offset.
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      required: false
      description: Exclusive upper bound on `occurred_at`, RFC 3339 with an offset.
      schema:
        type: string
        format: date-time
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  headers:
    CorrelationId:
      description: The effective correlation id for this request.
      required: true
      schema:
        type: string
        pattern: '^[0-9A-Za-z-]{1,64}$'
    RetryAfter:
      description: Seconds until the caller should retry.
      required: true
      schema:
        type: integer
        minimum: 1
    Location:
      description: The URL of the recorded sale, `/v1/sales/{sale_id}`.
      required: true
      schema:
        type: string
    ReversalLocation:
      description: The URL of the recorded reversal, `/v1/sale-reversals/{reversal_id}`.
      required: true
      schema:
        type: string
    ImportLocation:
      description: The URL of the opened import, `/v1/sale-imports/{import_id}`.
      required: true
      schema:
        type: string
    ImportIdempotentReplayed:
      description: Always `true`; the answer is for a request already received, and nothing was created or staged again.
      required: true
      schema:
        type: string
        enum: ['true']
    IdempotentReplayed:
      description: Always `true`; the answer is the original sale, not a new one.
      required: true
      schema:
        type: string
        enum: ['true']
  schemas:
    SaleLineInput:
      type: object
      additionalProperties: false
      required:
        - product_id
        - quantity
        - unit_price
      properties:
        product_id:
          type: integer
          format: int32
        quantity:
          type: integer
          description: Must be positive; the service answers `invalid_quantity` otherwise.
        unit_price:
          type: string
          pattern: '^-?[0-9]+(\.[0-9]+)?$'
          description: >-
            The price actually charged, a decimal string. The service requires
            it positive with two decimals and answers `invalid_price`
            otherwise.
    SaleRequest:
      type: object
      additionalProperties: false
      required:
        - customer_id
        - store_id
        - channel_id
        - occurred_at
      properties:
        customer_id:
          type: string
          pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
        store_id:
          type: integer
        channel_id:
          type: integer
        occurred_at:
          type: string
          format: date-time
          description: RFC 3339 with an offset. Without one the body is `invalid_body`.
        lines:
          type: array
          description: >-
            Absent or empty gets 422 `no_lines`; the same product twice gets
            409 `duplicate_product_line`.
          items:
            $ref: '#/components/schemas/SaleLineInput'
      xml:
        name: SaleRequest
        namespace: https://mosaiq.maxthecoder.online/xml/sales/v1
    SaleLine:
      type: object
      additionalProperties: false
      required:
        - product_id
        - quantity
        - unit_price
      properties:
        product_id:
          type: integer
          format: int32
        quantity:
          type: integer
          minimum: 1
        unit_price:
          type: string
          pattern: '^[0-9]+\.[0-9]{2}$'
    Sale:
      type: object
      additionalProperties: false
      required:
        - sale_id
        - customer_id
        - store_id
        - channel_id
        - occurred_at
        - total
        - lines
      properties:
        sale_id:
          type: integer
          format: int64
          description: The `transaction_id`.
        customer_id:
          type: string
          pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
        store_id:
          type: integer
        channel_id:
          type: integer
        occurred_at:
          type: string
          format: date-time
        total:
          type: string
          pattern: '^[0-9]+\.[0-9]{2}$'
          description: The sum of quantity times unit price over the lines.
        lines:
          type: array
          items:
            $ref: '#/components/schemas/SaleLine'
      xml:
        name: Sale
        namespace: https://mosaiq.maxthecoder.online/xml/sales/v1
    SalePage:
      type: object
      additionalProperties: false
      required:
        - sales
        - page_info
      properties:
        sales:
          type: array
          items:
            $ref: '#/components/schemas/Sale'
        page_info:
          $ref: '#/components/schemas/PageInfo'
      xml:
        name: Sales
        namespace: https://mosaiq.maxthecoder.online/xml/sales/v1
    ReversalKind:
      type: string
      enum: [CANCELLATION, RETURN]
      description: >-
        `CANCELLATION` reverses the whole sale. `RETURN` reverses one or more lines,
        whole or in part. The system has no third state: a voided sale is a
        cancellation.
    SaleReversalLineInput:
      type: object
      additionalProperties: false
      required:
        - product_id
        - quantity
      properties:
        product_id:
          type: integer
          format: int32
        quantity:
          type: integer
          description: >-
            Units to return. Must be positive and at most the units that remain;
            the service answers `invalid_quantity` or `quantity_exceeds_remaining`.
        reason:
          type: string
          maxLength: 200
          description: Why these units come back. Absent or blank is 422 `reason_required`.
        resellable:
          type: boolean
          default: true
          description: >-
            False when the goods cannot be resold. The line is recorded and stock is
            not restored for it. Absent means true.
    SaleReversalRequest:
      type: object
      additionalProperties: false
      required:
        - sale_id
        - kind
      properties:
        sale_id:
          type: integer
          format: int64
          description: The sale to reverse, its `sale_id`. An unknown sale is 422 `unknown_sale`.
        kind:
          $ref: '#/components/schemas/ReversalKind'
        reason:
          type: string
          maxLength: 200
          description: >-
            Required for a `CANCELLATION` (422 `reason_required`). A `RETURN` states
            its reason on each line instead.
        lines:
          type: array
          description: >-
            Required and non-empty for a `RETURN` (422 `no_return_lines`). A
            `CANCELLATION` sends none (422 `unexpected_lines`). The same product
            twice gets 409 `duplicate_product_line`.
          items:
            $ref: '#/components/schemas/SaleReversalLineInput'
      xml:
        name: SaleReversalRequest
        namespace: https://mosaiq.maxthecoder.online/xml/sales/v1
    SaleReversalLine:
      type: object
      additionalProperties: false
      required:
        - product_id
        - quantity
        - remaining_quantity
        - unit_price
        - resellable
      properties:
        product_id:
          type: integer
          format: int32
        quantity:
          type: integer
          minimum: 1
          description: Units reversed by this reversal.
        remaining_quantity:
          type: integer
          minimum: 0
          description: >-
            Units of the sale line still counted after this reversal, which is
            `quantity - returned_quantity` of the line. It is zero once the line is
            fully reversed.
        unit_price:
          type: string
          pattern: '^[0-9]+\.[0-9]{2}$'
          description: The price actually charged on the sale line.
        reason:
          type: string
          description: >-
            The reason of a returned line. Absent (`null` in JSON) on a cancellation,
            whose reason is on the header.
        resellable:
          type: boolean
          description: Whether stock was restored for this line.
    SaleReversal:
      type: object
      additionalProperties: false
      required:
        - reversal_id
        - sale_id
        - kind
        - customer_id
        - store_id
        - recorded_at
        - recorded_by
        - amount
        - net_total
        - lines
      properties:
        reversal_id:
          type: integer
          format: int64
        sale_id:
          type: integer
          format: int64
        kind:
          $ref: '#/components/schemas/ReversalKind'
        reason:
          type: string
          description: The reason of a cancellation. Absent (`null` in JSON) on a return.
        customer_id:
          type: string
          pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
        store_id:
          type: integer
        recorded_at:
          type: string
          format: date-time
          description: When the service recorded the reversal, set by the server.
        recorded_by:
          type: string
          pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
          description: The `sub` of the caller.
        amount:
          type: string
          pattern: '^[0-9]+\.[0-9]{2}$'
          description: The sum of quantity times unit price over the reversed lines.
        net_total:
          type: string
          pattern: '^[0-9]+\.[0-9]{2}$'
          description: >-
            The sale's net amount after this reversal, the sum of remaining quantity
            times unit price over all of its lines. It is zero once nothing remains,
            and the sale then stops counting as a purchase.
        lines:
          type: array
          description: >-
            The lines this reversal touched, sorted by `product_id`. A cancellation
            lists every line of the sale.
          items:
            $ref: '#/components/schemas/SaleReversalLine'
      xml:
        name: SaleReversal
        namespace: https://mosaiq.maxthecoder.online/xml/sales/v1
    SaleReversalPage:
      type: object
      additionalProperties: false
      required:
        - sale_reversals
        - page_info
      properties:
        sale_reversals:
          type: array
          items:
            $ref: '#/components/schemas/SaleReversal'
        page_info:
          $ref: '#/components/schemas/PageInfo'
      xml:
        name: SaleReversals
        namespace: https://mosaiq.maxthecoder.online/xml/sales/v1
    ImportStatus:
      type: string
      enum: [RECEIVING, PROCESSING, COMPLETED, CANCELLED, EXPIRED]
      description: >-
        `RECEIVING`: chunks are still expected. `PROCESSING`: every chunk is staged
        and rows remain to apply. `COMPLETED`: every row has an outcome and the
        counts reconcile. `CANCELLED`: the administrator cancelled it. `EXPIRED`:
        24 hours passed without a chunk. An import leaves `RECEIVING` only to
        `PROCESSING`, `CANCELLED` or `EXPIRED`, and `COMPLETED`, `CANCELLED` and
        `EXPIRED` are final.
    SaleImportRequest:
      type: object
      additionalProperties: false
      required:
        - contract_version
        - header
        - total_rows
        - chunk_count
      properties:
        contract_version:
          type: integer
          description: >-
            The CSV contract of the web's page, 1. Another value is 422
            `invalid_body` on this field with `unsupported_version`.
        header:
          type: array
          minItems: 8
          maxItems: 8
          description: >-
            The eight column names of the file, in order: `transaction_id`,
            `customer_id`, `store_id`, `channel_id`, `occurred_at`, `product_id`,
            `quantity`, `unit_price`. The service checks the names, and answers 422
            `invalid_body` on the first wrong one, as `header[3]` with
            `unexpected_column`.
          items:
            type: string
        total_rows:
          type: integer
          minimum: 1
          maximum: 100000
          description: The data lines of the file; the header is line 1 and is not counted.
        chunk_count:
          type: integer
          minimum: 1
          maximum: 667
          description: How many chunks the client will send, numbered 0 to `chunk_count` - 1.
      xml:
        name: SaleImportRequest
        namespace: https://mosaiq.maxthecoder.online/xml/sales/v1
    SaleImportRow:
      type: object
      additionalProperties: false
      required:
        - line
        - cells
      properties:
        line:
          type: integer
          minimum: 1
          description: >-
            The row's line in the file, the header being line 1, so the first data row
            is 2. Unique and increasing within the import, across chunks. Otherwise 422
            `invalid_body` on `rows[i].line`.
        cells:
          type: array
          maxItems: 64
          description: >-
            The row's cells, as text and in the order of the file's columns. They are
            never typed here: a row with another number of cells than eight is the row
            rejection `wrong_cell_count`, not a refusal of the chunk. In XML each cell
            is a `cells` element, empty when the cell is empty.
          items:
            type: string
            maxLength: 256
    SaleImportChunk:
      type: object
      additionalProperties: false
      required:
        - rows
      properties:
        rows:
          type: array
          minItems: 1
          maxItems: 150
          description: >-
            1 to 150 rows. The client also stops a chunk at 60,000 bytes of serialized
            body, so a chunk stays under the 64 KiB cap in JSON and in XML.
          items:
            $ref: '#/components/schemas/SaleImportRow'
      xml:
        name: SaleImportChunk
        namespace: https://mosaiq.maxthecoder.online/xml/sales/v1
    SaleImportStatusRequest:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum: [CANCELLED]
          description: The only status a client may set.
      xml:
        name: SaleImportStatusRequest
        namespace: https://mosaiq.maxthecoder.online/xml/sales/v1
    SaleImport:
      type: object
      additionalProperties: false
      required:
        - import_id
        - status
        - contract_version
        - total_rows
        - chunk_count
        - next_sequence
        - received
        - accepted
        - rejected
        - pending
        - created_at
        - finished_at
        - created_by
      properties:
        import_id:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/ImportStatus'
        contract_version:
          type: integer
          minimum: 1
        total_rows:
          type: integer
          minimum: 1
          description: The data lines the client announced.
        chunk_count:
          type: integer
          minimum: 1
          description: The chunks the client announced.
        next_sequence:
          type: integer
          minimum: 0
          description: >-
            The lowest chunk the service has not staged. A client that lost its
            connection continues here. It equals `chunk_count` once every chunk is staged.
        received:
          type: integer
          minimum: 0
          description: The rows staged so far.
        accepted:
          type: integer
          minimum: 0
          description: Rows applied as a sale line.
        rejected:
          type: integer
          minimum: 0
          description: Rows refused, each reported by line.
        pending:
          type: integer
          minimum: 0
          description: >-
            Rows staged and not yet applied. Zero at `COMPLETED`. In `CANCELLED` and
            `EXPIRED` it keeps counting the rows that were never applied.
        created_at:
          type: string
          format: date-time
        finished_at:
          type:
            - string
            - 'null'
          format: date-time
          description: >-
            When the import became `COMPLETED`, `CANCELLED` or `EXPIRED`; absent in XML
            (`null` in JSON) before.
        created_by:
          type: string
          pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
          description: The `sub` of the caller that opened the import, never taken from a body.
      xml:
        name: SaleImport
        namespace: https://mosaiq.maxthecoder.online/xml/sales/v1
    SaleImportPage:
      type: object
      additionalProperties: false
      required:
        - sale_imports
        - page_info
      properties:
        sale_imports:
          type: array
          items:
            $ref: '#/components/schemas/SaleImport'
        page_info:
          $ref: '#/components/schemas/PageInfo'
      xml:
        name: SaleImports
        namespace: https://mosaiq.maxthecoder.online/xml/sales/v1
    DuplicateOf:
      type: string
      enum: [FILE, RECORDED_SALE]
      description: >-
        `FILE`: an earlier, accepted line of this same file already made the row's
        line. `RECORDED_SALE`: the sale was recorded before this import began.
    SaleImportRejection:
      type: object
      additionalProperties: false
      required:
        - line
        - field
        - code
        - message
        - duplicate_of
        - first_line
        - sale_id
      properties:
        line:
          type: integer
          minimum: 1
          description: The line of the file, the header being line 1, so at least 2.
        field:
          type:
            - string
            - 'null'
          description: >-
            The column at fault. Absent in XML (`null` in JSON) when the row as a whole
            is, as for `wrong_cell_count` and `duplicate_row`.
        code:
          type: string
          description: >-
            A stable snake_case code a program branches on. The codes in force are
            listed on `listSaleImportRejections`; the schema does not enumerate them
            so that a code added later is not a breaking change.
        message:
          type: string
          description: >-
            A sentence a person can act on: the line, what is wrong and what a valid
            value looks like. It quotes at most 64 characters of the offending cell,
            with control characters removed.
        duplicate_of:
          oneOf:
            - $ref: '#/components/schemas/DuplicateOf'
            - type: 'null'
          description: >-
            Set on `duplicate_row` only, to tell a repeat inside the file from a sale
            already recorded. Absent in XML (`null` in JSON) otherwise.
        first_line:
          type:
            - integer
            - 'null'
          minimum: 1
          description: >-
            With `duplicate_of` `FILE`, the first line of this file, an accepted one,
            that made the row's line. Absent in XML (`null` in JSON) otherwise.
        sale_id:
          type:
            - integer
            - 'null'
          format: int64
          description: >-
            With `duplicate_of` `RECORDED_SALE`, the recorded sale, when it is known.
            Absent in XML (`null` in JSON) otherwise.
      xml:
        name: SaleImportRejection
        namespace: https://mosaiq.maxthecoder.online/xml/sales/v1
    SaleImportRejectionPage:
      type: object
      additionalProperties: false
      required:
        - sale_import_rejections
        - page_info
      properties:
        sale_import_rejections:
          type: array
          items:
            $ref: '#/components/schemas/SaleImportRejection'
        page_info:
          $ref: '#/components/schemas/PageInfo'
      xml:
        name: SaleImportRejections
        namespace: https://mosaiq.maxthecoder.online/xml/sales/v1
    Channel:
      type: object
      additionalProperties: false
      required:
