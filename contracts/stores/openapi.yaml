openapi: 3.1.0
info:
  title: stores-service
  version: 1.2.0
  description: >-
    Publishes the store directory and lets an administrator set or clear the
    one geofenced location that belongs to a store (RN-53). It also publishes,
    and lets an administrator write, a store's status, weekly opening hours,
    enabled channels and commercial rules.
security:
  - bearer: []
tags:
  - name: Stores
  - name: Meta
paths:
  /v1/stores:
    get:
      tags: [Stores]
      summary: List the store directory
      description: >-
        Returns a page of stores. Cache misses read PostgreSQL, so a database
        failure remains visible even though successful reads may be cached. A
        filter value outside its schema returns 422 `invalid_query`, naming the
        parameter in `details`.
      operationId: listStores
      x-mosaiq-roles:
        - ADMIN
        - ANALYST
        - STORE_MANAGER
        - MARKETING
        - INVENTORY_PLANNER
        - AUDITOR
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Active'
        - $ref: '#/components/parameters/City'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: A page of stores.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorePage'
              examples:
                directory_page:
                  externalValue: ./examples/directory-page.json
            application/xml:
              schema:
                $ref: '#/components/schemas/StorePage'
              examples:
                directory_page:
                  externalValue: ./examples/directory-page.xml
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '422':
          $ref: '#/components/responses/StoreListValidation'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/OperationUnavailable'
  /v1/stores/{store_id}:
    get:
      tags: [Stores]
      summary: Get one store
      description: >-
        Returns the store and its location when one is set. An unset location
        is null in JSON and omitted in XML.
      operationId: getStore
      x-mosaiq-roles:
        - ADMIN
        - ANALYST
        - STORE_MANAGER
        - MARKETING
        - INVENTORY_PLANNER
        - AUDITOR
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/StoreId'
      responses:
        '200':
          description: The requested store.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Store'
              examples:
                store_with_location:
                  externalValue: ./examples/store-with-location.json
                store_without_location:
                  externalValue: ./examples/store-without-location.json
            application/xml:
              schema:
                $ref: '#/components/schemas/Store'
              examples:
                store_with_location:
                  externalValue: ./examples/store-with-location.xml
                store_without_location:
                  externalValue: ./examples/store-without-location.xml
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/StoreNotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/OperationUnavailable'
  /v1/stores/{store_id}/location:
    put:
      tags: [Stores]
      summary: Set a store location
      description: >-
        Sets or replaces the store's single location. Only ADMIN may write
        this fact. All three location fields are replaced together.
      operationId: putStoreLocation
      x-mosaiq-roles: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/StoreId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationUpdate'
            examples:
              set_location:
                externalValue: ./examples/set-location.request.json
          application/xml:
            schema:
              $ref: '#/components/schemas/LocationUpdate'
            examples:
              set_location:
                externalValue: ./examples/set-location.request.xml
      responses:
        '200':
          description: The store with its newly set location.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Store'
              examples:
                set_location:
                  externalValue: ./examples/set-location.json
            application/xml:
              schema:
                $ref: '#/components/schemas/Store'
              examples:
                set_location:
                  externalValue: ./examples/set-location.xml
        '400':
          $ref: '#/components/responses/MalformedBody'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/StoreNotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/InvalidBody'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/OperationUnavailable'
    delete:
      tags: [Stores]
      summary: Clear a store location
      description: >-
        Clears the store's location. The operation is idempotent and returns
        204 when the store exists even if it had no location.
      operationId: deleteStoreLocation
      x-mosaiq-roles: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/StoreId'
      responses:
        '204':
          description: The location is absent.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/StoreNotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/OperationUnavailable'
  /v1/stores/{store_id}/status:
    get:
      tags: [Stores]
      summary: Get a store's status
      description: >-
        Returns the operational status of the store and when it last changed. A
        store whose status was never written is ACTIVE, with `changed_at` null.
      operationId: getStoreStatus
      x-mosaiq-roles:
        - ADMIN
        - ANALYST
        - STORE_MANAGER
        - MARKETING
        - INVENTORY_PLANNER
        - AUDITOR
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/StoreId'
      responses:
        '200':
          description: The store's operational status.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreStatus'
              examples:
                store_status:
                  externalValue: ./examples/store-status.json
            application/xml:
              schema:
                $ref: '#/components/schemas/StoreStatus'
              examples:
                store_status:
                  externalValue: ./examples/store-status.xml
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/StoreNotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/OperationUnavailable'
    put:
      tags: [Stores]
      summary: Set a store's status
      description: >-
        Sets the store's status to one of ACTIVE, TEMPORARILY_CLOSED or CLOSED.
        Only ADMIN may write this fact. The operation is idempotent: writing the
        status the store already has answers 200 and changes nothing. The status
        is stores-service's own fact; it does not write the catalog flag
        `is_active`, which the directory keeps publishing as it does today. A
        value outside the three is 422 `invalid_body`.
      operationId: putStoreStatus
      x-mosaiq-roles: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/StoreId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusUpdate'
            examples:
              set_status:
                externalValue: ./examples/set-store-status.request.json
          application/xml:
            schema:
              $ref: '#/components/schemas/StatusUpdate'
            examples:
              set_status:
                externalValue: ./examples/set-store-status.request.xml
      responses:
        '200':
          description: The resource after the write.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreStatus'
              examples:
                set_status:
                  externalValue: ./examples/set-store-status.json
            application/xml:
              schema:
                $ref: '#/components/schemas/StoreStatus'
              examples:
                set_status:
                  externalValue: ./examples/set-store-status.xml
        '400':
          $ref: '#/components/responses/MalformedBody'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/StoreNotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/InvalidBody'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/OperationUnavailable'
  /v1/stores/{store_id}/opening-hours:
    get:
      tags: [Stores]
      summary: Get a store's opening hours
      description: >-
        Returns the store's time zone and its weekly opening hours, one interval
        for each day it opens. A day with no entry is closed all day. A store with
        no hours set returns its time zone as null and an empty `days` list.
      operationId: getStoreOpeningHours
      x-mosaiq-roles:
        - ADMIN
        - ANALYST
        - STORE_MANAGER
        - MARKETING
        - INVENTORY_PLANNER
        - AUDITOR
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/StoreId'
      responses:
        '200':
          description: The store's weekly opening hours.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpeningHours'
              examples:
                opening_hours:
                  externalValue: ./examples/opening-hours.json
            application/xml:
              schema:
                $ref: '#/components/schemas/OpeningHours'
              examples:
                opening_hours:
                  externalValue: ./examples/opening-hours.xml
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/StoreNotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/OperationUnavailable'
    put:
      tags: [Stores]
      summary: Replace a store's opening hours
      description: >-
        Replaces the whole week: days not in the list become closed, and an empty
        list closes every day. Only ADMIN may write this fact. Times are `HH:MM`
        on a 24-hour clock in the store's `time_zone`, an IANA name such as
        `America/Monterrey`. Each day appears at most once, has one interval, and
        `closes_at` is later than `opens_at`; an interval never crosses midnight.
        A duplicate day, an interval that ends before it starts or a time zone
        that is not an IANA name is 422 `invalid_body`, with `details` naming the
        field.
      operationId: putStoreOpeningHours
      x-mosaiq-roles: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/StoreId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpeningHoursUpdate'
            examples:
              set_hours:
                externalValue: ./examples/set-opening-hours.request.json
              close_all_days:
                externalValue: ./examples/clear-opening-hours.request.json
          application/xml:
            schema:
              $ref: '#/components/schemas/OpeningHoursUpdate'
            examples:
              set_hours:
                externalValue: ./examples/set-opening-hours.request.xml
              close_all_days:
                externalValue: ./examples/clear-opening-hours.request.xml
      responses:
        '200':
          description: The resource after the write.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpeningHours'
              examples:
                set_hours:
                  externalValue: ./examples/set-opening-hours.json
            application/xml:
              schema:
                $ref: '#/components/schemas/OpeningHours'
              examples:
                set_hours:
                  externalValue: ./examples/set-opening-hours.xml
        '400':
          $ref: '#/components/responses/MalformedBody'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/StoreNotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/InvalidBody'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/OperationUnavailable'
  /v1/stores/{store_id}/enabled-channels:
    get:
      tags: [Stores]
      summary: Get the channels a store sells through
      description: >-
        Returns the ids of the channels enabled for the store, sorted ascending.
        The channel vocabulary belongs to sales (ADR-0035), so this contract
        carries ids only, as customer-preferences does.
      operationId: getStoreEnabledChannels
      x-mosaiq-roles:
        - ADMIN
        - ANALYST
        - STORE_MANAGER
        - MARKETING
        - INVENTORY_PLANNER
        - AUDITOR
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/StoreId'
      responses:
        '200':
          description: The channels the store sells through.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnabledChannels'
              examples:
                enabled_channels:
                  externalValue: ./examples/enabled-channels.json
            application/xml:
              schema:
                $ref: '#/components/schemas/EnabledChannels'
              examples:
                enabled_channels:
                  externalValue: ./examples/enabled-channels.xml
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/StoreNotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/OperationUnavailable'
    put:
      tags: [Stores]
      summary: Replace the channels a store sells through
      description: >-
        Replaces the whole set: ids not in the list are removed, ids in it are
        added, and an empty list enables no channel (in XML, a request element
        with no ids). Only ADMIN may write this fact. A duplicate id is 422
        `invalid_body`. An id that references no channel is 422 `unknown_channel`,
        with its own code, and nothing changes.
      operationId: putStoreEnabledChannels
      x-mosaiq-roles: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/StoreId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnabledChannelsUpdate'
            examples:
              replace:
                externalValue: ./examples/set-enabled-channels.request.json
              clear:
                externalValue: ./examples/clear-enabled-channels.request.json
          application/xml:
            schema:
              $ref: '#/components/schemas/EnabledChannelsUpdate'
            examples:
              replace:
                externalValue: ./examples/set-enabled-channels.request.xml
              clear:
                externalValue: ./examples/clear-enabled-channels.request.xml
      responses:
        '200':
          description: The resource after the write.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnabledChannels'
              examples:
                replaced:
                  externalValue: ./examples/set-enabled-channels.json
                cleared:
                  externalValue: ./examples/clear-enabled-channels.json
            application/xml:
              schema:
                $ref: '#/components/schemas/EnabledChannels'
              examples:
                replaced:
                  externalValue: ./examples/set-enabled-channels.xml
                cleared:
                  externalValue: ./examples/clear-enabled-channels.xml
        '400':
          $ref: '#/components/responses/MalformedBody'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/StoreNotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ChannelsRefused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/OperationUnavailable'
  /v1/stores/{store_id}/commercial-rules:
    get:
      tags: [Stores]
      summary: Get a store's commercial rules
      description: >-
        Returns the commercial rules the store sets. Exactly one rule exists
        today: `max_discount_percent`, the largest discount, as a percentage of
        the line price, that a sale at this store may apply. Null means the store
        has set no limit. F25-05 enforces it in sales; this service only stores
        it.
      operationId: getStoreCommercialRules
      x-mosaiq-roles:
        - ADMIN
        - ANALYST
        - STORE_MANAGER
        - MARKETING
        - INVENTORY_PLANNER
        - AUDITOR
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/StoreId'
      responses:
        '200':
          description: The store's commercial rules.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommercialRules'
              examples:
                commercial_rules:
                  externalValue: ./examples/commercial-rules.json
            application/xml:
              schema:
                $ref: '#/components/schemas/CommercialRules'
              examples:
                commercial_rules:
                  externalValue: ./examples/commercial-rules.xml
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/StoreNotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/OperationUnavailable'
    put:
      tags: [Stores]
      summary: Set a store's commercial rules
      description: >-
        Replaces the store's commercial rules. Only ADMIN may write this fact.
        `max_discount_percent` is a decimal string with two places from 0.00
        through 100.00, or null to remove the limit (in XML, an omitted element).
        A value outside the range or with another number of places is 422
        `invalid_body`.
      operationId: putStoreCommercialRules
      x-mosaiq-roles: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/StoreId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommercialRulesUpdate'
            examples:
              set_limit:
                externalValue: ./examples/set-commercial-rules.request.json
              remove_limit:
                externalValue: ./examples/clear-commercial-rules.request.json
          application/xml:
            schema:
              $ref: '#/components/schemas/CommercialRulesUpdate'
            examples:
              set_limit:
                externalValue: ./examples/set-commercial-rules.request.xml
              remove_limit:
                externalValue: ./examples/clear-commercial-rules.request.xml
      responses:
        '200':
          description: The resource after the write.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommercialRules'
              examples:
                set_limit:
                  externalValue: ./examples/set-commercial-rules.json
                remove_limit:
                  externalValue: ./examples/clear-commercial-rules.json
            application/xml:
              schema:
                $ref: '#/components/schemas/CommercialRules'
              examples:
                set_limit:
                  externalValue: ./examples/set-commercial-rules.xml
                remove_limit:
                  externalValue: ./examples/clear-commercial-rules.xml
        '400':
          $ref: '#/components/responses/MalformedBody'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/StoreNotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/InvalidBody'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/OperationUnavailable'
  /health/live:
    get:
      tags: [Meta]
      summary: Check process liveness
      operationId: getLiveness
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '204':
          description: The process is live.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
  /health/ready:
    get:
      tags: [Meta]
      summary: Check schema readiness
      operationId: getReadiness
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '204':
          description: The required schema is ready.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
        '503':
          $ref: '#/components/responses/SchemaNotReady'
  /openapi.yaml:
    get:
      tags: [Meta]
      summary: Get this OpenAPI document
      operationId: getOpenApi
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: The OpenAPI document, served byte for byte.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/yaml:
              schema:
                type: string
        '406':
          $ref: '#/components/responses/NotAcceptable'
  /schema.xsd:
    get:
      tags: [Meta]
      summary: Get the stores XML Schema
      operationId: getSchema
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: The stores XSD, served byte for byte.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/xml:
              schema:
                type: string
        '406':
          $ref: '#/components/responses/NotAcceptable'
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      description: >-
        Caller-supplied correlation id. A missing or invalid value is replaced
        by the service, and the effective value is returned on every response.
      schema:
        type: string
        pattern: '^[0-9A-Za-z-]{1,64}$'
    StoreId:
      name: store_id
      in: path
      required: true
      schema:
        type: integer
        format: int32
    Active:
      name: active
      in: query
      required: false
      description: Restrict the directory to active or inactive stores.
      schema:
        type: boolean
    City:
      name: city
      in: query
      required: false
      description: Restrict the directory to this city.
      schema:
        type: string
        minLength: 1
        maxLength: 80
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  headers:
    CorrelationId:
      description: The effective correlation id for this request.
      required: true
      schema:
        type: string
        pattern: '^[0-9A-Za-z-]{1,64}$'
    RetryAfter:
      description: Seconds until the caller should retry.
      required: true
      schema:
        type: integer
        minimum: 1
  schemas:
    Location:
      type: object
      additionalProperties: false
      required:
        - latitude
        - longitude
        - geofence_radius_m
        - set_at
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        geofence_radius_m:
          type: integer
          minimum: 25
          maximum: 2000
        set_at:
          type: string
          format: date-time
    LocationUpdate:
      type: object
      additionalProperties: false
      required:
        - latitude
        - longitude
        - geofence_radius_m
      properties:
