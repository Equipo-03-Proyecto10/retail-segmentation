          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        geofence_radius_m:
          type: integer
          minimum: 25
          maximum: 2000
      xml:
        name: LocationUpdate
        namespace: https://mosaiq.maxthecoder.online/xml/stores/v1
    Store:
      type: object
      additionalProperties: false
      required:
        - store_id
        - name
        - city
        - state
        - is_active
        - location
      properties:
        store_id:
          type: integer
          format: int32
        name:
          type: string
        city:
          type: string
        state:
          type: string
        is_active:
          type: boolean
        location:
          anyOf:
            - $ref: '#/components/schemas/Location'
            - type: 'null'
      xml:
        name: Store
        namespace: https://mosaiq.maxthecoder.online/xml/stores/v1
    StoreStatusValue:
      type: string
      enum: [ACTIVE, TEMPORARILY_CLOSED, CLOSED]
    StoreStatus:
      type: object
      additionalProperties: false
      required: [store_id, status, changed_at]
      properties:
        store_id:
          type: integer
          format: int32
        status:
          $ref: '#/components/schemas/StoreStatusValue'
        changed_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
      xml:
        name: StoreStatus
        namespace: https://mosaiq.maxthecoder.online/xml/stores/v1
    StatusUpdate:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/StoreStatusValue'
      xml:
        name: StatusUpdate
        namespace: https://mosaiq.maxthecoder.online/xml/stores/v1
    DayOfWeek:
      type: string
      enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY]
    ClockTime:
      type: string
      pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
      examples: ['09:00', '21:30']
    OpeningDay:
      type: object
      additionalProperties: false
