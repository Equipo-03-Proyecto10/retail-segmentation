        role_code: STORE_MANAGER
        password: placeholder-new-password-456
    CreateUserRequestXml:
      value: |-
        <CreateUserRequest xmlns="https://mosaiq.maxthecoder.online/xml/users/v1"><name>Morgan Manager</name><email>morgan.manager@example.com</email><role_code>STORE_MANAGER</role_code><password>placeholder-new-password-456</password></CreateUserRequest>
    CreatedUserJson:
      value:
        user_id: 33333333-3333-4333-8333-333333333333
        name: Morgan Manager
        email: morgan.manager@example.com
        role_code: STORE_MANAGER
        is_active: true
        created_at: '2026-10-15T16:00:00Z'
