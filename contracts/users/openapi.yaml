        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            role_not_store_bound:
              externalValue: ./examples/role-not-store-bound.json
        application/xml:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            role_not_store_bound:
              externalValue: ./examples/role-not-store-bound.xml
    StoreAssignmentRefused:
      description: >-
