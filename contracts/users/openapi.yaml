openapi: 3.1.0
info:
  title: users-service
  version: 1.1.0
  description: >-
    Owns user accounts, password changes, deactivation, the read-only role
    vocabulary, the atomic administrator transfer, and the stores each floor
    user is assigned to. Responses never expose credentials.
security:
  - bearer: []
tags:
  - name: Users
  - name: Roles
  - name: Administrator transfers
  - name: Store assignments
  - name: Meta
paths:
  /v1/users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: List users
      x-mosaiq-roles: [ADMIN, AUDITOR]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: role
          in: query
          description: Return only users with this role code.
          schema:
            $ref: '#/components/schemas/RoleCode'
        - name: active
          in: query
          description: Return only active or inactive users.
          schema:
            type: boolean
        - name: q
          in: query
          description: Case-insensitive search over name and email.
          schema:
            type: string
            minLength: 1
            maxLength: 160
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: A page of users.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
              examples:
                users:
                  $ref: '#/components/examples/UsersJson'
            application/xml:
              schema:
                $ref: '#/components/schemas/UserPage'
              examples:
                users:
                  $ref: '#/components/examples/UsersXml'
        '401':
          $ref: '#/components/responses/AuthenticationErrors'
        '403':
          $ref: '#/components/responses/ForbiddenRole'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '422':
          $ref: '#/components/responses/InvalidPagination'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
    post:
      tags: [Users]
      operationId: createUser
      summary: Create a user
      description: >-
        Creates an active user. ADMIN is syntactically accepted so the
        single-administrator rule can return single_administrator rather than
        disguising a domain conflict as malformed input.
      x-mosaiq-roles: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
            examples:
              create_user:
                $ref: '#/components/examples/CreateUserRequestJson'
          application/xml:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
            examples:
              create_user:
                $ref: '#/components/examples/CreateUserRequestXml'
      responses:
        '201':
          description: The created user, without the password.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                created_user:
                  $ref: '#/components/examples/CreatedUserJson'
            application/xml:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                created_user:
                  $ref: '#/components/examples/CreatedUserXml'
        '400':
          $ref: '#/components/responses/MalformedBody'
        '401':
          $ref: '#/components/responses/AuthenticationErrors'
        '403':
          $ref: '#/components/responses/ForbiddenRole'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '409':
          $ref: '#/components/responses/CreateUserConflicts'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/CreateUserValidationErrors'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /v1/users/me:
    get:
      tags: [Users]
      operationId: getCurrentUser
      summary: Get the caller's profile
      x-mosaiq-roles:
        - ADMIN
        - ANALYST
        - STORE_MANAGER
        - MARKETING
        - INVENTORY_PLANNER
        - AUDITOR
        - CUSTOMER
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: The caller's current user record.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                current_user:
                  $ref: '#/components/examples/CurrentUserJson'
            application/xml:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                current_user:
                  $ref: '#/components/examples/CurrentUserXml'
        '401':
          $ref: '#/components/responses/AuthenticationErrors'
        '403':
          $ref: '#/components/responses/ForbiddenRole'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /v1/users/{user_id}:
    get:
      tags: [Users]
      operationId: getUser
      summary: Get one user
      x-mosaiq-roles: [ADMIN, AUDITOR]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: The requested user.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                user:
                  $ref: '#/components/examples/UserJson'
            application/xml:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                user:
                  $ref: '#/components/examples/UserXml'
        '401':
          $ref: '#/components/responses/AuthenticationErrors'
        '403':
          $ref: '#/components/responses/ForbiddenRole'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
    patch:
      tags: [Users]
      operationId: updateUser
      summary: Edit a user's name, email, or non-ADMIN role
      description: >-
        At least one field is required. ADMIN cannot be assigned or removed by
        this operation; callers must use the atomic administrator transfer.
      x-mosaiq-roles: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
            examples:
              update_user:
                $ref: '#/components/examples/UpdateUserRequestJson'
          application/xml:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
            examples:
              update_user:
                $ref: '#/components/examples/UpdateUserRequestXml'
      responses:
        '200':
          description: The updated user.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                updated_user:
                  $ref: '#/components/examples/UpdatedUserJson'
            application/xml:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                updated_user:
                  $ref: '#/components/examples/UpdatedUserXml'
        '400':
          $ref: '#/components/responses/MalformedBody'
        '401':
          $ref: '#/components/responses/AuthenticationErrors'
        '403':
          $ref: '#/components/responses/ForbiddenRole'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '409':
          $ref: '#/components/responses/UpdateUserConflicts'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UpdateUserValidationErrors'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /v1/users/{user_id}/password:
    put:
      tags: [Users]
      operationId: changeUserPassword
      summary: Change or reset a password
      description: >-
        A caller other than ADMIN may name only its own user_id and must send
        the current password. A change of the caller's own password also
        requires the current password. ADMIN may reset another user's password
        without it. More than 5 failed current-password checks for one user in
        15 minutes returns rate_limited. A successful change or reset ends all
        sessions for the affected user, including the caller's.
      x-mosaiq-roles:
        - ADMIN
        - ANALYST
        - STORE_MANAGER
        - MARKETING
        - INVENTORY_PLANNER
        - AUDITOR
        - CUSTOMER
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
            examples:
              change_password:
                $ref: '#/components/examples/PasswordChangeRequestJson'
          application/xml:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
            examples:
              change_password:
                $ref: '#/components/examples/PasswordChangeRequestXml'
      responses:
        '204':
          description: Password changed and the affected user's sessions ended.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
        '400':
          $ref: '#/components/responses/MalformedBody'
        '401':
          $ref: '#/components/responses/AuthenticationErrors'
        '403':
          $ref: '#/components/responses/ForbiddenRole'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/PasswordValidationErrors'
        '429':
          $ref: '#/components/responses/PasswordRateLimited'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /v1/users/{user_id}/deactivation:
    post:
      tags: [Users]
      operationId: deactivateUser
      summary: Deactivate a user
      description: Deactivates rather than deletes the account and ends its sessions.
      x-mosaiq-roles: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: The deactivated user.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                deactivated_user:
                  $ref: '#/components/examples/DeactivatedUserJson'
            application/xml:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                deactivated_user:
                  $ref: '#/components/examples/DeactivatedUserXml'
        '401':
          $ref: '#/components/responses/AuthenticationErrors'
        '403':
          $ref: '#/components/responses/ForbiddenRole'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '409':
          $ref: '#/components/responses/AdministratorRequired'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
    delete:
      tags: [Users]
      operationId: reactivateUser
      summary: Reactivate a user
      x-mosaiq-roles: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: The reactivated user.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                reactivated_user:
                  $ref: '#/components/examples/ReactivatedUserJson'
            application/xml:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                reactivated_user:
                  $ref: '#/components/examples/ReactivatedUserXml'
        '401':
          $ref: '#/components/responses/AuthenticationErrors'
        '403':
          $ref: '#/components/responses/ForbiddenRole'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /v1/roles:
    get:
      tags: [Roles]
      operationId: listRoles
      summary: List the read-only role vocabulary
      x-mosaiq-roles: [ADMIN, AUDITOR]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: All seven immutable role codes.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolePage'
              examples:
                roles:
                  $ref: '#/components/examples/RolesJson'
            application/xml:
              schema:
                $ref: '#/components/schemas/RolePage'
              examples:
                roles:
                  $ref: '#/components/examples/RolesXml'
        '401':
          $ref: '#/components/responses/AuthenticationErrors'
        '403':
          $ref: '#/components/responses/ForbiddenRole'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /v1/roles/{role_code}:
    get:
      tags: [Roles]
      operationId: getRole
      summary: Get one role
      x-mosaiq-roles: [ADMIN, AUDITOR]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/RoleCode'
      responses:
        '200':
          description: The requested role.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
              examples:
                role:
                  $ref: '#/components/examples/RoleJson'
            application/xml:
              schema:
                $ref: '#/components/schemas/Role'
              examples:
                role:
                  $ref: '#/components/examples/RoleXml'
        '401':
          $ref: '#/components/responses/AuthenticationErrors'
        '403':
          $ref: '#/components/responses/ForbiddenRole'
        '404':
          $ref: '#/components/responses/RoleNotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /v1/administrator-transfers:
    post:
      tags: [Administrator transfers]
      operationId: transferAdministrator
      summary: Transfer the administrator role atomically
      description: >-
        Locks the incumbent and successor, gives the incumbent the successor's
        former non-ADMIN role, and promotes the active successor in one
        transaction, so the system has exactly one administrator throughout.
      x-mosaiq-roles: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdministratorTransferRequest'
            examples:
              transfer_administrator:
                $ref: '#/components/examples/AdministratorTransferRequestJson'
          application/xml:
            schema:
              $ref: '#/components/schemas/AdministratorTransferRequest'
            examples:
              transfer_administrator:
                $ref: '#/components/examples/AdministratorTransferRequestXml'
      responses:
        '204':
          description: Administrator role transferred and both users' sessions ended.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
        '400':
          $ref: '#/components/responses/MalformedBody'
        '401':
          $ref: '#/components/responses/AuthenticationErrors'
        '403':
          $ref: '#/components/responses/ForbiddenRole'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '409':
          $ref: '#/components/responses/AdministratorTransferConflicts'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/AdministratorTransferValidationErrors'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /v1/store-assignments/{user_id}:
    get:
      tags: [Store assignments]
      operationId: getStoreAssignment
      summary: Get the stores a user is assigned to
      description: >-
        Answers the user's current assignment set, sorted ascending; the set is
        empty when the user has none. The resource is keyed by the user's own
        id, so it is not nested under `/v1/users` or `/v1/stores`; `stores` is
        another service's resource (ADR-0035). `ADMIN` and `AUDITOR` may read
        any user's assignment. A floor role may read only its own, and another
        user's id is 403 `forbidden_user` whether or not that user exists, so
        the answer never reveals which ids exist. Any other role is
        `forbidden_role`. A user whose role is not store-bound, or who is
        inactive, reads an empty set (see the PUT for the role rule).


        Services do not call this operation. They read the same rows from
        `api_users.store_assignment_v1`, on every narrowed request
        (ADR-0060). A change reaches them as described under the PUT.
      x-mosaiq-roles:
        - ADMIN
        - AUDITOR
        - SALES_ASSOCIATE
        - STORE_MANAGER
        - LOYALTY_OFFICER
        - COMMERCIAL_SUPERVISOR
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: The user's assignment set.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreAssignment'
              examples:
                assigned:
                  externalValue: ./examples/store-assignment.json
                empty:
                  externalValue: ./examples/store-assignment-empty.json
            application/xml:
              schema:
                $ref: '#/components/schemas/StoreAssignment'
              examples:
                assigned:
                  externalValue: ./examples/store-assignment.xml
                empty:
                  externalValue: ./examples/store-assignment-empty.xml
        '401':
          $ref: '#/components/responses/AuthenticationErrors'
        '403':
          $ref: '#/components/responses/StoreAssignmentForbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
    put:
      tags: [Store assignments]
      operationId: replaceStoreAssignment
      summary: Replace the stores a user is assigned to
      description: >-
        Replaces the whole set: stores not in the list are unassigned, stores in
        it are assigned, and an empty list clears the set (in XML, a request
        element with no `store_ids`). The delete and the inserts commit in one
        transaction, and two concurrent replaces for one user leave exactly one
        of the two submitted sets, never a mixture. The answer is 200 with the
        set after the replace, sorted ascending.


        A non-empty set is accepted only for a store-bound role:
        `SALES_ASSOCIATE`, `STORE_MANAGER`, `LOYALTY_OFFICER` or
        `COMMERCIAL_SUPERVISOR` (ADR-0060). For any other role, `ADMIN`
        included, it is 409 `role_not_store_bound`; an empty set is always
        accepted. The user may be inactive. A duplicate id, or an id outside
        1 through 32767, is 422 `invalid_body`. An id that names no store is
        422 `unknown_store`; users-service does not read the stores service's
        data, and the database's own foreign key refuses the id, so the set is
        left unchanged.


        **How a change reaches the services.** Nothing is pushed. Every
        narrowed operation of another service reads
        `api_users.store_assignment_v1` in the request it is serving, with no
        cache and no Redis state, and no stream carries assignments
        (ADR-0044, ADR-0060). A committed replace is therefore seen by every
        request that begins after the commit. The bound on how long a removed
        assignment can still be honoured is the requests already in flight at
        the commit: each completes under the set it read, and no request that
        starts later honours the removed store. Access-token lifetime does not
        extend the bound, because the token carries no store. The view lists
        only active users with a store-bound role, so deactivating a user or
        changing the role to one that is not store-bound ends the assignments
        at the same instant without a PUT.
      x-mosaiq-roles: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceStoreAssignmentRequest'
            examples:
              replace:
                externalValue: ./examples/replace-store-assignment.request.json
              clear:
                externalValue: ./examples/clear-store-assignment.request.json
          application/xml:
            schema:
              $ref: '#/components/schemas/ReplaceStoreAssignmentRequest'
            examples:
              replace:
                externalValue: ./examples/replace-store-assignment.request.xml
              clear:
                externalValue: ./examples/clear-store-assignment.request.xml
      responses:
        '200':
          description: The assignment set after the replace.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreAssignment'
              examples:
                replaced:
                  externalValue: ./examples/replace-store-assignment.json
                cleared:
                  externalValue: ./examples/clear-store-assignment.json
            application/xml:
              schema:
                $ref: '#/components/schemas/StoreAssignment'
              examples:
                replaced:
                  externalValue: ./examples/replace-store-assignment.xml
                cleared:
                  externalValue: ./examples/clear-store-assignment.xml
        '400':
          $ref: '#/components/responses/MalformedBody'
        '401':
          $ref: '#/components/responses/AuthenticationErrors'
        '403':
          $ref: '#/components/responses/ForbiddenRole'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '409':
          $ref: '#/components/responses/RoleNotStoreBound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/StoreAssignmentRefused'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /health/live:
    get:
      tags: [Meta]
      operationId: checkLiveness
      summary: Check process liveness
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '204':
          description: The process is live.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
  /health/ready:
    get:
      tags: [Meta]
      operationId: checkReadiness
      summary: Check schema readiness
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '204':
          description: The service schema is ready.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
        '503':
          $ref: '#/components/responses/SchemaNotReady'
  /openapi.yaml:
    get:
      tags: [Meta]
      operationId: getOpenApi
      summary: Get this OpenAPI document
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: The OpenAPI document served byte for byte.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/yaml:
              schema:
                type: string
        '406':
          $ref: '#/components/responses/NotAcceptable'
  /schema.xsd:
    get:
      tags: [Meta]
      operationId: getXmlSchema
      summary: Get the users XML schema
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: The users XSD served byte for byte.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/xml:
              schema:
                type: string
        '406':
          $ref: '#/components/responses/NotAcceptable'
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      description: >-
        Caller correlation id. A missing or invalid value is replaced by the
        service, and the response always echoes the value used.
      schema:
        type: string
        pattern: '^[0-9A-Za-z-]{1,64}$'
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RoleCode:
      name: role_code
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/RoleCode'
  headers:
    CorrelationId:
      description: Correlation id used for this response.
      required: true
      schema:
        type: string
        pattern: '^[0-9A-Za-z-]{1,64}$'
    RetryAfter:
      description: Seconds until another current-password check may be attempted.
      required: true
      schema:
        type: integer
        minimum: 1
  schemas:
    RoleCode:
      type: string
      enum:
        - ADMIN
        - ANALYST
        - STORE_MANAGER
        - MARKETING
        - INVENTORY_PLANNER
        - AUDITOR
        - CUSTOMER
    RoleCodeInput:
      type: string
      description: >-
        A syntactically valid role code. An unrecognised code is reported as
        unknown_role; ADMIN on an edit is reported as
        use_administrator_transfer.
      pattern: '^[A-Z][A-Z0-9_]*$'
      maxLength: 40
    Email:
      type: string
      format: email
      maxLength: 160
      pattern: '^[^@\s]+@[^@\s.]+(\.[^@\s.]+)+$'
      description: Matches the app_user_email_check dotted-domain grammar.
    Password:
      type: string
      minLength: 12
      writeOnly: true
    User:
      type: object
      additionalProperties: false
      required: [user_id, name, email, role_code, is_active, created_at]
      properties:
        user_id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          $ref: '#/components/schemas/Email'
        role_code:
          $ref: '#/components/schemas/RoleCode'
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
      xml:
        name: User
        namespace: https://mosaiq.maxthecoder.online/xml/users/v1
    UserPage:
      type: object
      additionalProperties: false
      required: [users, page]
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/User'
        page:
          $ref: '#/components/schemas/PageInfo'
      xml:
        name: Users
        namespace: https://mosaiq.maxthecoder.online/xml/users/v1
    Role:
      type: object
      additionalProperties: false
      required: [role_code, description]
      properties:
        role_code:
          $ref: '#/components/schemas/RoleCode'
        description:
          type: string
          minLength: 1
          maxLength: 160
      xml:
        name: Role
        namespace: https://mosaiq.maxthecoder.online/xml/users/v1
    RolePage:
      type: object
      additionalProperties: false
      required: [roles, page]
      properties:
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        page:
          $ref: '#/components/schemas/PageInfo'
      xml:
        name: Roles
        namespace: https://mosaiq.maxthecoder.online/xml/users/v1
    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [name, email, role_code, password]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          $ref: '#/components/schemas/Email'
        role_code:
          $ref: '#/components/schemas/RoleCodeInput'
        password:
          $ref: '#/components/schemas/Password'
      xml:
        name: CreateUserRequest
        namespace: https://mosaiq.maxthecoder.online/xml/users/v1
    UpdateUserRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          $ref: '#/components/schemas/Email'
        role_code:
          $ref: '#/components/schemas/RoleCodeInput'
      xml:
        name: UpdateUserRequest
        namespace: https://mosaiq.maxthecoder.online/xml/users/v1
    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required: [new_password]
      properties:
        current_password:
          $ref: '#/components/schemas/Password'
        new_password:
          $ref: '#/components/schemas/Password'
      xml:
        name: PasswordChangeRequest
        namespace: https://mosaiq.maxthecoder.online/xml/users/v1
    AdministratorTransferRequest:
      type: object
      additionalProperties: false
      required: [successor_user_id]
      properties:
        successor_user_id:
          type: string
          format: uuid
      xml:
        name: AdministratorTransferRequest
        namespace: https://mosaiq.maxthecoder.online/xml/users/v1
    StoreId:
      type: integer
      format: int32
      minimum: 1
      maximum: 32767
      description: A store's identifier, as the stores service publishes it.
    StoreAssignment:
      type: object
      additionalProperties: false
      required: [user_id, store_ids]
      properties:
        user_id:
          type: string
          format: uuid
        store_ids:
          type: array
          maxItems: 100
          uniqueItems: true
          items:
            $ref: '#/components/schemas/StoreId'
          description: Sorted ascending; empty when the user has none.
      xml:
        name: StoreAssignment
        namespace: https://mosaiq.maxthecoder.online/xml/users/v1
    ReplaceStoreAssignmentRequest:
      type: object
      additionalProperties: false
      required: [store_ids]
      properties:
        store_ids:
          type: array
          maxItems: 100
          uniqueItems: true
          items:
            $ref: '#/components/schemas/StoreId'
          description: The complete new set. An empty list clears it.
      xml:
        name: ReplaceStoreAssignmentRequest
        namespace: https://mosaiq.maxthecoder.online/xml/users/v1
    PageInfo:
      type: object
      additionalProperties: false
      required: [page, size, total]
      properties:
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
      xml:
        name: PageInfo
        namespace: https://mosaiq.maxthecoder.online/xml/common/v1
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [field, code]
      properties:
        field:
          type: string
        code:
          type: string
      xml:
        name: details
        namespace: https://mosaiq.maxthecoder.online/xml/common/v1
    Error:
      type: object
      additionalProperties: false
      required: [code, message, correlation_id]
      properties:
        code:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
        message:
          type: string
        correlation_id:
          type: string
          pattern: '^[0-9A-Za-z-]{1,64}$'
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
      xml:
        name: Error
        namespace: https://mosaiq.maxthecoder.online/xml/common/v1
  responses:
    AuthenticationErrors:
      description: The token is `invalid_token` or its session is `session_revoked`.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalid_token:
              $ref: '#/components/examples/InvalidTokenJson'
            session_revoked:
              $ref: '#/components/examples/SessionRevokedJson'
        application/xml:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalid_token:
              $ref: '#/components/examples/InvalidTokenXml'
            session_revoked:
              $ref: '#/components/examples/SessionRevokedXml'
    ForbiddenRole:
      description: The authenticated role is `forbidden_role` for this operation.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
