              $ref: '#/components/examples/ForbiddenRoleJson'
        application/xml:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            forbidden_role:
              $ref: '#/components/examples/ForbiddenRoleXml'
    MalformedBody:
      description: The body is `malformed_body` and cannot be parsed safely.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            malformed_body:
              $ref: '#/components/examples/MalformedBodyJson'
        application/xml:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            malformed_body:
              $ref: '#/components/examples/MalformedBodyXml'
    NotAcceptable:
      description: The requested response format is `not_acceptable`.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            not_acceptable:
              $ref: '#/components/examples/NotAcceptableJson'
        application/xml:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            not_acceptable:
              $ref: '#/components/examples/NotAcceptableXml'
    PayloadTooLarge:
      description: The body is `payload_too_large` because it exceeds 64 KiB.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            payload_too_large:
              $ref: '#/components/examples/PayloadTooLargeJson'
        application/xml:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            payload_too_large:
              $ref: '#/components/examples/PayloadTooLargeXml'
    UnsupportedMediaType:
      description: The request format is `unsupported_media_type`.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unsupported_media_type:
              $ref: '#/components/examples/UnsupportedMediaTypeJson'
        application/xml:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unsupported_media_type:
              $ref: '#/components/examples/UnsupportedMediaTypeXml'
    InvalidPagination:
      description: A pagination value is `invalid_pagination`.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalid_pagination:
              $ref: '#/components/examples/InvalidPaginationJson'
        application/xml:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalid_pagination:
              $ref: '#/components/examples/InvalidPaginationXml'
    DependencyUnavailable:
      description: >-
        Session state is `auth_unavailable`, or PostgreSQL is
        `database_unavailable` for this operation.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            auth_unavailable:
              $ref: '#/components/examples/AuthUnavailableJson'
            database_unavailable:
              $ref: '#/components/examples/DatabaseUnavailableJson'
        application/xml:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            auth_unavailable:
              $ref: '#/components/examples/AuthUnavailableXml'
            database_unavailable:
              $ref: '#/components/examples/DatabaseUnavailableXml'
    UserNotFound:
      description: The named account is `user_not_found`.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            user_not_found:
              $ref: '#/components/examples/UserNotFoundJson'
        application/xml:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            user_not_found:
              $ref: '#/components/examples/UserNotFoundXml'
    RoleNotFound:
      description: The named role is `role_not_found`.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            role_not_found:
              $ref: '#/components/examples/RoleNotFoundJson'
        application/xml:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            role_not_found:
              $ref: '#/components/examples/RoleNotFoundXml'
    CreateUserConflicts:
      description: >-
        The write would create a `single_administrator`, or the email is
        already `email_taken` case-insensitively.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            single_administrator:
              $ref: '#/components/examples/SingleAdministratorJson'
            email_taken:
              $ref: '#/components/examples/EmailTakenJson'
        application/xml:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            single_administrator:
              $ref: '#/components/examples/SingleAdministratorXml'
            email_taken:
              $ref: '#/components/examples/EmailTakenXml'
    UpdateUserConflicts:
      description: >-
        ADMIN changes must `use_administrator_transfer`, the email is already
        `email_taken` case-insensitively, or the administrator index reports
        `single_administrator` during a concurrent write.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            use_administrator_transfer:
              $ref: '#/components/examples/UseAdministratorTransferJson'
            email_taken:
              $ref: '#/components/examples/EmailTakenJson'
            single_administrator:
              $ref: '#/components/examples/SingleAdministratorJson'
        application/xml:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            use_administrator_transfer:
              $ref: '#/components/examples/UseAdministratorTransferXml'
            email_taken:
              $ref: '#/components/examples/EmailTakenXml'
            single_administrator:
              $ref: '#/components/examples/SingleAdministratorXml'
    AdministratorRequired:
      description: The only administrator is `administrator_required` and cannot be deactivated.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            administrator_required:
              $ref: '#/components/examples/AdministratorRequiredJson'
        application/xml:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            administrator_required:
              $ref: '#/components/examples/AdministratorRequiredXml'
    CreateUserValidationErrors:
      description: >-
        The body is `invalid_body`, including an email outside the database
        grammar or a password shorter than 12 characters, or names an
        `unknown_role`.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalid_body:
              $ref: '#/components/examples/InvalidBodyJson'
            unknown_role:
              $ref: '#/components/examples/UnknownRoleJson'
        application/xml:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalid_body:
              $ref: '#/components/examples/InvalidBodyXml'
            unknown_role:
              $ref: '#/components/examples/UnknownRoleXml'
    UpdateUserValidationErrors:
      description: >-
        The body is `invalid_body`, including an email outside the database
        grammar, or names an `unknown_role`.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalid_body:
              $ref: '#/components/examples/InvalidBodyJson'
            unknown_role:
              $ref: '#/components/examples/UnknownRoleJson'
        application/xml:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalid_body:
              $ref: '#/components/examples/InvalidBodyXml'
            unknown_role:
              $ref: '#/components/examples/UnknownRoleXml'
    PasswordValidationErrors:
      description: >-
        The body is `invalid_body`, including a password shorter than 12
        characters, or the supplied current password is
        `invalid_current_password`.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalid_body:
              $ref: '#/components/examples/InvalidBodyJson'
            invalid_current_password:
              $ref: '#/components/examples/InvalidCurrentPasswordJson'
        application/xml:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalid_body:
              $ref: '#/components/examples/InvalidBodyXml'
            invalid_current_password:
              $ref: '#/components/examples/InvalidCurrentPasswordXml'
    PasswordRateLimited:
      description: Current-password checks are `rate_limited` after more than 5 failures in 15 minutes.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            rate_limited:
              $ref: '#/components/examples/RateLimitedJson'
        application/xml:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            rate_limited:
              $ref: '#/components/examples/RateLimitedXml'
    AdministratorTransferConflicts:
      description: >-
        The successor is `successor_inactive`, or the administrator index
        reports `single_administrator` during a concurrent write.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            successor_inactive:
              $ref: '#/components/examples/SuccessorInactiveJson'
            single_administrator:
