            $ref: '#/components/schemas/Error'
          examples:
            successor_inactive:
              $ref: '#/components/examples/SuccessorInactiveXml'
            single_administrator:
              $ref: '#/components/examples/SingleAdministratorXml'
    AdministratorTransferValidationErrors:
      description: >-
        The body is `invalid_body`, or the successor is `invalid_successor`
        because it is missing or is the incumbent.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalid_body:
              $ref: '#/components/examples/InvalidBodyJson'
            invalid_successor:
              $ref: '#/components/examples/InvalidSuccessorJson'
        application/xml:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalid_body:
              $ref: '#/components/examples/InvalidBodyXml'
            invalid_successor:
              $ref: '#/components/examples/InvalidSuccessorXml'
    SchemaNotReady:
      description: The required database schema is `schema_not_ready`.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            schema_not_ready:
              $ref: '#/components/examples/SchemaNotReadyJson'
        application/xml:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            schema_not_ready:
              $ref: '#/components/examples/SchemaNotReadyXml'
    StoreAssignmentForbidden:
      description: >-
        The role is `forbidden_role` for this operation, or a floor role asked for another user and gets `forbidden_user`.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            forbidden_role:
              externalValue: ./examples/forbidden-role.json
            forbidden_user:
              externalValue: ./examples/forbidden-user.json
        application/xml:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            forbidden_role:
              externalValue: ./examples/forbidden-role.xml
            forbidden_user:
              externalValue: ./examples/forbidden-user.xml
    RoleNotStoreBound:
      description: >-
        The user's role is `role_not_store_bound`, so a non-empty set is refused.
