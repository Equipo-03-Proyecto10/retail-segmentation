# Closed vocabularies that grow inside v1 (ADR-0076). contracts/check.sh
# excuses an added enum value only when an entry here names the service, the
# exact contract version that adds it, and the value. An entry stops applying
# as soon as that contract moves to another version, so it never covers a
# later change. Remove an entry once its version is merged and superseded.
entries:
  - adr: ADR-0076
    service: auth
    version: 1.1.0
    values: [SALES_ASSOCIATE, LOYALTY_OFFICER, COMMERCIAL_SUPERVISOR]
  - adr: ADR-0076
    service: users
    version: 1.3.0
    values: [SALES_ASSOCIATE, LOYALTY_OFFICER, COMMERCIAL_SUPERVISOR]
  - adr: ADR-0082
    service: audit-trail
    version: 1.3.0
    values: [loyalty_card, product_attribute, product_barcode, product_relation, product_status, store_assignment, store_channel, store_channel_set, store_commercial_rule, store_hours, store_hours_interval, store_status]
  - adr: ADR-0083
    service: audit-trail
    version: 1.4.0
    values: [RULE_SET_CREATED, RULE_SET_EDITED, RULE_SET_VERSIONED, RULE_SET_PUBLISHED, rule_set]
  - adr: ADR-0088
    service: audit-trail
    version: 1.5.0
    values: [DRIFT]
