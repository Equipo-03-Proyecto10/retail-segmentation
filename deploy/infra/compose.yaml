# The infrastructure project (ADR-0040): the two Redis instances of ADR-0037,
# for the services only. The web never connects to either (Q-12).
#
# Neither publishes a port. Both join the external network `mosaiq`, which
# every service's own project joins too; it is created once with
# `docker network create mosaiq` (deploy/infra/README.md).
#
# Both run the same official image, on the 7.4 line, pinned to an exact patch
# tag and its multi-architecture digest. Changing it is a pull request of its
# own. They run as the image's own `redis` user (999:1000) from the start, with
# no capabilities and a read-only root filesystem.
name: mosaiq-infra

services:
  redis-state:
    image: redis:7.4.11-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    user: "999:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # 64 MB of data plus headroom for the AOF rewrite's fork.
    mem_limit: 96m
    restart: unless-stopped
    volumes:
      - ./redis/redis-state.conf:/usr/local/etc/redis/redis.conf:ro
      - ${MOSAIQ_REDIS_ACL_DIR:-/etc/mosaiq/redis}:/etc/redis/acl:ro
      # The AOF survives a restart and a container replacement.
      - redis-state-data:/data
    networks: [mosaiq]

  redis-cache:
    image: redis:7.4.11-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    user: "999:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 160m
    restart: unless-stopped
    volumes:
      - ./redis/redis-cache.conf:/usr/local/etc/redis/redis.conf:ro
      - ${MOSAIQ_REDIS_ACL_DIR:-/etc/mosaiq/redis}:/etc/redis/acl:ro
    # Nothing is persisted; /data only has to exist and be writable.
    tmpfs:
      - /data:uid=999,gid=1000,mode=0700
    networks: [mosaiq]

volumes:
  redis-state-data:

networks:
  mosaiq:
    external: true
