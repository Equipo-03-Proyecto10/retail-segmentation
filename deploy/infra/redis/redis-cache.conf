# redis-cache (ADR-0037): only what PostgreSQL or MongoDB can rebuild. The
# least recently used key goes under pressure, whatever its prefix, and
# nothing is persisted: a restart comes back empty and caches refill on
# demand. Losing it costs latency, never correctness.

# Reachable only on the `mosaiq` network: compose publishes no port. Every
# client authenticates as an ACL user and the default user is off.
bind * -::*
port 6379
protected-mode no

# The same aclfile as redis-state: one ACL LOAD per instance, the same users.
aclfile /etc/redis/acl/users.acl

maxmemory 128mb
maxmemory-policy allkeys-lru

appendonly no
save ""
dir /data
