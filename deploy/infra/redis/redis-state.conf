# redis-state (ADR-0037): everything whose loss is a defect. Sessions,
# liveness keys, rate limits and the inter-service streams. It never evicts:
# when full, writes fail with OOM and reads, including every liveness EXISTS,
# keep working. It persists to AOF, so a restart brings sessions, streams and
# consumer-group positions back, losing at most about one second of writes.

# Reachable only on the `mosaiq` network: compose publishes no port. Every
# client authenticates as an ACL user and the default user is off, so the
# protected-mode fallback for an open default user has nothing to protect.
bind * -::*
port 6379
protected-mode no

# One aclfile for both instances, assembled from every installed service's
# line by deploy/infra/redis/assemble-acl.sh and reloaded with ACL LOAD, with
# no restart. Its directory is mounted read-only.
aclfile /etc/redis/acl/users.acl

maxmemory 64mb
maxmemory-policy noeviction

appendonly yes
appendfsync everysec
save ""
dir /data
