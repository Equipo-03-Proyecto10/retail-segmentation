# Cloudflare edge ranges — trusted sources for the real client IP (ADR-0013).
#
# Included by deploy/nginx/mosaiq.conf on the instance. With Cloudflare proxying
# in front, every connection to the origin comes from one of these ranges;
# `real_ip_header CF-Connecting-IP` then restores the true visitor address into
# $remote_addr, the access log and X-Forwarded-For.
#
# This list changes rarely. Regenerate it (and re-check the GCP firewall rule
# that pins :443 to the same ranges) with:
#
#   { curl -s https://www.cloudflare.com/ips-v4; curl -s https://www.cloudflare.com/ips-v6; } \
#     | sed 's/^/set_real_ip_from /; s/$/;/'
#
# Captured 2026-09-07 from https://www.cloudflare.com/ips-v4 and /ips-v6.

