# MOSAIQ reverse proxy — LOCAL verification only.
#
# Used by compose.proxy.yaml to put a real NGINX in front of the `web`
# container so the proxy can be checked without the instance. Differences from
# the instance file (deploy/nginx/mosaiq.conf):
#   - upstream is the `web` service on the compose network, not 127.0.0.1;
#   - HTTP only — there is no TLS locally, so no redirect and no :443 block
#     (the instance file's forced HTTPS is F6-03);
#   - logs left on the container's stdout/stderr.
#
# Keep the proxy behaviour (headers, body size, upstream settings) in sync.

# The CSP below reads this variable. There is no /docs/ location in this
# overlay, so the chart-example exception the instance file adds is not needed.
map $uri $mosaiq_script_sources {
    default "'self'";
}

# Keep the client dimension shared by all application workers. Only credential
# submissions consume it: login page views and HEAD probes carry an empty key.
map $request_method $mosaiq_login_rate_key {
    default "";
    POST $binary_remote_addr;
}
limit_req_zone $mosaiq_login_rate_key zone=mosaiq_login:10m rate=6r/m;

upstream mosaiq_app {
    server web:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # Same security headers as the instance file (deploy/nginx/mosaiq.conf).
    # tests/test_nginx_security_headers.py fails if the two ever differ.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src $mosaiq_script_sources; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Remove Flask's copies before NGINX adds the proxy-boundary policy. A
    # browser intersects duplicate CSP headers, so passing both would make the
    # chart exception in $mosaiq_script_sources ineffective.
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Permissions-Policy;

    # Above Flask's limit (5,308,416 bytes) so the branded 413 is reachable;
    # same value as deploy/nginx/mosaiq.conf (#292).
    client_max_body_size 6m;
    server_tokens off;

    location / {
        proxy_pass http://mosaiq_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # $http_host, not $host: this overlay is published on 8080, $host drops
        # the port, and the browser's Origin keeps it, so every POST would
        # fail the CSRF Origin check (ADR-0025). The instance serves on 443,
        # where the two are the same.
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header Connection        "";

        proxy_redirect off;
    }

    location = /login {
        limit_req zone=mosaiq_login burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://mosaiq_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header Connection        "";
        proxy_redirect off;
    }
}
