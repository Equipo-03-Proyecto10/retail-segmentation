# MOSAIQ reverse proxy — LOCAL verification only.
#
# Used by compose.proxy.yaml to put a real NGINX in front of the `web`
# container so F6-01 can be checked without the instance. It differs from the
# instance file (deploy/nginx/mosaiq.conf) in exactly one way: the upstream is
# the `web` service on the compose network, not 127.0.0.1. Logs are left on
# the container's stdout/stderr.
#
# Keep the two files in sync when the proxy behaviour changes.

upstream mosaiq_app {
    server web:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 5m;

    location / {
        proxy_pass http://mosaiq_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        proxy_redirect off;
    }
}
