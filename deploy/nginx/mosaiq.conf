# MOSAIQ reverse proxy — F6-01 (#77) + forced HTTPS F6-03 (#79).
# ADR-0009 (NGINX), ADR-0013 (published through Cloudflare with an origin cert).
#
# This is the INSTANCE file. Deploy it to /etc/nginx/conf.d/mosaiq.conf on
# mosaiq-deployment-vm; the steps are in deploy/README.md. gunicorn under
# systemd listens on 127.0.0.1:8000 (F6-02, #78).
#
# `nginx -t` fails until the certificate exists at the paths below. On the
# instance that certificate is a Cloudflare Origin CA pair (ADR-0013, Path C in
# deploy/README.md); the runbook writes it before reloading. Path A (Let's
# Encrypt) and Path B (self-signed) remain documented fallbacks.
#
# The compose variant deploy/nginx/mosaiq.compose.conf stays HTTP-only: there
# is no TLS locally, so it does not carry the redirect or the :443 block.

# Trust Cloudflare's edge addresses so $remote_addr, the access log and the
# X-Forwarded-For sent to gunicorn carry the real visitor, not a Cloudflare
# 104.x/172.x edge IP (ADR-0013). Regenerate the range list per the header of
# that file. Not used by the compose overlay — no Cloudflare in front locally.
include conf.d/cloudflare-real-ip.conf;
real_ip_header CF-Connecting-IP;

# The published chart examples use their pinned library and inline setup.
# Application pages retain the same-origin script policy.
map $uri $mosaiq_script_sources {
    default "'self'";
    ~^/docs/design-system/charts/ "'self' 'unsafe-inline' https://unpkg.com";
}

# Keep the client dimension shared by both Gunicorn workers. Only credential
# submissions consume it: login page views and HEAD probes carry an empty key.
map $request_method $mosaiq_login_rate_key {
    default "";
    POST $binary_remote_addr;
}
limit_req_zone $mosaiq_login_rate_key zone=mosaiq_login:10m rate=6r/m;

upstream mosaiq_app {
    server 127.0.0.1:8000;
    keepalive 16;
}

# HTTP: redirect everything to HTTPS. Behind Cloudflare the edge already does
# this ("Always Use HTTPS"), so this block only fires for a request that reaches
# the origin directly. The ACME location is kept for the Let's Encrypt fallback
# (Path A) and is inert while the origin cert is Cloudflare's.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name mosaiq.maxthecoder.online;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/lib/nginx/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: terminate TLS and proxy to the application.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name mosaiq.maxthecoder.online;

    # On the instance this is a Cloudflare Origin CA pair, generated in the
    # Cloudflare dashboard and valid for 15 years (ADR-0013, Path C). It is
    # trusted only by Cloudflare — which is all that connects here — and the
    # public certificate visitors see is Cloudflare's managed edge certificate.
    # Path A (certbot at /etc/letsencrypt/live/<host>/) and Path B (a self-signed
    # pair) write the same two paths; see deploy/README.md.
    ssl_certificate     /etc/nginx/tls/mosaiq.crt;
    ssl_certificate_key /etc/nginx/tls/mosaiq.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:MOSAIQ:10m;
    ssl_session_timeout 1d;

    # Sent only over HTTPS. The app also marks the session cookie Secure
    # (SESSION_COOKIE_SECURE=true, F4-04), already set on the instance.
    #
    # The visitor-facing certificate is Cloudflare's managed, auto-renewing
    # edge certificate (ADR-0013), so the chain is stable enough for the full
    # one-year policy. Subdomains are part of the MOSAIQ deployment boundary.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src $mosaiq_script_sources; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Flask sends the same baseline for direct and alternate application
    # paths. Hide those upstream copies at the TLS boundary so the browser
    # receives one policy per header. This matters for CSP: duplicate policies
    # are intersected, which would otherwise cancel the chart exception in
    # $mosaiq_script_sources.
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Permissions-Policy;

    # Must stay strictly above what Flask accepts: MAX_UPLOAD_BYTES (5 MiB in
    # .env.example) plus FORM_OVERHEAD_BYTES (64 KiB) = 5,308,416 bytes. At 5m
    # NGINX cut requests off first and sent its own stock 413 page, so the
    # branded MOSAIQ 413 (web/errors.py) could never be reached (#292, F3-07).
    # tests/test_nginx_body_limit.py fails if this drops below Flask's limit.
    client_max_body_size 6m;
    server_tokens off;

    access_log /var/log/nginx/mosaiq.access.log;
    error_log  /var/log/nginx/mosaiq.error.log;

    # F6-04 (#80): documentation and evidence, published on this same host.
    # A copy of the repository's docs/ folder, kept current by the deploy
    # runbook step below — never generated at request time.
    location /docs/ {
        alias /opt/mosaiq/docs/;
        autoindex on;

        # NGINX's mime.types has no entry for .md, so these fell to the http
        # block's `default_type application/octet-stream` and every documentation
        # link downloaded a file instead of showing one. `default_type` only
        # applies to extensions the map does not know, so .css, .png and .html
        # under this path keep the types they already had — a `types { … }` block
        # here would replace the inherited map instead of adding to it, and break
        # exactly those.
        default_type text/plain;
        charset utf-8;
    }

    location / {
        proxy_pass http://mosaiq_app;
        proxy_http_version 1.1;

        # $remote_addr is the real visitor here: the real_ip block above has
        # already replaced Cloudflare's edge IP with CF-Connecting-IP. Forward
        # exactly that one value so ProxyFix (x_for=TRUSTED_PROXY_HOPS=1, one
        # proxy = this NGINX) resolves the client correctly and a caller cannot
        # prepend a forged hop.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        proxy_redirect off;
    }

    # Login is the only endpoint that accepts repeated credential attempts.
    # A small burst keeps normal browser retries usable; excess requests are
    # rejected immediately with 429 rather than queued until they time out.
    location = /login {
        limit_req zone=mosaiq_login burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://mosaiq_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";
        proxy_redirect off;
    }
}
