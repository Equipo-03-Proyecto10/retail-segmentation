# MOSAIQ reverse proxy — F6-01 (issue #77), decision ADR-0009.
#
# This is the INSTANCE file. Deploy it to /etc/nginx/conf.d/mosaiq.conf on
# mosaiq-deployment-vm; the steps are in deploy/README.md. NGINX listens on
# :80, gunicorn under systemd listens on 127.0.0.1:8000 (F6-02, issue #78).
#
# HTTP only. The HTTP->HTTPS redirect and the certificate are F6-03 (issue
# #79); they extend this same file.
#
# The compose variant used for local verification is deploy/nginx/
# mosaiq.compose.conf — it differs only in the upstream target.

upstream mosaiq_app {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Matches MAX_UPLOAD_BYTES in .env.example (5 MiB). Without this NGINX
    # rejects an upload with 413 before it reaches the application (F3-07).
    client_max_body_size 5m;

    access_log /var/log/nginx/mosaiq.access.log;
    error_log  /var/log/nginx/mosaiq.error.log;

    location / {
        proxy_pass http://mosaiq_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        proxy_redirect off;
    }
}
