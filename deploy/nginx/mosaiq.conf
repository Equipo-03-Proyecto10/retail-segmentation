# MOSAIQ reverse proxy — F6-01 (#77) + forced HTTPS F6-03 (#79). ADR-0009.
#
# This is the INSTANCE file. Deploy it to /etc/nginx/conf.d/mosaiq.conf on
# mosaiq-deployment-vm; the steps are in deploy/README.md. gunicorn under
# systemd listens on 127.0.0.1:8000 (F6-02, #78).
#
# `nginx -t` fails until the certificate exists at the paths below — the
# runbook issues it (certbot, or a self-signed pair) before reloading.
#
# The compose variant deploy/nginx/mosaiq.compose.conf stays HTTP-only: there
# is no TLS locally, so it does not carry the redirect or the :443 block.

upstream mosaiq_app {
    server 127.0.0.1:8000;
    keepalive 16;
}

# HTTP: redirect everything to HTTPS, except the ACME HTTP-01 challenge that
# certbot uses to issue and renew the certificate.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/lib/nginx/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: terminate TLS and proxy to the application.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    # certbot manages these when the published host has a real name (it points
    # them at /etc/letsencrypt/live/<host>/); otherwise the runbook writes a
    # self-signed pair here. Only a real certificate satisfies the #79 AC.
    ssl_certificate     /etc/nginx/tls/mosaiq.crt;
    ssl_certificate_key /etc/nginx/tls/mosaiq.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:MOSAIQ:10m;
    ssl_session_timeout 1d;

    # Sent only over HTTPS. The app also marks the session cookie Secure
    # (SESSION_COOKIE_SECURE=true, F4-04) once this block is live.
    #
    # Deliberately short. A browser remembers HSTS, and the policy cannot be
    # withdrawn early: if the certificate lapses or changes while a long
    # max-age is still cached, that browser refuses the site outright, with no
    # click-through, until the policy expires. The certificate here is
    # self-signed and accepted as the delivery state (#79), so nothing has
    # proven stable yet. Raise this to 31536000 once a real certificate has
    # renewed itself at least once.
    add_header Strict-Transport-Security "max-age=300" always;

    # Matches MAX_UPLOAD_BYTES in .env.example (5 MiB). Without this NGINX
    # rejects an upload with 413 before it reaches the application (F3-07).
    client_max_body_size 5m;

    access_log /var/log/nginx/mosaiq.access.log;
    error_log  /var/log/nginx/mosaiq.error.log;

    # F6-04 (#80): documentation and evidence, published on this same host.
    # A copy of the repository's docs/ folder, kept current by the deploy
    # runbook step below — never generated at request time.
    location /docs/ {
        alias /opt/mosaiq/docs/;
        autoindex on;
    }

    location / {
        proxy_pass http://mosaiq_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        proxy_redirect off;
    }
}
