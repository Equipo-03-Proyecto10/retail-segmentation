# MOSAIQ — PostgreSQL listener and authentication (F1-04, #52).
#
# Goes to /var/lib/pgsql/18/data/conf.d/mosaiq.conf, which the stock
# postgresql.conf reads through an `include_dir = 'conf.d'` line appended once
# when this file is first applied. README.md in this directory has the steps
# and the checks.
#
# Every value here is what PostgreSQL already defaults to. They are written out
# anyway: reading the configuration should show a decision, not an inherited
# default, and a future package upgrade must not be able to move the listener
# without the change showing up in this repository.

# The application, PostgreSQL and NGINX all run on the one instance
# (docs/scope.md §3), so nothing needs to reach the database across the network.
# Workstation access goes through SSH to this same loopback listener, so no
# database port is opened in GCP or firewalld.
listen_addresses = 'localhost'          # resolves to 127.0.0.1 and ::1
port = 5432

# SCRAM rather than the deprecated md5: what the database stores is a verifier
# that does not let a reader authenticate elsewhere as the application role.
password_encryption = 'scram-sha-256'
