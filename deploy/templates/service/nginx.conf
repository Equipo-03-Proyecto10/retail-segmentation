# NGINX include of one service (ADR-0040), rendered by render.py into
# services/__NAME__/nginx/__NAME__.conf. The deploy installs it into the 443
# server block of deploy/nginx/mosaiq.conf, whose http context declares the
# maps used here: $mosaiq_error_format, $mosaiq_correlation_id and, for auth,
# the mosaiq_auth_signin zone. Lines marked `#auth# ` are auth's alone.

location /api/__NAME__/ {
    # The trailing slash strips /api/__NAME__, so the service sees /v1/...
    proxy_pass http://127.0.0.1:__PORT__/;
    proxy_http_version 1.1;

    # Overwritten, never appended: cloudflare-real-ip.conf has already put the
    # real visitor in $remote_addr, and a caller cannot prepend a forged hop.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-ID $mosaiq_correlation_id;
    proxy_set_header Connection "";
    proxy_redirect off;

    # Every service caps bodies at 64 KiB. NGINX refuses a larger one before
    # the service sees it, so its refusal carries the shared error envelope
    # (ADR-0035), not NGINX's own HTML page.
    client_max_body_size 64k;
    error_page 413 @mosaiq___NAME___413_$mosaiq_error_format;

    #auth# # Credential attempts, as the web limits /login. The zone's key is
    #auth# # empty for all but POST /api/auth/v1/sessions; nothing else counts.
    #auth# limit_req zone=mosaiq_auth_signin burst=5 nodelay;
    #auth# limit_req_status 429;
    #auth# error_page 429 @mosaiq_auth_429_$mosaiq_error_format;
}

# The named locations repeat the server block's security headers, because an
# add_header here drops the inherited ones, and each carries `always`, because
# NGINX sends none on a 413 or 429 otherwise.
location @mosaiq___NAME___413_json {
    default_type application/json;
    add_header X-Correlation-ID $mosaiq_correlation_id always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src $mosaiq_script_sources; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    return 413 '{"code":"payload_too_large","message":"The request body exceeds 64 KiB.","correlation_id":"$mosaiq_correlation_id","details":[]}';
}

location @mosaiq___NAME___413_xml {
    default_type application/xml;
    add_header X-Correlation-ID $mosaiq_correlation_id always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src $mosaiq_script_sources; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    return 413 '<?xml version="1.0" encoding="UTF-8"?>\n<Error xmlns="https://mosaiq.maxthecoder.online/xml/common/v1"><code>payload_too_large</code><message>The request body exceeds 64 KiB.</message><correlation_id>$mosaiq_correlation_id</correlation_id></Error>\n';
}

