[project]
name = "ops-console"
version = "0.1.0"
description = "MOSAIQ ops-console: a status panel over the services' meta routes (ADR-0055)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "flask==3.1.3",
    "gunicorn==23.0.0",
    "httpx==0.28.1",
    "pyyaml==6.0.3",
    "redis==7.0.1",
]

[dependency-groups]
dev = [
    "black==26.5.1",
    "pytest==9.1.1",
    "ruff==0.8.4",
]

[tool.uv]
package = false

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
