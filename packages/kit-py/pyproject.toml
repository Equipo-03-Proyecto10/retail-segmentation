[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[project]
name = "mosaiq-kit"
version = "0.1.0"
description = "Shared transport and infrastructure mechanisms for MOSAIQ Flask services"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Flask==3.1.2",
    "jsonschema[format-nongpl]==4.25.1",
    "lxml==6.0.2",
    "psycopg[binary,pool]==3.2.12",
    "PyJWT[crypto]==2.10.1",
    "PyYAML==6.0.3",
    "redis==7.0.1",
]

[dependency-groups]
dev = [
    "black==24.10.0",
    "pytest==8.3.4",
    "ruff==0.8.4",
]

[tool.black]
line-length = 88
target-version = ["py312"]
extend-exclude = "example/contracts/common|example/wheels"

[tool.ruff]
extend = "../../pyproject.toml"
extend-exclude = ["example/contracts/common", "example/wheels"]

[tool.ruff.lint]
extend-select = ["S608"]

[tool.pytest.ini_options]
testpaths = ["tests"]
