[package]
name = "mosaiq-kit"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "MOSAIQ's mechanism-only service kit for Rust services: the behaviour of mosaiq-kit (Python) on axum."
license = "UNLICENSED"
publish = false

# One crate, pinned by tag from each service (README.md). No [workspace]:
# services never share a Cargo workspace (ADR-0040).

[dependencies]
axum = "0.8"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
form_urlencoded = "1"
futures = "0.3"
http = "1"
indexmap = "2"
quick-xml = "0.38"
rand = "0.9"
regex = "1"
rust_decimal = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["catch-panic"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }

[dev-dependencies]
http-body-util = "0.1"
serde_json = "1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
