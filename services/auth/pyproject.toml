[project]
name = "auth-service"
version = "0.1.0"
description = "MOSAIQ auth-service: RS256 sessions, refresh rotation and revocation (RN-52)"
requires-python = ">=3.12"
dependencies = [
    "mosaiq-kit @ git+https://github.com/Equipo-03-Proyecto10/retail-segmentation@kit-py/v0.1.2#subdirectory=packages/kit-py",
    "argon2-cffi==23.1.0",
    "gunicorn==23.0.0",
]

[dependency-groups]
dev = [
    "black==26.5.1",
    "pytest==9.1.1",
    "ruff==0.8.4",
]

[tool.uv]
package = false

[tool.black]
line-length = 88
target-version = ["py312"]
extend-exclude = "contracts"

[tool.ruff]
extend = "../../pyproject.toml"
extend-exclude = ["contracts"]

[tool.ruff.lint]
extend-select = ["S608"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
known-third-party = ["redis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "postgres: needs TEST_DATABASE_URL or the documented local PostgreSQL instance",
    "redis: needs AUTH_TEST_REDIS_URL or the documented local Redis instance",
]
