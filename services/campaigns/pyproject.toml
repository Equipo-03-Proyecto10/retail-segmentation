[project]
name = "campaigns-service"
version = "0.1.0"
description = "MOSAIQ campaigns-service: the campaign state machine, edited only in DRAFT, activated only before it ends and while every experiment is ready (RN-15, RN-16, RN-22, RN-24, RN-31, RN-32, RN-49)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mosaiq-kit @ git+https://github.com/Equipo-03-Proyecto10/retail-segmentation@kit-py/v0.1.6#subdirectory=packages/kit-py",
    "gunicorn==23.0.0",
]

[dependency-groups]
dev = [
    "black==26.5.1",
    "pytest==9.1.1",
    "ruff==0.8.4",
]

[tool.uv]
package = false

[tool.black]
line-length = 88
target-version = ["py312"]
extend-exclude = "contracts"

[tool.ruff]
extend = "../../pyproject.toml"
extend-exclude = ["contracts"]

[tool.ruff.lint]
extend-select = ["S608"]

[tool.ruff.lint.isort]
# redis/ holds the ACL line; the import is the client library.
known-first-party = ["app", "tests"]
known-third-party = ["redis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "postgres: needs TEST_DATABASE_URL, the owner's URL to a database built by the three scripts (CI's services job sets it)",
]
