[project]
name = "customers-service"
version = "0.1.3"
description = "MOSAIQ customers-service: registers, searches and corrects customers under RN-08"
requires-python = ">=3.12"
dependencies = [
    "mosaiq-kit @ git+https://github.com/Equipo-03-Proyecto10/retail-segmentation@kit-py/v0.1.1#subdirectory=packages/kit-py",
    "gunicorn==23.0.0",
]

[dependency-groups]
dev = [
    "black==26.5.1",
    "pytest==9.1.1",
    "ruff==0.8.4",
]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint]
extend-select = ["S608"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "postgres: needs the seeded PostgreSQL named by TEST_DATABASE_URL",
]
