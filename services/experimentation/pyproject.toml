[project]
name = "experimentation-service"
version = "0.1.0"
description = "MOSAIQ experimentation: an experiment is planned and frozen before assignment, measurement facts are append-only, and an effect is claimed only against a control (RN-23, RN-24, RN-25, RN-27, RN-42, RN-48, RN-49, RN-67)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mosaiq-kit @ git+https://github.com/Equipo-03-Proyecto10/retail-segmentation@kit-py/v0.1.7#subdirectory=packages/kit-py",
    "gunicorn==23.0.0",
]

[dependency-groups]
dev = [
    "black==26.5.1",
    "pytest==9.1.1",
    "ruff==0.8.4",
]

[tool.uv]
package = false

[tool.black]
line-length = 88
target-version = ["py312"]
extend-exclude = "contracts"

[tool.ruff]
extend = "../../pyproject.toml"
extend-exclude = ["contracts"]

[tool.ruff.lint]
extend-select = ["S608"]

[tool.ruff.lint.isort]
# redis/ holds the ACL line; the import is the client library.
known-first-party = ["app", "tests"]
known-third-party = ["redis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "postgres: needs TEST_DATABASE_URL, the owner's URL to a database built by the three scripts (CI's services job sets it)",
]
