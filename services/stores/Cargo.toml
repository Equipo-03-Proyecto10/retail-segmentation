[package]
name = "stores"
version = "0.1.3"
edition = "2021"
rust-version = "1.90"
publish = false

[dependencies]
axum = "0.8.4"
chrono = { version = "0.4.41", features = ["serde"] }
form_urlencoded = "1.2.1"
indexmap = "2.10.0"
mosaiq-kit = { git = "https://github.com/Equipo-03-Proyecto10/retail-segmentation", tag = "kit-rs/v0.1.5" }
redis = { version = "0.32.4", default-features = false, features = ["aio", "tokio-comp"] }
rust_decimal = { version = "1.37.2", features = ["db-tokio-postgres", "serde-with-float"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.47.1", features = ["macros", "net", "rt-multi-thread"] }
tokio-postgres = { version = "0.7.13", features = ["with-chrono-0_4", "with-uuid-1"] }
tracing = "0.1.41"
uuid = "1.17.0"

[dev-dependencies]
jsonwebtoken = "9.3.1"
