# Alembic configuration for the retail segmentation web system.
#
# There is deliberately no sqlalchemy.url here. The connection string is read
# from DATABASE_MIGRATION_URL by migrations/env.py, for two reasons:
#
#   1. No secrets in source (AGENTS.md).
#   2. Migrations run as the schema owner, the application runs as a restricted
#      role that cannot UPDATE audit_log. Two roles, two DSNs (D-14). Putting a
#      URL here would make it trivially easy to run the application as owner and
#      turn the append-only audit trail into decoration.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# Revision filenames sort chronologically and read as a changelog.
file_template = %%(rev)s_%%(slug)s

# Timestamps in migration headers are UTC; the platform stores UTC everywhere
# and renders America/Monterrey at the edge.
timezone = UTC

[post_write_hooks]
hooks = black,ruff
black.type = console_scripts
black.entrypoint = black
black.options = REVISION_SCRIPT_FILENAME
ruff.type = console_scripts
ruff.entrypoint = ruff
ruff.options = check --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
