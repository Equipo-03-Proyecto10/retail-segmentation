<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}{{ application_name }}{% endblock %}</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/app.css') }}"
    />
  </head>
  <body>
    <header class="masthead">
      <a class="masthead__brand" href="{{ url_for('home.index') }}">
        {{ application_name }}
      </a>
    </header>

    <main class="page">{% block content %}{% endblock %}</main>

    <footer class="colophon">
      <p>{{ application_name }} · Team 03</p>
    </footer>
  </body>
</html>
